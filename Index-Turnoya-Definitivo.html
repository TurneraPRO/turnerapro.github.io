// ---------- WHATSAPP ARGENTINA - 10 DIGITOS ----------
function normalizeWA(input){
  let d=String(input||'').replace(/\D/g,'');
  if(!d) return {ok:false, normalized:'', display:''};
  // +54 9 11 1234 5678 -> 5491112345678 (13)
  if(d.startsWith('549') && d.length===13) return {ok:true, normalized:d, display:formatWA(d)};
  // 54 11 1234 5678 (12, falta el 9) -> agregar 9
  if(d.startsWith('54') && d.length===12) { d='549'+d.slice(2); return {ok:true, normalized:d, display:formatWA(d)}; }
  // 0 11 1234 5678 (11) -> sacar 0
  if(d.startsWith('0')) d=d.slice(1);
  // 11 15 1234 5678 (12 con 15) -> sacar el 15 despues del area
  if(d.length===12 && d.slice(2,4)==='15') d=d.slice(0,2)+d.slice(4);
  // 11 1234 5678 (10) -> caso principal
  if(d.length===10) { d='549'+d; return {ok:true, normalized:d, display:formatWA(d)}; }
  // 15 1234 5678 (10 con 15 sin area) no se puede saber area -> invalido
  return {ok:false, normalized:'', display:''};
}
function formatWA(n){ // 5491112345678 -> +54 9 11 1234 5678
  if(!n || n.length!==13) return n;
  return '+54 9 '+n.slice(3,5)+' '+n.slice(5,9)+' '+n.slice(9);
}

}

function horarioParaFecha(b, fechaStr){
  const h=getHorarios(b);
  // 1. Dia suelto pisa todo
  const suelto=(h.diasSueltos||[]).find(x=>x.fecha===fechaStr);
  if(suelto){
    if(suelto.tipo==='cerrado') return {cerrado:true, motivo:suelto.motivo||'Cerrado'};
    return {cerrado:false, inicio:suelto.inicio, fin:suelto.fin, motivo:suelto.motivo||'Horario especial'};
  }
  // 2. Mes completo pisa plantilla si es ese mes
  if(h.mesCompleto && h.mesCompleto.mes){
    const mesFecha=fechaStr.slice(0,7);
    if(mesFecha===h.mesCompleto.mes){
      const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];

      return {cerrado:true, motivo:'Cerrado este mes'};
    }
  }
  // 3. Plantilla habitual
  const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];

  if(!p || !p.on) return {cerrado:true, motivo:'Cerrado'};

}

async function saveBiz(editSlug){
  const name=$('#fName').value.trim(); if(!name) return alert('Poné el nombre');
  const slug=slugify($('#fSlug').value||name); const cat=$('#fCat').value; const color=$('#fColor').value; const barrio=$('#fBarrio').value.trim(); const zona=$('#fZona').value;
  const waRaw=$('#fWa').value.trim(); const waR=normalizeWA(waRaw); if(!waR.ok) return alert('WhatsApp del dueño: poné 10 dígitos, ej: 11 1234 5678');
  const desc=$('#fDesc').value.trim(); const ig=$('#fIg').value.trim();
  // Servicios
  let services=[];
  document.querySelectorAll('#servList > div').forEach(div=>{ const n=div.querySelector('[data-sname]')?.value.trim(); const p=parseInt(div.querySelector('[data-sprice]')?.value||'0'); const d=parseInt(div.querySelector('[data-sdur]')?.value||'40'); if(n) services.push({name:n, price:p, duration:d, description:''}); });
  if(!services.length) services=[{name:'Servicio 1', price:10000, duration:40, description:''},{name:'Servicio 2', price:8000, duration:30, description:''}];
  // Horarios - plantilla
  let plantilla=defaultPlantilla();
  document.querySelectorAll('#plantillaRows .dayrow').forEach(row=>{ const day=row.querySelector('.toggle')?.dataset.day; if(!day) return; const on=row.querySelector('.toggle')?.dataset.on==='1'; const inicio=row.querySelector('[data-inicio]')?.value||'10:00'; const fin=row.querySelector('[data-fin]')?.value||'20:00'; plantilla[day]={on, inicio, fin}; });
  // Si no hay filas de plantilla porque estaba en otra tab, usar la del negocio editado o default
  if(!document.querySelector('#plantillaRows')){ if(editSlug){ const eb=BUSINESSES.find(x=>x.slug===editSlug); plantilla=getHorarios(eb).plantilla; } }
  // Mes completo
  let mesCompleto=null;
  const mesEl=$('#mesCompletoMes');
  if(mesEl && mesEl.value){ const dias=[]; document.querySelectorAll('[data-mesdia]').forEach(cb=>{ if(cb.checked) dias.push(cb.dataset.mesdia); }); mesCompleto={mes:mesEl.value, dias, inicio:$('#mesCompletoInicio').value||'12:00', fin:$('#mesCompletoFin').value||'18:00'}; }
  else if(editSlug){ const eb=BUSINESSES.find(x=>x.slug===editSlug); mesCompleto=getHorarios(eb).mesCompleto; }
  let diasSueltos=window._tmpSueltos||[];
  if(!document.querySelector('#listaSueltos') && editSlug){ const eb=BUSINESSES.find(x=>x.slug===editSlug); diasSueltos=getHorarios(eb).diasSueltos||[]; }
  const meta={category:cat, color, description:desc, instagram:ig, address:barrio, barrio, zona, horario_inicio:plantilla.lun.inicio, horario_fin:plantilla.lun.fin, horarios:{plantilla, mesCompleto, diasSueltos}};
  const servicesJson={meta, list:services};
  const payload={slug, name, owner_whatsapp:waR.normalized, services:servicesJson};
  // Compat: intentar guardar tambien columnas sueltas si existen, si falla reintentar sin ellas
  let p={...payload, color, logo_url:'', banner_url:''};
  for(let i=0;i<4;i++){
    let r, txt;
    if(editSlug){ r=await api('businesses?slug=eq.'+editSlug,{method:'PATCH', body:JSON.stringify(p)}); }
    else { r=await api('businesses',{method:'POST', body:JSON.stringify(p)}); }
    txt=await r.text(); if(r.ok){ alert('✅ Negocio guardado: '+name+'\nLink: '+location.origin+location.pathname+'?b='+slug); await loadBusinesses(); TAB='marca'; renderPanelBody(); return; }
    let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} const m=(j.message||'').match(/Could not find the '([^']+)' column/); if(m){ delete p[m[1]]; continue; }
    alert('Error: '+txt); return;
  }
}

  <div style="padding:0 14px">
  <div class="progress"><div class="${step>=1?'on':''}"></div><div class="${step>=2?'on':''}"></div><div class="${step>=3?'on':''}"></div><div class="${step>=4?'on':''}"></div></div>
  <div class="card"><h3 style="margin:0 0 10px">${c.emoji} 1. Elegí tu ${staffLabel}</h3>${b.staff.length?`<div style="display:flex;gap:10px;overflow:auto">`+b.staff.map(s=>`<div style="text-align:center;cursor:pointer;min-width:80px;border:${SEL_STAFF===s.name?'3px solid '+color:'2px solid #eee'};border-radius:16px;padding:10px" onclick="pickStaff('${s.name}')">${s.photo_url?`<img src="${s.photo_url}" class="staff-avatar">`:`<div style="width:64px;height:64px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">${c.emoji}</div>`}<div style="font-weight:700;margin-top:6px">${s.name}</div><div style="font-size:12px;color:#777">${s.specialty||''}</div></div>`).join('')+`</div> <button style="background:none;color:#777;padding:6px" onclick="pickStaff('')">Quitar selección</button>`:'<p style="color:#777">Sin equipo - reservás directo</p><button class="b" style="background:'+color+'" onclick="pickStaff(\'__ANY\')">Continuar sin elegir '+staffLabel+' →</button>'}</div>
  <div class="card"><h3 style="margin:0 0 10px">${c.emoji} 2. Elegí servicio</h3>${b.services.map((s,i)=>`<div class="service-card ${SEL_SERVICE===s?'sel':''}" onclick="pickService(${i})"><div class="service-icon" style="background:${color}22;color:${color}">${c.emoji}</div><div style="flex:1"><b style="font-size:16px">${s.name}</b><br><span style="color:#777;font-size:13px">${s.description||''} • ${s.duration||40} min</span></div><b style="font-size:18px">$${s.price}</b></div>`).join('')}</div>
  <div class="card"><h3 style="margin:0 0 10px">📅 3. Fecha y hora</h3><input type="date" id="cDate" value="${SEL_DATE}" style="background:#f5f5f4"><div style="margin:8px 0;font-size:13px">${hor.cerrado?`<span style="color:#ef4444;font-weight:700">❌ Cerrado - ${hor.motivo}. Elegí otro día.</span>`:`<span style="color:#22c55e">🕐 Atiende ${hor.inicio} a ${hor.fin} ${hor.motivo && hor.motivo!=='Cerrado'?'• '+hor.motivo:''}</span>`}</div><div style="margin-top:10px">${SEL_SERVICE?hor.cerrado?'<span style="color:#777">Este día está cerrado</span>':slots.map(t=>`<span class="slot ${SEL_TIME===t?'sel':''} ${isOccupied(t)?'off':''}" style="${SEL_TIME===t?`background:${color};border-color:${color};color:#fff`:''}" onclick="pickTime('${t}',${isOccupied(t)})">${t}</span>`).join(''):'<span style="color:#777">Elegí servicio primero</span>'}</div></div>
  <div class="card" style="background:#111;color:#fff;border:none"><h3 style="margin:0 0 10px;color:#fff">✅ 4. Confirmar turno</h3><input id="cName" placeholder="Tu nombre" style="background:#27272a;border-color:#333"><input id="cWa" placeholder="Tu WhatsApp ej: 11 1234 5678" style="background:#27272a;border-color:#333" oninput="waHint(this.value,'waHintClient')"><div id="waHintClient" style="font-size:13px;margin:4px 0"></div><button class="g" style="background:${color};width:100%;padding:16px;font-size:16px;color:#fff" onclick="book()">Reservar ${SEL_SERVICE?SEL_SERVICE.name+' - $'+SEL_SERVICE.price:''} ${SEL_TIME?' • '+SEL_DATE+' '+SEL_TIME:''}</button><p style="font-size:12px;color:#a1a1aa;text-align:center;margin:8px 0 0">Te llega confirmación por WhatsApp 💬</p></div>
  <p style="text-align:center;color:#aaa;font-size:12px"><a href="${location.pathname}" style="color:#aaa">← Ver todos los negocios</a> • ¿Tenés negocio? <a href="javascript:contactarTurnoYa()" style="color:#22c55e">Hablá con TurnoYa</a></p>
  </div></div>`;
  $('#cDate').onchange=()=>{ SEL_DATE=$('#cDate').value; SEL_TIME=null; renderClient(slug); };
}
function pickStaff(n){ if(n==='__ANY'){ SEL_STAFF=''; renderClient(CUR.slug); return; } SEL_STAFF=n; renderClient(CUR.slug); }
function pickService(i){ SEL_SERVICE=CUR.services[i]; SEL_TIME=null; renderClient(CUR.slug); }
function pickTime(t,off){ if(off) return; SEL_TIME=t; renderClient(CUR.slug); }
async function book(){
  if(!SEL_SERVICE||!SEL_TIME) return alert('Elegí servicio y hora');
  const name=$('#cName').value.trim(); const waRaw=$('#cWa').value.trim(); if(!name||!waRaw) return alert('Pone nombre y WhatsApp');
  const waR=normalizeWA(waRaw); if(!waR.ok) return alert('WhatsApp inválido. Poné 10 dígitos, ej: 11 1234 5678');
  if(!CUR.owner_whatsapp) return alert('⚠️ Este negocio todavía no cargó su WhatsApp, avisale al dueño');
  const payload={business_slug:CUR.slug, business_name:CUR.name, service:SEL_SERVICE.name, price:SEL_SERVICE.price, date:SEL_DATE, time:SEL_TIME, staff_name:SEL_STAFF||'', client_name:name, client_whatsapp:waR.normalized, owner_whatsapp:CUR.owner_whatsapp, status:'pendiente'};
  let p={...payload};
  for(let i=0;i<5;i++){ const r=await api('bookings',{method:'POST', body:JSON.stringify(p)}); const txt=await r.text(); if(r.ok){ alert('✅ Turno guardado!'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name)+'\nMi WhatsApp: '+waR.display; window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); renderClient(CUR.slug); return; } let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} const m=(j.message||'').match(/Could not find the '([^']+)' column/); if(m){ delete p[m[1]]; continue; } if((j.message||'').includes('bookings') && (j.message||'').includes('does not exist')){ alert('⚠️ Falta la tabla bookings en Supabase, pero igual te abro WhatsApp para que no pierdas el turno'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name); window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); return; } alert('Error: '+txt); return; }
}
render();
</script></body></html>
