function handleFile(input, kind){ const f=input.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f); img.onload=()=>{ const max= kind==='banner'?900:400; const scale=Math.min(1, max/Math.max(img.width, img.height)); const w=Math.round(img.width*scale); const h=Math.round(img.height*scale); const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); const data=c.toDataURL('image/jpeg',0.72); if(kind==='logo'){ TMP_LOGO=data; const el=$('#previewLogo'); if(el) el.src=data; } if(kind==='banner'){ TMP_BANNER=data; const el=$('#previewBanner'); if(el) el.src=data; } if(kind==='staff'){ TMP_STAFF_PHOTO=data; const el=$('#previewStaff'); if(el) el.src=data; } log('Foto lista: '+(Math.round(data.length/1024))+' KB'); URL.revokeObjectURL(url); }; img.src=url; }

async function saveBusinessOnlyServices(payload){ const r=await api('businesses',{method:'POST', body:JSON.stringify(payload)}); const txt=await r.text(); if(r.ok) return {ok:true}; let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} if((j.message||'').includes('duplicate key')){ const r2=await api('businesses?slug=eq.'+encodeURIComponent(payload.slug),{method:'PATCH', body:JSON.stringify(payload)}); const t2=await r2.text(); if(r2.ok) return {ok:true}; else return {ok:false, error:t2}; } return {ok:false, error:txt}; }

function normalizeBusiness(raw){ let meta={}; let list=[]; if(raw.services && typeof raw.services==='object' && raw.services.meta){ meta=raw.services.meta; list=raw.services.list||[]; } else if(Array.isArray(raw.services)) list=raw.services; const get=(k, fallback='')=> (meta[k]!==undefined && meta[k]!==null && meta[k]!=='') ? meta[k] : (raw[k]!==undefined && raw[k]!==null && raw[k]!=='' ? raw[k] : fallback); const _hor = meta.horarios || null; return {...raw, color:get('color','#22c55e'), logo_url:get('logo_url',''), banner_url:get('banner_url',''), fotos:get('fotos',[]), staff:get('staff',[]), description:get('description',''), instagram:get('instagram',''), address:get('address',''), barrio:get('barrio', get('address','')), zona:get('zona','Zona Sur'), category:get('category','Barberia'), horarios:_hor, phone:get('phone',''), admin_pin:get('admin_pin','1234'), horario_inicio:get('horario_inicio','09:00'), horario_fin:get('horario_fin','20:00'), services:list, _meta:{...meta, category:get('category','Barberia'), barrio:get('barrio', get('address','')), zona:get('zona','Zona Sur'), horarios:_hor}}; }

async function saveMarca(){ const waR=normalizeWA($('#eWa').value); if(!waR.ok) return alert('WhatsApp del negocio: poné 10 dígitos, ej: 11 1234 5678'); const patch={color:$('#eColor').value, category:$('#eCat')?$('#eCat').value:catOf(CUR).id, barrio:$('#eBarrio')?$('#eBarrio').value:CUR.barrio, zona:$('#eZona')?$('#eZona').value:CUR.zona, logo_url:TMP_LOGO, banner_url:TMP_BANNER, description:$('#eDesc').value, instagram:$('#eIg').value, address:$('#eAddr')?$('#eAddr').value:CUR.address, owner_whatsapp:waR.normalized, phone:$('#ePhone').value, admin_pin:$('#ePin').value}; const r=await updateBusinessOnlyServices(CUR.slug, patch); if(r.ok){ alert('✅ Marca guardada'); await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); TAB='marca'; renderAdmin(CUR.slug); } else alert('Error: '+r.error); }
function setPresetHorario(preset){ const rows=document.querySelectorAll('#plantillaRows .toggle'); rows.forEach(el=>{ const day=el.dataset.day; let on=true; if(preset==='all') on=true; if(preset==='lunvie') on=['lun','mar','mie','jue','vie'].includes(day); if(preset==='marsab') on=['mar','mie','jue','vie','sab'].includes(day); if(preset==='finde') on=['sab','dom'].includes(day); el.classList.toggle('on',on); el.dataset.on=on?'1':'0'; }); }
function addDiaSueltoAdmin(){ const f=document.getElementById('sueltoFecha')?.value; if(!f) return alert('Elegí una fecha'); const tipo=document.getElementById('sueltoTipo').value; const inicio=document.getElementById('sueltoInicio').value; const fin=document.getElementById('sueltoFin').value; const motivo=document.getElementById('sueltoMotivo').value; const h=getHorarios(CUR); h.diasSueltos.push({fecha:f,tipo,inicio,fin,motivo}); CUR._meta.horarios=h; CUR.horarios=h; const lista=document.getElementById('listaSueltos'); if(lista) lista.innerHTML=h.diasSueltos.map((s,i)=>`<div style="padding:8px;border:1px solid #333;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><span>${s.fecha} - ${s.tipo==='cerrado'?'❌ Cerrado':'🕐 '+s.inicio+' a '+s.fin} ${s.motivo?'('+s.motivo+')':''}</span><button class="r" style="padding:4px 8px" onclick="removeDiaSueltoAdmin(${i})">X</button></div>`).join(''); alert('Día suelto agregado. Guardá horarios para que quede.'); }
function removeDiaSueltoAdmin(i){ const h=getHorarios(CUR); h.diasSueltos.splice(i,1); CUR._meta.horarios=h; CUR.horarios=h; const lista=document.getElementById('listaSueltos'); if(lista) lista.innerHTML=h.diasSueltos.map((s,i2)=>`<div style="padding:8px;border:1px solid #333;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><span>${s.fecha} - ${s.tipo==='cerrado'?'❌ Cerrado':'🕐 '+s.inicio+' a '+s.fin} ${s.motivo?'('+s.motivo+')':''}</span><button class="r" style="padding:4px 8px" onclick="removeDiaSueltoAdmin(${i2})">X</button></div>`).join(''); }
async function saveHorarios(){ let plantilla=defaultPlantilla(); document.querySelectorAll('#plantillaRows .dayrow').forEach(row=>{ const day=row.querySelector('.toggle')?.dataset.day; if(!day) return; const on=row.querySelector('.toggle')?.dataset.on==='1'; const inicio=row.querySelector('[data-inicio]')?.value||'10:00'; const fin=row.querySelector('[data-fin]')?.value||'20:00'; plantilla[day]={on,inicio,fin}; }); let mesCompleto=getHorarios(CUR).mesCompleto; const mesEl=document.getElementById('mesCompletoMes'); if(mesEl){ if(mesEl.value){ const dias=[]; document.querySelectorAll('[data-mesdia]').forEach(cb=>{ if(cb.checked) dias.push(cb.dataset.mesdia); }); mesCompleto={mes:mesEl.value,dias,inicio:document.getElementById('mesCompletoInicio').value||'12:00',fin:document.getElementById('mesCompletoFin').value||'18:00'}; } } const h={plantilla,mesCompleto,diasSueltos:getHorarios(CUR).diasSueltos||[]}; const r=await updateBusinessOnlyServices(CUR.slug, {horarios:h}); if(r.ok){ alert('✅ Horarios guardados'); await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); TAB='horarios'; renderAdmin(CUR.slug); } else alert('Error: '+r.error); }
async function addService(){ const s={name:$('#sName').value, price:parseInt($('#sPrice').value||0), duration:parseInt($('#sDur').value), description:$('#sDesc').value}; if(!s.name) return; const newList=[...CUR.services, s]; const r=await updateBusinessOnlyServices(CUR.slug,{services:newList}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function delService(i){ const newList=CUR.services.filter((_,idx)=>idx!==i); const r=await updateBusinessOnlyServices(CUR.slug,{services:newList}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function addStaff(){ const s={name:$('#stName').value, photo_url:TMP_STAFF_PHOTO, specialty:$('#stSpec').value}; if(!s.name) return alert('Pone nombre'); const newStaff=[...CUR.staff, s]; const r=await updateBusinessOnlyServices(CUR.slug,{staff:newStaff}); if(r.ok){ alert('✅ Barbero guardado: '+s.name); await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); TAB='equipo'; renderAdmin(CUR.slug); } else alert('Error: '+r.error); }
async function delStaff(i){ const newStaff=CUR.staff.filter((_,idx)=>idx!==i); const r=await updateBusinessOnlyServices(CUR.slug,{staff:newStaff}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function loadAgenda(){ const d=$('#agDate').value||SEL_DATE; try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(CUR.slug)+'&date=eq.'+d+'&order=time.asc'); const txt=await r.text(); if(!r.ok){ $('#agList').innerHTML='<div class="card" style="background:#fef2f2;color:#991b1b">⚠️ No existe la tabla bookings.</div>'; return; } const arr=JSON.parse(txt); $('#agList').innerHTML=arr.length?arr.map(x=>`<div class="card"><b>${x.time} - ${x.service}</b> ${x.staff_name?`con ${x.staff_name}`:''}<br>👤 ${x.client_name} - 📱 ${x.client_whatsapp}<br><button class="g" onclick="sendReminder(${x.id})">💬 Enviar recordatorio</button> <button class="r" onclick="delBooking(${x.id})">Borrar</button></div>`).join(''):'<p>Sin turnos ese día.</p>'; window._agenda=arr; }catch(e){ $('#agList').textContent='Error: '+e.message; } }
function sendReminder(id){ const b=window._agenda?.find(x=>x.id===id); if(!b) return; const msg=friendlyReminderMsg(CUR,b); window.open('https://wa.me/'+b.client_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); }
async function delBooking(id){ await api('bookings?id=eq.'+id,{method:'DELETE'}); loadAgenda(); }
async function renderClient(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ document.body.className='light'; $('#app').innerHTML='<h2>Negocio no encontrado</h2><button onclick="location.href=location.pathname">Volver a TurnoYa</button>'; return; }
  CUR=b; document.body.className='light';
  const color=b.color||'#22c55e'; const _cat=catOf(b); const _hor=horarioParaFecha(b, SEL_DATE);
  let slots=[];
  if(SEL_SERVICE && !_hor.cerrado){ const dur=SEL_SERVICE.duration||40; const [sh,sm]=_hor.inicio.split(':').map(Number); const [eh,em]=_hor.fin.split(':').map(Number); let curMin=sh*60+sm; const endMin=eh*60+em; while(curMin+dur<=endMin){ const hh=String(Math.floor(curMin/60)).padStart(2,'0'); const mm=String(curMin%60).padStart(2,'0'); slots.push(hh+':'+mm); curMin+=dur; } }
  let occupied=[]; if(CFG.url && SEL_DATE){ try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(b.slug)+'&date=eq.'+SEL_DATE); const txt=await r.text(); if(r.ok) occupied=JSON.parse(txt); }catch(e){} }
  function isOccupied(slot){ if(!SEL_SERVICE) return false; const dur=SEL_SERVICE.duration||40; const [sh,sm]=slot.split(':').map(Number); const sMin=sh*60+sm; const eMin=sMin+dur; return occupied.some(o=>{ if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; const [oh,om]=o.time.split(':').map(Number); const oMin=oh*60+om; const oEnd=oMin+40; return sMin < oEnd && eMin > oMin; }); }
  const step = !SEL_STAFF && b.staff.length?1 : !SEL_SERVICE?2 : !SEL_TIME?3 : 4;
  $('#app').innerHTML=`
  <div style="max-width:560px;margin:0 auto;padding:0 0 20px">
  <div class="hero">${b.banner_url?`<img src="${b.banner_url}" class="hero-img">`:`<div style="height:200px;background:linear-gradient(135deg,${color},#111)"></div>`}<div class="hero-overlay"></div><div class="hero-content">${b.logo_url?`<img src="${b.logo_url}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4)">`:''}<div style="color:#fff"><span class="badge" style="background:${color};color:#fff">${catLabel(b)}</span><h2 style="margin:6px 0 0;font-size:26px;line-height:1">${b.name}</h2><p style="margin:6px 0 0;opacity:.9">${b.description||''}</p><p style="margin:4px 0 0;font-size:13px;opacity:.8">📍 ${b.barrio||b.address||''} • ${b.zona||''} ${b.instagram?' • @'+b.instagram.replace('@',''):''}</p><p style="margin:4px 0 0;font-size:13px">📱 ${formatWA(b.owner_whatsapp)||b.phone||b.owner_whatsapp||''} • ${_hor.cerrado?'❌ Hoy cerrado - '+_hor.motivo:'🕐 Hoy '+_hor.inicio+' a '+_hor.fin}</p></div></div></div>
  <div style="padding:0 14px">
  <div class="progress"><div class="${step>=1?'on':''}"></div><div class="${step>=2?'on':''}"></div><div class="${step>=3?'on':''}"></div><div class="${step>=4?'on':''}"></div></div>
  <div class="card"><h3 style="margin:0 0 10px">💈 1. Elegí tu ${_cat.staff}</h3>${b.staff.length?`<div style="display:flex;gap:10px;overflow:auto">`+b.staff.map(s=>`<div style="text-align:center;cursor:pointer;min-width:80px;border:${SEL_STAFF===s.name?'3px solid '+color:'2px solid #eee'};border-radius:16px;padding:10px" onclick="pickStaff('${s.name}')">${s.photo_url?`<img src="${s.photo_url}" class="staff-avatar">`:`<div style="width:64px;height:64px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">✂️</div>`}<div style="font-weight:700;margin-top:6px">${s.name}</div><div style="font-size:12px;color:#777">${s.specialty||''}</div></div>`).join('')+`</div> <button style="background:none;color:#777;padding:6px" onclick="pickStaff('')">Quitar selección</button>`:'<p style="color:#777">Sin equipo - reservás directo</p><button class="b" style="background:${color}" onclick="pickStaff(\'__ANY\')">Continuar sin elegir barbero →</button>'}</div>
  <div class="card"><h3 style="margin:0 0 10px">✂️ 2. Elegí servicio</h3>${b.services.map((s,i)=>`<div class="service-card ${SEL_SERVICE===s?'sel':''}" onclick="pickService(${i})"><div class="service-icon" style="background:${color}22;color:${color}">${_cat.emoji}</div><div style="flex:1"><b style="font-size:16px">${s.name}</b><br><span style="color:#777;font-size:13px">${s.description||''} • ${s.duration||40} min</span></div><b style="font-size:18px">$${s.price}</b></div>`).join('')}</div>
  <div class="card"><h3 style="margin:0 0 10px">📅 3. Fecha y hora</h3><input type="date" id="cDate" value="${SEL_DATE}" style="background:#f5f5f4"><div style="margin:8px 0;font-size:13px">${_hor.cerrado?'<span style="color:#ef4444">Cerrado - '+_hor.motivo+'</span>':'<span style="color:#22c55e">Atiende '+_hor.inicio+' a '+_hor.fin+'</span>'}</div><div style="margin-top:10px">${SEL_SERVICE?_hor.cerrado?'<span>Cerrado</span>':slots.map(t=>`<span class="slot ${SEL_TIME===t?'sel':''} ${isOccupied(t)?'off':''}" style="${SEL_TIME===t?`background:${color};border-color:${color};color:#fff`:''}" onclick="pickTime('${t}',${isOccupied(t)})">${t}</span>`).join(''):'<span style="color:#777">Elegí servicio primero</span>'}</div></div>
  <div class="card" style="background:#111;color:#fff;border:none"><h3 style="margin:0 0 10px;color:#fff">✅ 4. Confirmar turno</h3><input id="cName" placeholder="Tu nombre" style="background:#27272a;border-color:#333"><input id="cWa" placeholder="Tu WhatsApp ej: 11 1234 5678" style="background:#27272a;border-color:#333" oninput="waHint(this.value,'waHintClient')"><div id="waHintClient" style="font-size:13px"></div><button class="g" style="background:${color};width:100%;padding:16px;font-size:16px;color:#fff" onclick="book()">Reservar ${SEL_SERVICE?SEL_SERVICE.name+' - $'+SEL_SERVICE.price:''} ${SEL_TIME?' • '+SEL_DATE+' '+SEL_TIME:''}</button><p style="font-size:12px;color:#a1a1aa;text-align:center;margin:8px 0 0">Te llega confirmación por WhatsApp 💬</p></div>
  <p style="text-align:center;color:#aaa;font-size:12px"><a href="${location.pathname}" style="color:#aaa">← Ver todos los negocios</a> • ¿Tenés barbería? <a href="javascript:contactarTurnoYa()" style="color:#22c55e">Hablá con TurnoYa</a></p>
  </div></div>`;
  $('#cDate').onchange=()=>{ SEL_DATE=$('#cDate').value; SEL_TIME=null; renderClient(slug); };
}
function pickStaff(n){ if(n==='__ANY'){ SEL_STAFF=''; renderClient(CUR.slug); return; } SEL_STAFF=n; renderClient(CUR.slug); }
function pickService(i){ SEL_SERVICE=CUR.services[i]; SEL_TIME=null; renderClient(CUR.slug); }
function pickTime(t,off){ if(off) return; SEL_TIME=t; renderClient(CUR.slug); }
async function book(){
  if(!SEL_SERVICE||!SEL_TIME) return alert('Elegí servicio y hora');
  const name=$('#cName').value.trim(); const waRaw=$('#cWa').value.trim(); if(!name||!waRaw) return alert('Pone nombre y WhatsApp'); const waR=normalizeWA(waRaw); if(!waR.ok) return alert('WhatsApp inválido. Poné 10 dígitos, ej: 11 1234 5678'); const wa=waR.normalized;
  if(!CUR.owner_whatsapp) return alert('⚠️ Este negocio todavía no cargó su WhatsApp, avisale al dueño');
  const payload={business_slug:CUR.slug, business_name:CUR.name, service:SEL_SERVICE.name, price:SEL_SERVICE.price, date:SEL_DATE, time:SEL_TIME, staff_name:SEL_STAFF||'', client_name:name, client_whatsapp:wa, owner_whatsapp:CUR.owner_whatsapp, status:'pendiente'};
  let p={...payload};
  for(let i=0;i<5;i++){ const r=await api('bookings',{method:'POST', body:JSON.stringify(p)}); const txt=await r.text(); if(r.ok){ alert('✅ Turno guardado y asignado!'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name)+'\nMi WhatsApp: '+waR.display; window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); renderClient(CUR.slug); return; } let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} const m=(j.message||'').match(/Could not find the '([^']+)' column/); if(m){ delete p[m[1]]; continue; } if((j.message||'').includes('bookings') && (j.message||'').includes('does not exist')){ alert('⚠️ Falta la tabla bookings en Supabase, pero igual te abro WhatsApp para que no pierdas el turno'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name)+'\nMi WhatsApp: '+waR.display; window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); return; } alert('Error: '+txt); return; }
}
render();
</script></body></html>
