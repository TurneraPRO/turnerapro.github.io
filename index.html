function normalizeWA(input){
  let d=String(input||'').replace(/\D/g,'');
  if(!d) return {ok:false, normalized:'', display:''};
  // +54 9 11 1234 5678 -> 5491112345678 (13)
  if(d.startsWith('549') && d.length===13) return {ok:true, normalized:d, display:formatWA(d)};

  return {ok:false, normalized:'', display:''};

// Devuelve {cerrado:true, motivo} o {cerrado:false, inicio, fin} para una fecha YYYY-MM-DD
function horarioParaFecha(b, fechaStr){
  const h=getHorarios(b);
  const _modo=h.modo||'fijo';
  // 1. Dia suelto pisa todo, en los 2 modos
  const suelto=(h.diasSueltos||[]).find(x=>x.fecha===fechaStr);
  if(suelto){
    if(suelto.tipo==='cerrado') return {cerrado:true, motivo:suelto.motivo||'Cerrado'};
    return {cerrado:false, inicio:suelto.inicio, fin:suelto.fin, motivo:suelto.motivo||'Horario especial'};
  }
  if(_modo==='semana'){
    // MODO SEMANA: solo semanas que cargaste. Si no cargaste esa semana, cerrado. No cae al Siempre ni al Mes.
    const _semanas=h.semanas||[];
    const _d0=new Date(fechaStr+'T12:00:00'); const _wd0=_d0.getDay(); const _diff=_wd0===0?-6:1-_wd0; const _lun=new Date(_d0); _lun.setDate(_d0.getDate()+_diff);
    const _lunes=_lun.getFullYear()+'-'+String(_lun.getMonth()+1).padStart(2,'0')+'-'+String(_lun.getDate()).padStart(2,'0');
    const _sem=_semanas.find(x=>x.lunes===_lunes);
    if(!_sem || !_sem.dias) return {cerrado:true, motivo:'Sin horarios esa semana'};
    const _wd=['dom','lun','mar','mie','jue','vie','sab'][_d0.getDay()];
    const _p=_sem.dias[_wd];
    if(!_p || !_p.on) return {cerrado:true, motivo:_sem.motivo||'Cerrado esa semana'};
    return {cerrado:false, inicio:_p.inicio, fin:_p.fin, motivo:_sem.motivo||'Semana del '+_lunes};
  }
  // MODO FIJO: Mes pisa Siempre. Semana puntual no se usa en este modo.
  if(h.mesCompleto && h.mesCompleto.mes){
    const mesFecha=fechaStr.slice(0,7);
    if(mesFecha===h.mesCompleto.mes){
      const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
      if((h.mesCompleto.dias||[]).includes(wd)) return {cerrado:false, inicio:h.mesCompleto.inicio, fin:h.mesCompleto.fin, motivo:'Horario de '+h.mesCompleto.mes};
      return {cerrado:true, motivo:'Cerrado este mes'};
    }
  }
  const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
  const p=h.plantilla[wd];
  if(!p || !p.on) return {cerrado:true, motivo:'Cerrado'};
  return {cerrado:false, inicio:p.inicio, fin:p.fin};
}

async function loadMyBookings(slug){ const inp=document.getElementById('myWa'); if(!inp) return; const waR=normalizeWA(inp.value.trim()); if(!waR.ok) return alert('Poné tu WhatsApp con 10 dígitos, ej: 11 1234 5678'); const el=document.getElementById('myBookingsList'); if(el) el.innerHTML='<p style="color:#888">Buscando tus turnos...</p>'; try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(slug)+'&order=date.asc,time.asc'); const txt=await r.text(); if(!r.ok){ if(el) el.innerHTML='<p style="color:#b45309">No se pudo buscar: '+txt+'</p>'; return; } const _all=JSON.parse(txt); const _want=String(waR.normalized||'').replace(/\D/g,'').slice(-10); const list=_all.filter(x=>{ if(['eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase())) return false; const _cw=String(x.client_whatsapp||'').replace(/\D/g,'').slice(-10); return _cw && _cw===_want; }); if(!list.length){ if(el) el.innerHTML='<p style="color:#888">No tenés turnos con ese WhatsApp en este negocio.</p>'; return; } if(el) el.innerHTML=list.map(x=>{ const _st=String(x.status||'').toLowerCase(); const _badge=_st==='cancelado'?'<span style="background:#fee2e2;color:#991b1b;padding:4px 8px;border-radius:99px;font-size:12px">❌ Cancelado</span>':(_st==='esperando_seña'||_st==='esperando_sena')?'<span style="background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:99px;font-size:12px">⏳ Esperando seña</span>':'<span style="background:#dcfce7;color:#166534;padding:4px 8px;border-radius:99px;font-size:12px">✅ Confirmado</span>'; return `<div style="border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${x.service||''} ${x.price?' - $'+x.price:''}</b>${_badge}</div><div style="font-size:13px;color:#555;margin-top:4px">📅 ${fmtDMY(x.date||'')} • 🕐 ${x.time||''} ${x.staff_name?' • con '+x.staff_name:''} ${x.branch_name?' • 📍 '+x.branch_name:''}</div>${_st!=='cancelado'?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="r" style="padding:8px 10px;font-size:13px" onclick="cancelMyBooking('${x.id}','${slug}','${waR.normalized}')">Cancelar turno</button><button class="w" style="padding:8px 10px;font-size:13px" onclick="changeMyBooking('${x.id}','${slug}','${(x.service||'').replace(/'/g,'')}','${(x.staff_name||'').replace(/'/g,'')}','${waR.normalized}')">Cambiar día / hora</button></div>`:''}</div>`; }).join(''); }catch(e){ if(el) el.innerHTML='<p style="color:#b45309">Sin conexión.</p>'; } }
async function cancelMyBooking(id, slug, waNorm){ if(!confirm('¿Cancelar este turno? La hora queda libre de nuevo.')) return; const r=await api('bookings?id=eq.'+id,{method:'PATCH', body:JSON.stringify({status:'cancelado'})}); if(!r.ok) return alert('Error: '+await r.text()); alert('✅ Turno cancelado.'); const inp=document.getElementById('myWa'); if(inp) inp.value=waNorm||inp.value; loadMyBookings(slug); }

function applyBizDraft(d){ if(!d) return; const _s=(id,v)=>{ const el=document.getElementById(id); if(el && v!==undefined && v!==null && v!=='') el.value=v; }; _s('fName',d.name); _s('fSlug',d.slug); _s('fCat',d.cat); _s('fColor',d.color); _s('fDireccion',d.direccion); _s('fBarrio',d.barrio); _s('fZona',d.zona); _s('fWa',d.wa); _s('fDesc',d.desc); _s('fIg',d.ig); _s('fPin',d.pin); _s('fSenaOn',d.senaOn); _s('fSenaMonto',d.senaMonto); _s('fSenaAlias',d.senaAlias); _s('mesCompletoMes',d.mesCompletoMes); _s('mesCompletoInicio',d.mesCompletoInicio); _s('mesCompletoFin',d.mesCompletoFin); if(d.mesDias) document.querySelectorAll('[data-mesdia]').forEach(cb=>{ cb.checked=d.mesDias.includes(cb.dataset.mesdia); }); if(d.plantilla) document.querySelectorAll('#plantillaRows .dayrow').forEach(row=>{ const day=row.querySelector('.toggle')?.dataset.day; if(!day||!d.plantilla[day]) return; const tg=row.querySelector('.toggle'); if(tg){ tg.classList.toggle('on', !!d.plantilla[day].on); tg.dataset.on=d.plantilla[day].on?'1':'0'; } const _in=row.querySelector('[data-inicio]'); if(_in) _in.value=d.plantilla[day].inicio; const _fi=row.querySelector('[data-fin]'); if(_fi) _fi.value=d.plantilla[day].fin; }); if(d.services && d.services.length){ const c=document.getElementById('servList'); if(c){ c.innerHTML=''; d.services.forEach((s,i)=>{ c.insertAdjacentHTML('beforeend', `<div class="card" style="padding:10px"><input data-sname="${i}" value="${(s.name||'').replace(/"/g,'')}" placeholder="Nombre servicio"><input data-sprice="${i}" value="${s.price||''}" placeholder="Precio" type="number"><input data-sdur="${i}" value="${s.duration||40}" placeholder="Duración min" type="number"><button class="r" onclick="this.parentElement.remove()">Quitar</button></div>`); }); } } if(d.branches && d.branches.length){ const c=document.getElementById('branchesRows'); if(c){ c.innerHTML=''; d.branches.forEach(x=>addBranchRow(x.name,x.address,x.barrio||'',x.whatsapp)); } } if(d.staff && d.staff.length){ const c=document.getElementById('staffRows'); if(c){ c.innerHTML=''; d.staff.forEach(s=>addStaffRow(s.name,s.specialty||'',s.photo_url||'',s.branch||'Todas')); } } if(d.modo){ window._horarioModo=d.modo; try{ setHorarioModo(d.modo, true); }catch(e){} }
  if(d.semanas){ window._tmpSemanas=d.semanas.slice(); try{ renderListaSemanas(); }catch(e){} } if(d.diasSueltos){ window._tmpSueltos=d.diasSueltos.slice(); const _ls=document.getElementById('listaSueltos'); if(_ls) _ls.innerHTML=window._tmpSueltos.map((s,i)=>`<div style="padding:8px;border:1px solid #333;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><span>${fmtDMY(s.fecha)} - ${s.tipo==='cerrado'?'❌ Cerrado':'🕐 '+s.inicio+' a '+s.fin} ${s.motivo?'('+s.motivo+')':''}</span><button class="r" style="padding:4px 8px" onclick="removeDiaSuelto(${i})">X</button></div>`).join('')||'<p style="color:#6b7280;font-size:13px">Todavía no hay días sueltos.</p>'; } if(d.logo){ TMP_LOGO=d.logo; const el=document.getElementById('previewLogo'); if(el){ el.src=d.logo; el.style.display='block'; } } if(d.banner){ TMP_BANNER=d.banner; const el=document.getElementById('previewBanner'); if(el){ el.src=d.banner; el.style.display='block'; } } }

function renderBizForm(b, isOwner){ if(!b){ TMP_LOGO=''; TMP_BANNER=''; }
  const isEdit=!!b;
  const meta=b?b.meta:{};
  const horarios=getHorarios(b||{meta:{}});
  const form=`
  <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px"><b style="font-size:14px">🧭 Cómo cargar tu negocio — 3 pasos</b><p style="margin:4px 0 8px;color:#666;font-size:13px">Vale para cualquier rubro. Cargás una vez y después solo editás lo que cambia.</p><div style="font-size:13px;color:#111;display:grid;gap:4px"><div><b>1. Marca:</b> nombre, color, fotos, dirección, WhatsApp y PIN.</div><div><b>2. Servicios:</b> qué ofrecés, precio y cuánto dura cada uno.</div><div><b>3. Horarios y días:</b><p style="font-size:12px;color:#666;margin:4px 0">¿Atendés siempre igual? Poné tus horarios fijos y listo. ¿Cambia cada semana? Cargá cada semana por separado. ¿Abrís un día especial? Agregá ese día suelto.</p> cuándo atendés, y excepciones como feriados o días cerrados.</div></div></div>
  <div id="sec-marca"></div>${isOwner?`<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:6px"><b style="font-size:15px">${b?b.name:''}</b><p style="font-size:12px;color:#666;margin:4px 0 0">Si querés cambiar el nombre o la categoría, pedíselo a TurnoYa.</p></div><div style="display:none">`:``}<label>Nombre del negocio *</label><input id="fName" value="${b?b.name:''}" placeholder="Ej: Nails Lomas" oninput="$('#fSlug').value=slugify(this.value)">
  <label>Slug (link) - se genera solo</label><input id="fSlug" value="${b?b.slug:''}" placeholder="nails-lomas">
  <label>Categoría - predeterminada Barbería, la podés cambiar</label><select id="fCat">${CATEGORIES.map(c=>`<option value="${c.id}" ${catOf(b||{meta:{}}).id===c.id?'selected':''}>${c.emoji} ${c.label}</option>`).join('')}</select>${isOwner?`</div>`:``}
  <label>Color de la página - libre, no cambia con la categoría. Manicura puede ser verde, rosa, negra, lo que quieras.</label>
  <div style="display:flex;gap:8px;align-items:center"><input type="color" id="fColor" value="${b?b.color:'#22c55e'}" style="width:60px;height:44px;padding:2px"><span style="font-size:13px;color:#6b7280">Elegí el que quieras. Ej: manicura rosa #ec4899, barbería verde #22c55e, masajes violeta #8b5cf6</span></div>
  <div class="panel-card" style="margin-top:12px"><b>🖼️ Logo y foto de portada</b><p style="font-size:12px;color:#44403c;margin:4px 0">Subí el logo y la foto de portada. Se guardan en tu negocio y se ven arriba en tu página de clientes, como el cliente lo ve.</p>
  <label>Logo (cuadrado, se ve redondo)</label>
  <div style="display:flex;gap:10px;align-items:center"><img id="previewLogo" src="${b&&b.meta&&b.meta.logo_url?b.meta.logo_url:''}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #22c55e;background:#eee;display:${b&&b.meta&&b.meta.logo_url?'block':'none'}"><input type="file" accept="image/*" onchange="handleFile(this,'logo')" style="flex:1"><button type="button" class="w" onclick="TMP_LOGO='';const el=$('#previewLogo');if(el){el.src='';el.style.display='none'}">Quitar</button></div>
  <label>Foto de portada / Banner (ancha)</label>
  <div><img id="previewBanner" src="${b&&b.meta&&b.meta.banner_url?b.meta.banner_url:''}" style="width:100%;height:110px;object-fit:cover;border-radius:12px;background:#eee;display:${b&&b.meta&&b.meta.banner_url?'block':'none'}"><input type="file" accept="image/*" onchange="handleFile(this,'banner')" style="margin-top:6px"><button type="button" class="w" onclick="TMP_BANNER='';const el=$('#previewBanner');if(el){el.src='';el.style.display='none'}">Quitar</button></div>
  <p style="font-size:12px;color:#666;margin:6px 0 0">Si ya tenías foto y no subís una nueva, queda la anterior. Si apretás Quitar, se borra.</p></div>

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center">${['#22c55e','#ec4899','#8b5cf6','#000000','#f97316','#0ea5e9','#eab308'].map(col=>`<span class="color-dot ${ (b?b.color:'#22c55e')===col?'sel':''}" data-color="${col}" style="width:32px;height:32px;border-radius:50%;background:${col};cursor:pointer;border:2px solid #fff" onclick="selectBizColor('${col}',this)"></span>`).join('')}<span id="colorSelLabel" style="font-size:13px;color:#111827;font-weight:700;margin-left:6px">Color elegido: ${b?b.color:'#22c55e'}</span></div>
  <label>🏠 Sede principal - Dirección (calle y número) - ej: Av. Hipólito Yrigoyen 1234</label><p style="font-size:12px;color:#666;margin:2px 0 8px">Esta es tu sede principal. <b>Si tenés 1 sola sucursal, completá solo esto y listo, no repitas nada abajo.</b> Si tenés 2 o más, completá esto y abajo poné TODAS las sucursales, incluida la principal.</p><input id="fDireccion" value="${b?b.address: ''}" placeholder="Av. Hipólito Yrigoyen 1234">
  <label>Barrio / Localidad de la sede principal *</label><input id="fBarrio" value="${b?(b.barrio||''):''}" placeholder="Ej: Lomas de Zamora">
  <label>Zona</label><select id="fZona">${ZONAS.filter(z=>z!=='Todas las zonas').map(z=>`<option ${b&&b.zona===z?'selected':''}>${z}</option>`).join('')}</select>
  <label>WhatsApp del dueño (10 dígitos, ej: 11 1234 5678) *</label><input id="fWa" autocomplete="tel" value="${b?b.owner_whatsapp:''}" placeholder="11 1234 5678" oninput="waHint(this.value,'waHintOwner')"><div id="waHintOwner" style="font-size:13px;margin:4px 0"></div>
  <label>Descripción</label><input id="fDesc" value="${b?b.description:''}" placeholder="Atendemos con turno previo">
  <label>🔒 PIN del negocio - con este PIN entra a ?admin=${b?b.slug:''}</label><input id="fPin" type="password" inputmode="numeric" placeholder="••••" value="" placeholder="••••"><p style="font-size:12px;color:#6b7280">Si lo dejás vacío, se mantiene el PIN que ya tiene. Si ponés uno nuevo, queda guardado hasheado, no se ve en el código.</p><div class="card-seña panel-card" style="border-radius:14px;padding:14px;margin-top:10px"><b>💰 Seña (opcional)</b><p style="font-size:12px;color:#666;margin:4px 0">Si la activás, el cliente reserva y queda 15 min en "Esperando seña". Solo vos podés confirmarlo con el botón Confirmar cuando te manda el comprobante. Si no la activás, entra directo confirmado.</p><label>¿Este negocio pide seña?</label><select id="fSenaOn"><option value="" ${(b&&b.meta&&b.meta.sena_on)?"":"selected"}>No, sin seña - entra directo confirmado</option><option value="1" ${(b&&b.meta&&b.meta.sena_on)?"selected":""}>Sí, pide seña</option></select><div style="display:flex;gap:8px"><div style="flex:1"><label>Monto seña $</label><input id="fSenaMonto" type="number" placeholder="5000" value="${b&&b.meta&&b.meta.sena_monto?b.meta.sena_monto:'' }"></div><div style="flex:1"><label>Alias</label><input id="fSenaAlias" placeholder="barberia.demo" value="${b&&b.meta&&b.meta.sena_alias?b.meta.sena_alias:'' }"></div></div></div>
    <div class="card-suc panel-card" style="border-radius:14px;padding:14px;margin-top:10px"><b>📍 Sucursales</b><p style="font-size:12px;color:#444;margin:4px 0">Un solo link para todo el negocio. El cliente primero elige sucursal.<br><b>1 sucursal:</b> dejá acá 1 sola, con los mismos datos de la Sede principal.<br><b>2 o más:</b> acá van TODAS, incluida la principal. Si ya completaste la Sede principal arriba, tocá el botón para copiarla y después agregá las demás.</p><button type="button" class="w" style="border:1px solid #ddd;margin-bottom:8px" onclick="copyPrincipalToBranch()">📋 Copiar sede principal como primera sucursal</button><div id="branchesRows">${branchesOf(b||{meta:{}}).map(x=>`<div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap"><input data-bname placeholder="Nombre sucursal ej: Lomas" value="${(x.name||'').replace(/"/g,'')}" style="flex:1;min-width:120px"><input data-baddr placeholder="Dirección" value="${(x.address||'').replace(/"/g,'')}" style="flex:1;min-width:120px"><input data-bbarrio placeholder="Barrio / Localidad" value="${(x.barrio||'').replace(/"/g,'')}" style="flex:1;min-width:120px"><input data-bwa placeholder="WhatsApp sucursal 10 dígitos" value="${(x.whatsapp||'').replace(/"/g,'')}" style="flex:1;min-width:120px" oninput="waBranchHint(this)"><button type="button" class="r" onclick="this.parentElement.remove()">Quitar</button></div>`).join('')}</div><button type="button" class="b" onclick="addBranchRow()">+ Agregar sucursal</button></div>
    
  <label>Instagram (sin @)</label><input id="fIg" value="${b?b.instagram:''}" placeholder="barberia.brian">
  <div class="card-equipo panel-card" style="border-radius:14px;padding:14px;margin-top:10px"><b>👥 Quién atiende / Empleados</b><p style="font-size:12px;color:#666;margin:4px 0">Acá agregás a tu equipo. El cliente los elige cuando reserva. Cada uno tiene su propia agenda: si Juan está ocupado, Pedro sigue libre. Si no agregás a nadie, el cliente NO puede reservar. Tenés que agregar al menos un profesional para que puedan reservar.</p><div id="staffRows">${(b&&b.staff&&b.staff.length?b.staff:[{name:'',specialty:'',photo_url:'',branch:'Todas'}]).map(s=>`<div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:10px"><img src="${s.photo_url||''}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eee;display:${s.photo_url?'block':'none'}"><div style="flex:1;min-width:220px"><input data-staffname placeholder="Nombre ej: Brian" value="${(s.name||'').replace(/"/g,'')}" style="flex:1;min-width:130px"><input data-staffspec placeholder="Especialidad" value="${(s.specialty||'').replace(/"/g,'')}" style="flex:1;min-width:130px"><input data-staffphoto placeholder="Foto URL" value="${(s.photo_url||'').replace(/"/g,'')}" style="flex:1;min-width:130px"><input type="file" accept="image/*" onchange="handleStaffPhoto(this)" style="flex:1;min-width:130px"><button type="button" class="w" style="padding:6px 10px;font-size:12px" onclick="const _img=this.parentElement.parentElement.querySelector('img'); if(_img){_img.src='';_img.style.display='none'} const _inp=this.parentElement.querySelector('[data-staffphoto]'); if(_inp) _inp.value=''">Quitar foto</button></div><label style="font-size:12px;margin:0">Atiende en</label><select data-staffbranch style="flex:1;min-width:140px"><option value="Todas" ${(!s.branch||s.branch==='Todas')?'selected':''}>Todas las sucursales</option>${branchesOf(b||{meta:{}}).map(br=>`<option value="${br.name}" ${s.branch===br.name?'selected':''}>${br.name}</option>`).join('')}</select><button type="button" class="r" onclick="this.parentElement.remove()">Quitar empleado</button></div>`).join('')}</div><p style="font-size:12px;color:#666;margin:4px 0 0">💡 Si agregás una sucursal nueva arriba, guardá primero y después asigná a cada empleado su sucursal acá.</p><button type="button" class="b" onclick="addStaffRow()">+ Agregar empleado</button></div> <div id="sec-servicios"></div><h3 style="margin:18px 0 6px">2. Servicios</h3>
    <div id="servList">${(b?b.services:[]).map((s,i)=>`<div class="card" style="padding:10px"><input data-sname="${i}" value="${s.name}" placeholder="Nombre servicio"><input data-sprice="${i}" value="${s.price}" placeholder="Precio" type="number"><input data-sdur="${i}" value="${s.duration||40}" placeholder="Duración min" type="number"><button class="r" onclick="this.parentElement.remove()">Quitar</button></div>`).join('')}</div>
    <button class="b" onclick="addServiceRow()">+ Agregar servicio</button>
    <p style="font-size:12px;color:#6b7280">Si no agregás servicios, se crean 2 de ejemplo. Podés editarlos después.</p>
  <div id="sec-horarios"></div>
    <h3 style="margin:18px 0 6px">3. Horarios y días</h3>
    <p style="font-size:13px;color:#666;margin:0 0 10px">Primero elegí cómo trabajás. Después tocá una solapa para abrirla, se ve solo 1 a la vez.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button type="button" id="modoFijoBtn" class="bigopt sel" style="width:auto;flex:1;min-width:160px;text-align:center" onclick="setHorarioModo('fijo')"><b>🏠 Horario fijo</b><br><span style="font-size:12px;color:#666">Se repite todas las semanas. Usás Siempre + Mes + Días sueltos</span></button><button type="button" id="modoSemanaBtn" class="bigopt" style="width:auto;flex:1;min-width:160px;text-align:center" onclick="setHorarioModo('semana')"><b>📅 Horario por semana</b><br><span style="font-size:12px;color:#666">Cambia cada semana. Solo las semanas que cargás</span></button></div><p id="modoHint" style="font-size:13px;color:#4b5563;margin:0 0 10px">Modo fijo: usás <b>Siempre + Mes + Días sueltos</b>.</p>

    <button type="button" class="bigopt" data-solapa="sol-siempre" data-modo="fijo" onclick="toggleHorarioSolapa('sol-siempre')"><b>🕐 1) Siempre — se repite todas las semanas, para siempre ▾</b><br><span style="font-size:13px;color:#666">Lo cargás 1 sola vez y vale para todas las semanas. Ej: Lun a Vie 10 a 20.</span></button>

    <p style="font-size:13px;color:#4b5563;margin:8px 0">Lo cargás <b>1 sola vez</b> y vale para todas las semanas, no tenés que volver a cargarlo cada semana. Si un día está apagado, el cliente no lo ve.</p>
    <div><button type="button" class="b" style="padding:6px 10px;font-size:12px" onclick="setPreset('all')">Toda la semana</button> <button type="button" class="b" style="padding:6px 10px;font-size:12px" onclick="setPreset('lunvie')">Lun a Vie</button> <button type="button" class="b" style="padding:6px 10px;font-size:12px" onclick="setPreset('marsab')">Mar a Sáb</button> <button type="button" class="b" style="padding:6px 10px;font-size:12px" onclick="setPreset('finde')">Solo finde</button></div>
    <div id="plantillaRows">${DIAS.map(d=>{ const p=horarios.plantilla[d.k]; return `<div class="dayrow"><b style="width:40px">${d.label}</b><div class="toggle ${p.on?'on':''}" onclick="this.classList.toggle('on');this.dataset.on=this.classList.contains('on')?'1':'0'" data-on="${p.on?'1':'0'}" data-day="${d.k}"></div><input type="time" data-inicio="${d.k}" value="${p.inicio}" style="margin:0"><span> a </span><input type="time" data-fin="${d.k}" value="${p.fin}" style="margin:0"></div>`}).join('')}</div>
    </div>
    <button type="button" class="bigopt" data-solapa="sol-semana" data-modo="semana" onclick="toggleHorarioSolapa('sol-semana')"><b>📅 2) Semana puntual — solo esa semana ▾</b><br><span style="font-size:13px;color:#666">Si tu horario cambia cada semana, cargá cada semana por separado. Solo se muestra lo de las semanas que cargás. Si no cargaste esa semana, el cliente la ve cerrada.</span></button>
    <div id="sol-semana" class="hor-solapa-cuerpo" style="display:none">
    <div class="card" style="border-color:#8b5cf6"><b>Semana puntual</b><p style="font-size:13px;color:#666;margin:6px 0">Elegí cualquier día de esa semana, se acomoda solo al lunes. Ej: Lun 10 a 18, Mar cerrado, Mié 10 a 18...</p><label>Fecha de esa semana</label><input type="date" id="semanaFecha"><button type="button" class="b" onclick="addSemana()">+ Agregar semana</button><div id="listaSemanas">${(horarios.semanas||[]).length?(horarios.semanas||[]).map((s,i)=>semanaHTML(s,i)).join(''):'<p style="color:#6b7280;font-size:13px">Todavía no hay semanas puntuales. Agregá una arriba.</p>'}</div></div>
    </div>
    <button type="button" class="bigopt" data-solapa="sol-mes" data-modo="fijo" onclick="toggleHorarioSolapa('sol-mes')"><b>🗓️ 3) Mes completo — solo ese mes ▾</b><br><span style="font-size:13px;color:#666">Todo un mes con otros días/horarios. Al mes siguiente vuelve solo al Siempre.</span></button>
    <div id="sol-mes" class="hor-solapa-cuerpo" style="display:none">
      <div class="card" style="border-color:#22c55e"><b>Mes completo - Ejemplo: Enero Mar a Vie 12 a 18</b><br>
      <label>Mes</label><input type="month" id="mesCompletoMes" value="${horarios.mesCompleto?horarios.mesCompleto.mes:''}">
      <label>Días que SÍ atiende ese mes</label><div>${DIAS.map(d=>`<label style="display:inline-block;margin:4px"><input type="checkbox" data-mesdia="${d.k}" ${horarios.mesCompleto?(horarios.mesCompleto.dias||[]).includes(d.k)?'checked':'':MES_DIAS_SEL.includes(d.k)?'checked':''} style="width:auto"> ${d.label}</label>`).join('')}</div>
      <label>Horario ese mes</label><div style="display:flex;gap:8px"><input type="time" id="mesCompletoInicio" value="${horarios.mesCompleto?horarios.mesCompleto.inicio:'12:00'}"><input type="time" id="mesCompletoFin" value="${horarios.mesCompleto?horarios.mesCompleto.fin:'18:00'}"></div>
      <p style="font-size:12px;color:#6b7280">Si dejás el mes vacío, no se aplica ningún mes especial.</p></div>
    </div>

      <div class="card" style="border-color:#f59e0b"><b>Días sueltos</b><br>
      <label>Fecha</label><input type="date" id="sueltoFecha">

      <div style="display:flex;gap:8px"><input type="time" id="sueltoInicio" value="12:00"><input type="time" id="sueltoFin" value="18:00"></div>

  <button class="g" style="width:100%;margin-top:16px;padding:16px" onclick="saveBiz(${isEdit?`'${b.slug}'`:'null'})">${isEdit?'Guardar cambios':'Crear negocio ✅'}</button>

        target.insertBefore(_banner, target.firstChild);

  try{
    if(target && !target.dataset.draftBound){

      target.addEventListener('click', (e)=>{ if(e.target && e.target.classList && e.target.classList.contains('toggle')) setTimeout(_save, 100); });
    }
  }catch(e){}
}


function lunesDe(fechaStr){ try{ const d=new Date(fechaStr+'T12:00:00'); const wd=d.getDay(); const diff=wd===0?-6:1-wd; d.setDate(d.getDate()+diff); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return fechaStr; } }

function toggleHorarioSolapa(id){ try{ const _all=document.querySelectorAll('.hor-solapa-cuerpo'); let _target=null; _all.forEach(el=>{ if(el.id===id) _target=el; }); if(!_target) return; const _estabaOculto=_target.style.display==='none'; _all.forEach(el=>{ el.style.display='none'; const _btn=document.querySelector('[data-solapa="'+el.id+'"]'); if(_btn) _btn.classList.remove('sel'); }); if(_estabaOculto){ _target.style.display='block'; const _btn=document.querySelector('[data-solapa="'+id+'"]'); if(_btn) _btn.classList.add('sel'); _target.scrollIntoView({behavior:'smooth', block:'nearest'}); } }catch(e){} }
function semanasDesdeDOM(){ const _out=[]; document.querySelectorAll('#listaSemanas > div[data-semana]').forEach(div=>{ const _lunes=div.dataset.semana; const _dias={}; div.querySelectorAll('[data-semana-dia]').forEach(row=>{ const _k=row.dataset.semanaDia; const _tg=row.querySelector('.toggle'); const _on=_tg?_tg.dataset.on==='1':true; _dias[_k]={on:_on, inicio:row.querySelector('[data-semana-inicio]')?.value||'10:00', fin:row.querySelector('[data-semana-fin]')?.value||'20:00'}; }); _out.push({lunes:_lunes, motivo:div.querySelector('[data-semana-motivo]')?.value||'', dias:_dias}); }); return _out; }
function semanaHTML(s, idx){ const _lun=s.lunes; const _d=new Date(_lun+'T12:00:00'); const _fin=new Date(_d); _fin.setDate(_d.getDate()+6); const _finStr=_fin.getDate()+'/'+(_fin.getMonth()+1); const _iniStr=_d.getDate()+'/'+(_d.getMonth()+1); return `<div data-semana="${_lun}" style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;background:#fff"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>Semana ${_iniStr} al ${_finStr} (Lun ${_lun})</b><button type="button" class="r" style="padding:6px 10px;font-size:12px" onclick="removeSemana(${idx})">Borrar semana</button></div><label style="margin:8px 0 4px">Motivo (opcional, ej: Semana especial)</label><input data-semana-motivo value="${(s.motivo||'').replace(/"/g,'')}" placeholder="Ej: Semana especial"><div style="margin-top:8px">${DIAS.map(d=>{ const _p=(s.dias||{})[d.k]||{on:true,inicio:'10:00',fin:'20:00'}; return `<div class="dayrow" data-semana-dia="${d.k}"><b style="width:40px">${d.label}</b><div class="toggle ${_p.on?'on':''}" onclick="this.classList.toggle('on');this.dataset.on=this.classList.contains('on')?'1':'0'" data-on="${_p.on?'1':'0'}"></div><input type="time" data-semana-inicio value="${_p.inicio}" style="margin:0"><span> a </span><input type="time" data-semana-fin value="${_p.fin}" style="margin:0"></div>`; }).join('')}</div></div>`; }

function addSemana(){ const _inp=document.getElementById('semanaFecha'); if(!_inp || !_inp.value) return alert('Elegí una fecha de esa semana'); const _lunes=lunesDe(_inp.value); window._tmpSemanas=window._tmpSemanas||[]; if(window._tmpSemanas.some(x=>x.lunes===_lunes)) return alert('Esa semana ya está cargada. Borrala primero si querés cambiarla.'); const _base={}; try{ document.querySelectorAll('#plantillaRows .dayrow').forEach(row=>{ const _day=row.querySelector('.toggle')?.dataset.day; if(!_day) return; _base[_day]={on:row.querySelector('.toggle')?.dataset.on==='1', inicio:row.querySelector('[data-inicio]')?.value||'10:00', fin:row.querySelector('[data-fin]')?.value||'20:00'}; }); }catch(e){} if(!Object.keys(_base).length) _base=defaultPlantilla(); window._tmpSemanas.push({lunes:_lunes, motivo:'', dias:_base}); renderListaSemanas(); const _sel=document.getElementById('sol-semana'); if(_sel) _sel.scrollIntoView({behavior:'smooth', block:'nearest'}); try{ const _sl=document.getElementById('fSlug')?.value||'nuevo'; saveBizDraft(_sl); }catch(e){} }
