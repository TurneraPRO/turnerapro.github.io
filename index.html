// ---------- WHATSAPP ARGENTINA - 10 DIGITOS ----------
function normalizeWA(input){
  let d=String(input||'').replace(/\D/g,'');
  if(!d) return {ok:false, normalized:'', display:''};
  // +54 9 11 1234 5678 -> 5491112345678 (13)
  if(d.startsWith('549') && d.length===13) return {ok:true, normalized:d, display:formatWA(d)};

  if(d.startsWith('54') && d.length===12) { d='549'+d.slice(2); return {ok:true, normalized:d, display:formatWA(d)}; }

  // 15 1234 5678 (10 con 15 sin area) no se puede saber area -> invalido
  return {ok:false, normalized:'', display:''};

function formatWA(n){ // 5491112345678 -> +54 9 11 1234 5678

  return '+54 9 '+n.slice(3,5)+' '+n.slice(5,9)+' '+n.slice(9);
}

// Devuelve {cerrado:true, motivo} o {cerrado:false, inicio, fin} para una fecha YYYY-MM-DD
function horarioParaFecha(b, fechaStr){
  const h=getHorarios(b);
  const _modo=h.modo||'fijo';
  // 1. Dia suelto pisa todo, en los 2 modos
  const suelto=(h.diasSueltos||[]).find(x=>x.fecha===fechaStr);
  if(suelto){
    if(suelto.tipo==='cerrado') return {cerrado:true, motivo:suelto.motivo||'Cerrado'};
    return {cerrado:false, inicio:suelto.inicio, fin:suelto.fin, motivo:suelto.motivo||'Horario especial'};
  }
  if(_modo==='semana'){
    // MODO SEMANA: solo semanas que cargaste. Si no cargaste esa semana, cerrado. No cae al Siempre ni al Mes.
    const _semanas=h.semanas||[];
    const _d0=new Date(fechaStr+'T12:00:00'); const _wd0=_d0.getDay(); const _diff=_wd0===0?-6:1-_wd0; const _lun=new Date(_d0); _lun.setDate(_d0.getDate()+_diff);
    const _lunes=_lun.getFullYear()+'-'+String(_lun.getMonth()+1).padStart(2,'0')+'-'+String(_lun.getDate()).padStart(2,'0');
    const _sem=_semanas.find(x=>x.lunes===_lunes);
    if(!_sem || !_sem.dias) return {cerrado:true, motivo:'Sin horarios esa semana'};
    const _wd=['dom','lun','mar','mie','jue','vie','sab'][_d0.getDay()];
    const _p=_sem.dias[_wd];
    if(!_p || !_p.on) return {cerrado:true, motivo:_sem.motivo||'Cerrado esa semana'};
    return {cerrado:false, inicio:_p.inicio, fin:_p.fin, motivo:_sem.motivo||'Semana del '+_lunes};
  }
  // MODO FIJO: Mes pisa Siempre. Semana puntual no se usa en este modo.
  if(h.mesCompleto && h.mesCompleto.mes){
    const mesFecha=fechaStr.slice(0,7);
    if(mesFecha===h.mesCompleto.mes){
      const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
      if((h.mesCompleto.dias||[]).includes(wd)) return {cerrado:false, inicio:h.mesCompleto.inicio, fin:h.mesCompleto.fin, motivo:'Horario de '+h.mesCompleto.mes};
      return {cerrado:true, motivo:'Cerrado este mes'};
    }
  }
  const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
  const p=h.plantilla[wd];
  if(!p || !p.on) return {cerrado:true, motivo:'Cerrado'};
  return {cerrado:false, inicio:p.inicio, fin:p.fin};
}

function _parseRpcBool(txt){ const _toBool=(v)=>{ if(typeof v==='boolean') return v; if(typeof v==='number') return v===1?true:(v===0?false:null); if(typeof v==='string'){ const s=v.trim().toLowerCase().replace(/^"+|"+$/g,''); if(s==='true'||s==='t'||s==='1') return true; if(s==='false'||s==='f'||s==='0') return false; } return null; }; try{ const raw=String(txt||'').trim(); if(!raw) return null; const direct=_toBool(raw); if(direct!==null) return direct; if(raw.toLowerCase()==='[true]'||raw.toLowerCase()==='["true"]') return true; if(raw.toLowerCase()==='[false]'||raw.toLowerCase()==='["false"]') return false; let j; try{ j=JSON.parse(raw); }catch(e){ return null; } const b=_toBool(j); if(b!==null) return b; if(Array.isArray(j)){ if(!j.length) return null; const first=j[0]; const bf=_toBool(first); if(bf!==null) return bf; if(first && typeof first==='object'){ for(const k of Object.keys(first)){ const bv=_toBool(first[k]); if(bv!==null) return bv; } } return null; } if(j && typeof j==='object'){ for(const k of Object.keys(j)){ const bv=_toBool(j[k]); if(bv!==null) return bv; } } return null; }catch(e){ return _toBool(txt); } }

  const _rpcOk=await rpcVerifyBusinessPin(slug,_hash);
  if(_rpcOk===true){ BIZ_SESSION_PIN_HASH=_hash; const g=$('#bizGate'); if(g) g.style.display='none'; renderBusinessPanelBody(slug); return; }

    const _rpcMaster=await rpcVerifyMasterPin(_hash);

    return alert('Este negocio todavía no tiene PIN propio. Pedile a TurnoYa que te lo cree.'); }
  const _ok=await checkPinValue(_val,_stored); if(_ok){ BIZ_SESSION_PIN_HASH=_hash;
    // Migracion automatica: si el PIN viejo es correcto pero todavia no esta en business_secrets, lo crea
    try{ await rpcMigrateBusinessPin(slug,_hash); }catch(e){}

    const g=$('#bizGate'); if(g) g.style.display='none'; renderBusinessPanelBody(slug); } else {
    // Tambien aceptar PIN maestro como respaldo (RPC)
    const _rpcMaster2=await rpcVerifyMasterPin(_hash);
    if(_rpcMaster2===true){ BIZ_SESSION_PIN_HASH=_hash; MASTER_SESSION_PIN_HASH=_hash; const g=$('#bizGate'); if(g) g.style.display='none'; renderBusinessPanelBody(slug); return; }

  try{ const _hoy2=todayStr(); let _all=BIZ_AGENDA||[]; if(typeof BIZ_AGENDA_SUC!=='undefined' && BIZ_AGENDA_SUC && BIZ_AGENDA_SUC!=='Todas'){ _all=_all.filter(x=> effectiveBranchName(x,b)===BIZ_AGENDA_SUC); } const _elHoy=document.getElementById('statHoy'); if(_elHoy) _elHoy.textContent=_all.filter(x=>x.date===_hoy2 && String(x.status||'').toLowerCase()!=='cancelado' && !['eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase())).length; const _elProx=document.getElementById('statProx'); if(_elProx) _elProx.textContent=_all.filter(x=>x.date>=_hoy2 && String(x.status||'').toLowerCase()!=='cancelado' && !['eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase())).length; const _elSena=document.getElementById('statSena'); if(_elSena) _elSena.textContent=_all.filter(x=>x.status==='esperando_seña'||x.status==='esperando_sena').length; const _elCanc=document.getElementById('statCanc'); if(_elCanc) _elCanc.textContent=_all.filter(x=>String(x.status||'').toLowerCase()==='cancelado' && (!x.date || x.date>=_hoy2)).length; }catch(e){}

  // AGRUPAR POR DÍA: en vez de una lista infinita hacia abajo, un grupo por día, colapsable. Solo hoy / primer día abierto.
  const grupos={}; list.forEach(x=>{ const k=x.date||'Sin fecha'; if(!grupos[k]) grupos[k]=[]; grupos[k].push(x); });
  const fechas=Object.keys(grupos).sort();
  const fmtFecha=(ds)=>{ try{ if(!ds||ds==='Sin fecha') return 'Sin fecha'; return fmtLargo(ds); }catch(e){ return fmtDMY(ds); } };
  let html='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button class="w" style="padding:6px 12px;font-size:12px" onclick="expandAllAgendaGroups(true)">▼ Expandir todo</button><button class="w" style="padding:6px 12px;font-size:12px" onclick="expandAllAgendaGroups(false)">▶ Contraer todo</button><span style="font-size:12px;color:#666;align-self:center">'+fechas.length+' día'+(fechas.length!==1?'s':'')+' • '+list.length+' turno'+(list.length!==1?'s':'')+'</span></div>';

function lunesDe(fechaStr){ try{ const d=new Date(fechaStr+'T12:00:00'); const wd=d.getDay(); const diff=wd===0?-6:1-wd; d.setDate(d.getDate()+diff); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return fechaStr; } }

function toggleSueltoHorarioRow(){ try{ const _sel=document.getElementById('sueltoTipo'); const _row=document.getElementById('sueltoHorarioRow'); if(!_sel || !_row) return; _row.style.display = (_sel.value==='cerrado') ? 'none' : 'flex'; }catch(e){} }
function setHorarioModo(modo, silent){ try{ window._horarioModo=modo||'fijo'; const _btnF=document.getElementById('modoFijoBtn'); const _btnS=document.getElementById('modoSemanaBtn'); if(_btnF) _btnF.classList.toggle('sel', window._horarioModo==='fijo'); if(_btnS) _btnS.classList.toggle('sel', window._horarioModo==='semana'); const _hint=document.getElementById('modoHint'); if(_hint) _hint.innerHTML = window._horarioModo==='fijo' ? 'Modo fijo: usás <b>Siempre + Mes + Días sueltos</b>. La solapa Semana puntual queda oculta.' : 'Modo por semana: <b>solo se muestra lo de las semanas que cargás</b>. Si no cargaste esa semana, el cliente la ve cerrada. Usás <b>Semana puntual + Días sueltos</b>.'; document.querySelectorAll('[data-solapa]').forEach(btn=>{ const _m=btn.getAttribute('data-modo')||'ambos'; let _show=true; if(window._horarioModo==='fijo' && _m==='semana') _show=false; if(window._horarioModo==='semana' && _m==='fijo') _show=false; btn.style.display=_show?'':'none'; const _id=btn.getAttribute('data-solapa'); const _cuerpo=document.getElementById(_id); if(_cuerpo) { if(!_show) _cuerpo.style.display='none'; } }); try{ let _n=0; document.querySelectorAll('[data-solapa]').forEach(btn=>{ if(btn.style.display==='none') return; _n++; const _b=btn.querySelector('b'); if(_b) _b.innerHTML=_b.innerHTML.replace(/\d+\)/, _n+')'); }); }catch(e){} try{ toggleSueltoHorarioRow(); }catch(e){} if(!silent){} }catch(e){} }

function toggleHorarioSolapa(id){ try{ const _all=document.querySelectorAll('.hor-solapa-cuerpo'); let _target=null; _all.forEach(el=>{ if(el.id===id) _target=el; }); if(!_target) return; const _estabaOculto=_target.style.display==='none'; _all.forEach(el=>{ el.style.display='none'; const _btn=document.querySelector('[data-solapa="'+el.id+'"]'); if(_btn) _btn.classList.remove('sel'); }); if(_estabaOculto){ _target.style.display='block'; const _btn=document.querySelector('[data-solapa="'+id+'"]'); if(_btn) _btn.classList.add('sel'); if(id==='sol-suelto'){ try{ toggleSueltoHorarioRow(); }catch(e){} } _target.scrollIntoView({behavior:'smooth', block:'nearest'}); } }catch(e){} }
function semanasDesdeDOM(){ const _out=[]; document.querySelectorAll('#listaSemanas > div[data-semana]').forEach(div=>{ const _lunes=div.dataset.semana; const _dias={}; div.querySelectorAll('[data-semana-dia]').forEach(row=>{ const _k=row.dataset.semanaDia; const _tg=row.querySelector('.toggle'); const _on=_tg?_tg.dataset.on==='1':true; _dias[_k]={on:_on, inicio:row.querySelector('[data-semana-inicio]')?.value||'10:00', fin:row.querySelector('[data-semana-fin]')?.value||'20:00'}; }); _out.push({lunes:_lunes, motivo:div.querySelector('[data-semana-motivo]')?.value||'', dias:_dias}); }); return _out; }

async function book(){

  const waR=normalizeWA(waRaw); if(!waR.ok) return alert('WhatsApp inválido. Poné 10 dígitos, ej: 11 1234 5678');
  if(SEL_DATE===todayStr()){ const _nb=new Date(); const _nbm=_nb.getHours()*60+_nb.getMinutes(); const _sb=SEL_TIME.split(':').map(Number); if(_sb[0]*60+_sb[1]<=_nbm){ alert('Esa hora ya pasó hoy. Elegí una hora futura.'); renderClient(CUR.slug); return; } }

  const sena=senaOf(CUR); const dur=parseInt(SEL_SERVICE.duration||40);
  const [sh,sm]=SEL_TIME.split(':').map(Number); const sMin=sh*60+sm; const eMin=sMin+dur;
  // Doble chequeo por RPC: el lock de create_booking decide si está ocupado
  try{
    const _occCheck=await rpcGetOccupiedSlots(CUR.slug, SEL_DATE);
    const clash=_occCheck.some(o=>{ if(!isBookingActive(o)) return false; if(effectiveBranchName(o,CUR) && effectiveBranchName(o,CUR)!==br.name) return false; if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; return overlaps(sMin,eMin,bookingStartMin(o),bookingEndMin(o)); });
    if(clash){ alert('Esa hora ya se ocupó recién, elegí otra. Se actualizó la agenda.'); renderClient(CUR.slug); return; }
  }catch(e){}

  if(_resCreate && _resCreate.ok===false && _resCreate.error==='occupied'){ alert('Esa hora ya se ocupó recién, elegí otra. Se actualizó la agenda.'); renderClient(CUR.slug); return; }
  if(_resCreate && _resCreate.ok){ window._LAST_BOOKING={slug:CUR.slug, biz:CUR.name, service:SEL_SERVICE.name, price:SEL_SERVICE.price, date:SEL_DATE, time:SEL_TIME, staff:SEL_STAFF||'', branch:br.name||'', branchAddr:((br.address||CUR.address||'')+' '+((br.barrio||CUR.barrio||''))), duration:dur, client:name, clientWa:waR.normalized, sena:isSena, senaMonto:sena.monto, senaAlias:sena.alias}; const bookedTime = SEL_TIME; SEL_TIME = null; if(isSena){ /* sin alert antes de abrir WhatsApp: en PC Chrome lo bloquea como popup */ const _dstrSena=fmtLargo(SEL_DATE); const msg='\u{1F44B} ¡Hola! Soy '+name+'\nReservé '+SEL_SERVICE.name+' el '+_dstrSena+' a las '+bookedTime+(SEL_STAFF?' con '+SEL_STAFF:'')+' en '+CUR.name+' - '+br.name+'\nTe mando el comprobante de la seña de $'+sena.monto+' al alias '+sena.alias+'.'+'\n¿Me confirmás cuando te llegue? \u{1F64F}'; window.open('https://wa.me/'+ownerWa+'?text='+encodeURIComponent(msg),'_blank'); } else { /* sin alert antes de abrir WhatsApp: en PC Chrome lo bloquea como popup */ const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, bookedTime, SEL_STAFF, name, br.name, branchesOf(CUR).length>1); window.open('https://wa.me/'+ownerWa+'?text='+encodeURIComponent(msg),'_blank'); } renderClient(CUR.slug); return; }
  alert('Error: no se pudo guardar el turno. Intentá de nuevo.'); return; }
