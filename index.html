<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurnoYa - Con Fotos</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:14px}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:5px 0}
button{padding:11px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.g{background:#22c55e}.b{background:#3b82f6;color:#fff}.w{background:#fff;color:#000}.r{background:#ef4444;color:#fff}.y{background:#f59e0b}
.card{background:#151515;border:1px solid #222;padding:14px;border-radius:14px;margin:10px 0}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge-ok{background:#14532d}.badge-no{background:#7f1d1d}
pre{background:#000;border:1px solid #333;padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:160px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:600px){.grid{grid-template-columns:1fr}}
.slot{display:inline-block;padding:9px 12px;border-radius:10px;border:1px solid #333;margin:4px;cursor:pointer;background:#111;color:#fff}
.slot.sel{background:#22c55e;color:#000}.slot.off{background:#333;color:#777;text-decoration:line-through;cursor:not-allowed}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:#222;margin:3px;font-size:13px;cursor:pointer}
.chip.sel{background:#22c55e;color:#000}
.light{background:#f6f6f6;color:#111} .light .card{background:#fff;border-color:#e5e5e5;color:#111} .light input,.light textarea,.light select{background:#fff;color:#111;border-color:#ddd} .light .slot{background:#fff;color:#111}
img{max-width:100%;border-radius:12px}
.upload{border:2px dashed #444;border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#111}
.upload img{width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 8px}
.upload-banner img{width:100%;height:110px;object-fit:cover;border-radius:10px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let CFG={url:localStorage.getItem('supabase_url')||'', key:localStorage.getItem('supabase_anon')||''};
let BUSINESSES=[]; let CUR=null; let SEL_SERVICE=null; let SEL_STAFF=null; let SEL_DATE=new Date().toISOString().slice(0,10); let SEL_TIME=null;
let TMP_LOGO=''; let TMP_BANNER=''; let TMP_STAFF_PHOTO='';
function log(m){ const e=$('#log'); if(e) e.textContent=new Date().toLocaleTimeString()+' - '+m+'\n'+e.textContent; }
function slugify(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function saveCfg(){ CFG.url=$('#cfgUrl').value.trim(); CFG.key=$('#cfgKey').value.trim(); localStorage.setItem('supabase_url',CFG.url); localStorage.setItem('supabase_anon',CFG.key); log('Config guardada'); render(); }
function api(path, opts={}){ const base=CFG.url.replace(/\/$/,''); return fetch(base+'/rest/v1/'+path,{...opts, headers:{apikey:CFG.key, Authorization:'Bearer '+CFG.key, 'Content-Type':'application/json', Prefer:'return=representation', ...(opts.headers||{})}}); }
function fileToBase64(file, cb){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }
// Comprime la imagen para que no pese tanto en Supabase
function handleFile(input, kind){
  const f=input.files[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{
    const max= kind==='banner'?900:400;
    const scale=Math.min(1, max/Math.max(img.width, img.height));
    const w=Math.round(img.width*scale); const h=Math.round(img.height*scale);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    const data=c.toDataURL('image/jpeg',0.75);
    if(kind==='logo'){ TMP_LOGO=data; const el=$('#previewLogo'); if(el) el.src=data; }
    if(kind==='banner'){ TMP_BANNER=data; const el=$('#previewBanner'); if(el) el.src=data; }
    if(kind==='staff'){ TMP_STAFF_PHOTO=data; const el=$('#previewStaff'); if(el) el.src=data; }
    log('Foto lista: '+(Math.round(data.length/1024))+' KB - cuando guardes, queda en nube');
    URL.revokeObjectURL(url);
  }; img.src=url;
}
async function adaptiveSaveBusiness(payload){
  let p={...payload};
  if(!p.services || Array.isArray(p.services)) p.services={meta:{}, list: Array.isArray(p.services)?p.services:[]};
  for(let k of ['color','logo_url','banner_url','fotos','staff','description','instagram','address','phone','horario_inicio','horario_fin']){
    if(p[k]!==undefined) p.services.meta[k]=p[k];
  }
  for(let i=0;i<6;i++){
    const r=await api('businesses',{method:'POST', body:JSON.stringify(p)});
    const txt=await r.text(); let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}}
    if(r.ok) return {ok:true, data:j};
    const m=(j.message||'').match(/Could not find the '([^']+)' column/);
    if(m){ const col=m[1]; if(p[col]!==undefined){ p.services.meta[col]=p[col]; delete p[col]; } continue; }
    if((j.message||'').includes('duplicate key')){
      const r2=await api('businesses?slug=eq.'+encodeURIComponent(p.slug),{method:'PATCH', body:JSON.stringify(p)});
      const t2=await r2.text(); if(r2.ok) return {ok:true}; else return {ok:false, error:t2};
    }
    if((j.message||'').includes('column') && (j.message||'').includes('does not exist')) return {ok:false, error:'Falta columna '+txt+' - Agregala en Table Editor > Add Column'};
    return {ok:false, error:txt};
  }
  return {ok:false, error:'Reintentos'};
}
async function adaptiveUpdateBusiness(slug, patch){
  let p={...patch};
  const cur=BUSINESSES.find(b=>b.slug===slug);
  let meta={}; let list=[];
  if(cur?.services && typeof cur.services==='object' && cur.services.meta){ meta=cur.services.meta; list=cur.services.list||[]; }
  else if(Array.isArray(cur?.services)) list=cur.services;
  for(let k of ['color','logo_url','banner_url','fotos','staff','description','instagram','address','phone','horario_inicio','horario_fin']){
    if(p[k]!==undefined) meta[k]=p[k];
  }
  if(p.services) list=p.services;
  p.services={meta, list};
  for(let i=0;i<6;i++){
    const r=await api('businesses?slug=eq.'+encodeURIComponent(slug),{method:'PATCH', body:JSON.stringify(p)});
    const txt=await r.text(); if(r.ok) return {ok:true};
    let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}}
    const m=(j.message||'').match(/Could not find the '([^']+)' column/);
    if(m){ const col=m[1]; if(p[col]!==undefined){ p.services.meta[col]=p[col]; delete p[col]; } continue; }
    return {ok:false, error:txt};
  }
}
function normalizeBusiness(raw){
  let meta={}; let list=[];
  if(raw.services && typeof raw.services==='object' && raw.services.meta){ meta=raw.services.meta; list=raw.services.list||[]; }
  else if(Array.isArray(raw.services)) list=raw.services;
  const get=(k)=> raw[k]!==undefined && raw[k]!==null && raw[k]!=='' ? raw[k] : meta[k];
  return {...raw, color:get('color')||'#22c55e', logo_url:get('logo_url')||'', banner_url:get('banner_url')||'', fotos:get('fotos')||[], staff:get('staff')||[], description:get('description')||'', instagram:get('instagram')||'', address:get('address')||'', phone:get('phone')||'', horario_inicio:get('horario_inicio')||'09:00', horario_fin:get('horario_fin')||'20:00', services:list, _meta:meta};
}
async function loadBusinesses(){
  if(!CFG.url||!CFG.key) return [];
  try{ const r=await api('businesses?select=*&order=id.desc&limit=100'); const txt=await r.text(); if(!r.ok){ log('Error cargando: '+txt); return []; } const arr=JSON.parse(txt); BUSINESSES=arr.map(normalizeBusiness); return BUSINESSES; }catch(e){ log('Error red: '+e.message); return []; }
}
function getSlugFromUrl(){
  const u=new URLSearchParams(location.search);
  if(u.get('b')) return {type:'client', slug:u.get('b')};
  if(u.get('admin')) return {type:'admin', slug:u.get('admin')};
  const p=location.pathname.replace(/^\/+/,'').split('/');
  if(p[0]==='b'&&p[1]) return {type:'client', slug:p[1]};
  if(p[0]==='admin'&&p[1]) return {type:'admin', slug:p[1]};
  return {type:'owner', slug:null};
}
async function render(){
  const route=getSlugFromUrl();
  if(route.type==='client') return renderClient(route.slug);
  if(route.type==='admin') return renderAdmin(route.slug);
  renderOwner();
}
function renderOwner(){
  const has=!!(CFG.url&&CFG.key);
  $('#app').innerHTML=`
  <h1>TurnoYa - Panel</h1>
  <div class="card"><b>Supabase</b><input id="cfgUrl" placeholder="https://xxxx.supabase.co" value="${CFG.url}"><textarea id="cfgKey" rows="2" placeholder="sb_publishable_...">${CFG.key}</textarea><button class="g" onclick="saveCfg()">Guardar config</button> <span class="badge ${has?'badge-ok':'badge-no'}">${has?'NUBE ACTIVA':'SIN NUBE'}</span><pre id="log"></pre></div>
  <div class="card"><h3>Crear negocio</h3>
  <input id="nName" placeholder="Nombre ej: Barberia Brian"><input id="nSlug" placeholder="slug ej: barberia-brian"><input id="nWa" placeholder="WhatsApp dueño"><input id="nColor" type="color" value="#22c55e">
  <label>Logo - elegir foto desde el celu</label><div class="upload" onclick="document.getElementById('nLogoFile').click()"><img id="previewLogo" src="https://via.placeholder.com/90"><span>📷 Tocar para elegir logo</span><input id="nLogoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'logo')"></div>
  <button class="g" onclick="createBusiness()">Crear negocio</button></div><div id="list"></div>`;
  $('#nName').oninput=()=>{ $('#nSlug').value=slugify($('#nName').value); };
  TMP_LOGO=''; TMP_BANNER='';
  loadBusinesses().then(()=>{ $('#list').innerHTML='<h3>Negocios ('+BUSINESSES.length+')</h3>'+BUSINESSES.map(b=>`<div class="card"><div style="display:flex;gap:10px;align-items:center">${b.logo_url?`<img src="${b.logo_url}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><b>${b.name}</b><br>${b.slug}</div></div><br><button class="b" onclick="copyLink('b','${b.slug}')">Copiar link cliente</button><button class="y" onclick="copyLink('admin','${b.slug}')">Copiar link negocio</button><button class="w" onclick="openLink('b','${b.slug}')">Abrir cliente</button><button class="w" onclick="openLink('admin','${b.slug}')">Abrir admin</button></div>`).join(''); });
}
async function createBusiness(){
  const name=$('#nName').value.trim(); const slug=($('#nSlug').value.trim()||slugify(name)); const wa=$('#nWa').value.trim(); const color=$('#nColor').value;
  if(!name||!slug) return alert('Pone nombre');
  if(!CFG.url) return alert('Guarda config primero');
  const payload={slug, name, owner_whatsapp:wa, color, logo_url:TMP_LOGO||'', banner_url:'', services:{meta:{color, logo_url:TMP_LOGO||''}, list:[{name:'Corte', price:15000, duration:40}]}};
  const res=await adaptiveSaveBusiness(payload);
  if(res.ok){ alert('Guardado!'); renderOwner(); } else alert(res.error);
}
function copyLink(t,s){ const url=location.origin+location.pathname+'?'+t+'='+s; navigator.clipboard.writeText(url); alert('Copiado: '+url); }
function openLink(t,s){ window.open(location.pathname+'?'+t+'='+s,'_blank'); }

async function renderAdmin(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ $('#app').innerHTML='<h2>No existe '+slug+'</h2><button onclick="location.href=location.pathname">Volver</button>'; return; }
  CUR=b; TMP_LOGO=b.logo_url; TMP_BANNER=b.banner_url; TMP_STAFF_PHOTO='';
  $('#app').innerHTML=`
  <div style="background:${b.color};padding:14px;border-radius:14px"><h2 style="margin:0">Admin: ${b.name}</h2><span>Link cliente: ${location.origin}${location.pathname}?b=${b.slug}</span><br><button class="w" onclick="copyLink('b','${b.slug}')">Copiar link cliente</button><button class="w" onclick="openLink('b','${b.slug}')">Ver como cliente</button></div>
  <div class="card"><b>Marca - con fotos, sin URLs</b>
  <label>Color</label><input id="eColor" type="color" value="${b.color}">
  <label>Logo - tocar para cambiar foto</label><div class="upload" onclick="document.getElementById('eLogoFile').click()"><img id="previewLogo" src="${b.logo_url||'https://via.placeholder.com/90'}"><span>📷 Tocar para elegir logo nuevo</span><input id="eLogoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'logo')"></div>
  <label>Banner - tocar para cambiar foto</label><div class="upload upload-banner" onclick="document.getElementById('eBannerFile').click()"><img id="previewBanner" src="${b.banner_url||'https://via.placeholder.com/900x200'}"><span>📷 Tocar para elegir banner nuevo</span><input id="eBannerFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'banner')"></div>
  <label>Descripcion</label><textarea id="eDesc">${b.description}</textarea><label>Instagram</label><input id="eIg" value="${b.instagram}"><label>Direccion</label><input id="eAddr" value="${b.address}"><label>WhatsApp dueño</label><input id="eWa" value="${b.owner_whatsapp}"><label>Horario</label><div class="grid"><input id="eHi" type="time" value="${b.horario_inicio}"><input id="eHf" type="time" value="${b.horario_fin}"></div>
  <button class="g" onclick="saveMarca()">Guardar marca con fotos</button><pre id="log"></pre></div>
  <div class="card"><h3>Servicios</h3><div id="svcList"></div><input id="sName" placeholder="Nombre servicio"><input id="sPrice" type="number" placeholder="Precio"><select id="sDur"><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="40" selected>40 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="90">90 min</option></select><button class="g" onclick="addService()">Agregar servicio</button></div>
  <div class="card"><h3>Equipo - con foto</h3><div id="staffList"></div><input id="stName" placeholder="Nombre"><input id="stSpec" placeholder="Especialidad"><div class="upload" onclick="document.getElementById('stPhotoFile').click()"><img id="previewStaff" src="https://via.placeholder.com/90"><span>📷 Foto de la persona</span><input id="stPhotoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'staff')"></div><button class="g" onclick="addStaff()">Agregar persona</button></div>
  <div class="card"><h3>Agenda</h3><input id="agDate" type="date" value="${SEL_DATE}"><button class="b" onclick="loadAgenda()">Ver agenda</button><div id="agList"></div></div>`;
  renderSvcList(); renderStaffList(); loadAgenda();
}
function renderSvcList(){ $('#svcList').innerHTML=CUR.services.map((s,i)=>`<div class="card">${s.name} - $${s.price} - ${s.duration||40} min <button class="r" onclick="delService(${i})">Borrar</button></div>`).join('')||'Sin servicios'; }
function renderStaffList(){ $('#staffList').innerHTML=CUR.staff.map((s,i)=>`<div class="card">${s.photo_url?`<img src="${s.photo_url}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">`:''} ${s.name} - ${s.specialty||''} <button class="r" onclick="delStaff(${i})">Borrar</button></div>`).join('')||'Sin equipo'; }
async function saveMarca(){ const patch={color:$('#eColor').value, logo_url:TMP_LOGO, banner_url:TMP_BANNER, description:$('#eDesc').value, instagram:$('#eIg').value, address:$('#eAddr').value, owner_whatsapp:$('#eWa').value, horario_inicio:$('#eHi').value, horario_fin:$('#eHf').value}; const r=await adaptiveUpdateBusiness(CUR.slug, patch); if(r.ok){ alert('Guardado con fotos'); renderAdmin(CUR.slug); } else alert(r.error); }
async function addService(){ const s={name:$('#sName').value, price:parseInt($('#sPrice').value||0), duration:parseInt($('#sDur').value)}; if(!s.name) return; CUR.services.push(s); await adaptiveUpdateBusiness(CUR.slug,{services:CUR.services}); renderAdmin(CUR.slug); }
async function delService(i){ CUR.services.splice(i,1); await adaptiveUpdateBusiness(CUR.slug,{services:CUR.services}); renderAdmin(CUR.slug); }
async function addStaff(){ const s={name:$('#stName').value, photo_url:TMP_STAFF_PHOTO, specialty:$('#stSpec').value}; if(!s.name) return; CUR.staff.push(s); await adaptiveUpdateBusiness(CUR.slug,{staff:CUR.staff}); renderAdmin(CUR.slug); }
async function delStaff(i){ CUR.staff.splice(i,1); await adaptiveUpdateBusiness(CUR.slug,{staff:CUR.staff}); renderAdmin(CUR.slug); }
async function loadAgenda(){ const d=$('#agDate').value||SEL_DATE; try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(CUR.slug)+'&date=eq.'+d+'&order=time.asc'); const txt=await r.text(); const arr=JSON.parse(txt); $('#agList').innerHTML=arr.length?arr.map(x=>`<div class="card">${x.time} - ${x.service} - ${x.client_name} - $${x.price} <button class="r" onclick="delBooking(${x.id})">Borrar</button></div>`).join(''):'Sin turnos'; }catch(e){ $('#agList').textContent='Error: '+e.message; } }
async function delBooking(id){ await api('bookings?id=eq.'+id,{method:'DELETE'}); loadAgenda(); }

async function renderClient(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ document.body.className='light'; $('#app').innerHTML='<h2>Negocio no encontrado</h2>'; return; }
  CUR=b; document.body.className='light';
  let slots=[];
  if(SEL_SERVICE){ const dur=SEL_SERVICE.duration||40; const [sh,sm]=b.horario_inicio.split(':').map(Number); const [eh,em]=b.horario_fin.split(':').map(Number); let curMin=sh*60+sm; const endMin=eh*60+em; while(curMin+dur<=endMin){ const hh=String(Math.floor(curMin/60)).padStart(2,'0'); const mm=String(curMin%60).padStart(2,'0'); slots.push(hh+':'+mm); curMin+=dur; } }
  let occupied=[]; if(CFG.url && SEL_DATE){ try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(b.slug)+'&date=eq.'+SEL_DATE); const txt=await r.text(); if(r.ok) occupied=JSON.parse(txt); }catch(e){} }
  function isOccupied(slot){ if(!SEL_SERVICE) return false; const dur=SEL_SERVICE.duration||40; const [sh,sm]=slot.split(':').map(Number); const sMin=sh*60+sm; const eMin=sMin+dur; return occupied.some(o=>{ if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; const [oh,om]=o.time.split(':').map(Number); const oMin=oh*60+om; const oEnd=oMin+40; return sMin < oEnd && eMin > oMin; }); }
  $('#app').innerHTML=`
  <div style="background:${b.color};padding:0;border-radius:16px;overflow:hidden">${b.banner_url?`<img src="${b.banner_url}" style="width:100%;height:180px;object-fit:cover">`:''}<div style="padding:16px;background:#fff"><div style="display:flex;gap:12px;align-items:center">${b.logo_url?`<img src="${b.logo_url}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid ${b.color}">`:''}<div><h2 style="margin:0">${b.name}</h2><p style="margin:4px 0">${b.description||''}</p><p style="margin:0">${b.address||''} ${b.instagram?' - @'+b.instagram.replace('@',''):''}</p></div></div></div></div>
  <div class="card"><h3>1. Quien te atiende</h3>${b.staff.length?b.staff.map(s=>`<span class="chip ${SEL_STAFF===s.name?'sel':''}" onclick="pickStaff('${s.name}')">${s.photo_url?`<img src="${s.photo_url}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle">`:''} ${s.name}</span>`).join(''):'<span>Sin equipo</span>'}</div>
  <div class="card"><h3>2. Servicio</h3>${b.services.map((s,i)=>`<div class="card" style="cursor:pointer;border:${SEL_SERVICE===s?'2px solid '+b.color:'1px solid #eee'}" onclick="pickService(${i})"><b>${s.name}</b> - $${s.price} - ${s.duration||40} min</div>`).join('')}</div>
  <div class="card"><h3>3. Fecha y hora</h3><input type="date" id="cDate" value="${SEL_DATE}"><div>${SEL_SERVICE?slots.map(t=>`<span class="slot ${SEL_TIME===t?'sel':''} ${isOccupied(t)?'off':''}" onclick="pickTime('${t}',${isOccupied(t)})">${t}</span>`).join(''):'Elegi servicio primero'}</div></div>
  <div class="card"><h3>4. Tus datos</h3><input id="cName" placeholder="Tu nombre"><input id="cWa" placeholder="Tu WhatsApp"><button class="g" style="background:${b.color};width:100%;padding:14px" onclick="book()">Reservar ${SEL_SERVICE?'$'+SEL_SERVICE.price:''}</button><pre id="log"></pre></div>`;
  $('#cDate').onchange=()=>{ SEL_DATE=$('#cDate').value; SEL_TIME=null; renderClient(slug); };
}
function pickStaff(n){ SEL_STAFF=n; renderClient(CUR.slug); }
function pickService(i){ SEL_SERVICE=CUR.services[i]; SEL_TIME=null; renderClient(CUR.slug); }
function pickTime(t,off){ if(off) return; SEL_TIME=t; renderClient(CUR.slug); }
async function book(){
  if(!SEL_SERVICE||!SEL_TIME) return alert('Elegi servicio y hora');
  const name=$('#cName').value.trim(); const wa=$('#cWa').value.trim(); if(!name||!wa) return alert('Pone nombre y WhatsApp');
  const payload={business_slug:CUR.slug, business_name:CUR.name, service:SEL_SERVICE.name, price:SEL_SERVICE.price, date:SEL_DATE, time:SEL_TIME, staff_name:SEL_STAFF||'', client_name:name, client_whatsapp:wa, owner_whatsapp:CUR.owner_whatsapp, status:'pendiente'};
  let p={...payload};
  for(let i=0;i<5;i++){ const r=await api('bookings',{method:'POST', body:JSON.stringify(p)}); const txt=await r.text(); if(r.ok){ alert('Turno guardado!'); const msg='Hola '+CUR.name+', soy '+name+' reserve '+SEL_SERVICE.name+' el '+SEL_DATE+' a las '+SEL_TIME; window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); renderClient(CUR.slug); return; } let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} const m=(j.message||'').match(/Could not find the '([^']+)' column/); if(m){ delete p[m[1]]; continue; } alert('Error: '+txt); return; }
}
render();
</script></body></html>
