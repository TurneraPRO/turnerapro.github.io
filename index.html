function normalizeWA(input){
  let d=String(input||'').replace(/\D/g,'');
  if(!d) return {ok:false, normalized:'', display:''};
  if(d.startsWith('549') && d.length===13) return {ok:true, normalized:d, display:formatWA(d)};
  if(d.startsWith('54') && d.length===12) { d='549'+d.slice(2); return {ok:true, normalized:d, display:formatWA(d)}; }
  if(d.startsWith('0')) d=d.slice(1);
  if(d.length===12 && d.slice(2,4)==='15') d=d.slice(0,2)+d.slice(4);
  if(d.length===10) { d='549'+d; return {ok:true, normalized:d, display:formatWA(d)}; }
  return {ok:false, normalized:'', display:''};
}
function formatWA(n){
  if(!n || n.length!==13) return n;
  return '+54 9 '+n.slice(3,5)+' '+n.slice(5,9)+' '+n.slice(9);
}
function waLinkNumber(wa){ try{ const r=normalizeWA(wa); if(r.ok) return r.normalized; const d=String(wa||'').replace(/\D/g,''); if(d.length===10) return '549'+d; return d; }catch(e){ return String(wa||'').replace(/\D/g,''); } }
function waDisplay(wa){ try{ const r=normalizeWA(wa); if(r.ok) return r.display; return String(wa||''); }catch(e){ return String(wa||''); } }
function waBranchHint(el){ try{ const r=normalizeWA(el.value||''); el.style.borderColor=(!el.value||r.ok)?'#22c55e':'#f87171'; el.title=r.ok?('Se va a enviar a: '+r.display):(!el.value?'':'Poné 10 dígitos, ej: 11 1234 5678'); }catch(e){} }
function waHint(input, elId){
  const r=normalizeWA(input);
  const el=document.getElementById(elId);
  if(!el) return r;
  if(!input) { el.innerHTML=''; return r; }
  if(r.ok) el.innerHTML='<span style="color:#22c55e;font-weight:700">Se va a enviar a: '+r.display+' ✅</span>';
  else el.innerHTML='<span style="color:#f87171">Poné tu WhatsApp con 10 dígitos, ej: 11 1234 5678</span>';
  return r;
}

function defaultPlantilla(){ return {lun:{on:true,inicio:'10:00',fin:'20:00'},mar:{on:true,inicio:'10:00',fin:'20:00'},mie:{on:true,inicio:'10:00',fin:'20:00'},jue:{on:true,inicio:'10:00',fin:'20:00'},vie:{on:true,inicio:'10:00',fin:'20:00'},sab:{on:true,inicio:'10:00',fin:'18:00'},dom:{on:false,inicio:'10:00',fin:'18:00'}}; }
function getHorarios(b){
  const m=b.meta||{};
  let h=m.horarios;
  if(!h) h={plantilla:defaultPlantilla(), mesCompleto:null, diasSueltos:[]};
  if(!h.plantilla) h.plantilla=defaultPlantilla();
  if(!h.diasSueltos) h.diasSueltos=[];
  if(!h.semanas) h.semanas=[];
  return h;
}
function horarioParaFecha(b, fechaStr){
  const h=getHorarios(b);
  const _modo=h.modo||'fijo';
  const suelto=(h.diasSueltos||[]).find(x=>x.fecha===fechaStr);
  if(suelto){
    if(suelto.tipo==='cerrado') return {cerrado:true, motivo:suelto.motivo||'Cerrado'};
    return {cerrado:false, inicio:suelto.inicio, fin:suelto.fin, motivo:suelto.motivo||'Horario especial'};
  }
  if(_modo==='semana'){
    const _semanas=h.semanas||[];
    const _d0=new Date(fechaStr+'T12:00:00'); const _wd0=_d0.getDay(); const _diff=_wd0===0?-6:1-_wd0; const _lun=new Date(_d0); _lun.setDate(_d0.getDate()+_diff);
    const _lunes=_lun.getFullYear()+'-'+String(_lun.getMonth()+1).padStart(2,'0')+'-'+String(_lun.getDate()).padStart(2,'0');
    const _sem=_semanas.find(x=>x.lunes===_lunes);
    if(!_sem || !_sem.dias) return {cerrado:true, motivo:'Sin horarios esa semana'};
    const _wd=['dom','lun','mar','mie','jue','vie','sab'][_d0.getDay()];
    const _p=_sem.dias[_wd];
    if(!_p || !_p.on) return {cerrado:true, motivo:_sem.motivo||'Cerrado esa semana'};
    return {cerrado:false, inicio:_p.inicio, fin:_p.fin, motivo:_sem.motivo||'Semana del '+_lunes};
  }
  if(h.mesCompleto && h.mesCompleto.mes){
    const mesFecha=fechaStr.slice(0,7);
    if(mesFecha===h.mesCompleto.mes){
      const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
      if((h.mesCompleto.dias||[]).includes(wd)) return {cerrado:false, inicio:h.mesCompleto.inicio, fin:h.mesCompleto.fin, motivo:'Horario de '+h.mesCompleto.mes};
      return {cerrado:true, motivo:'Cerrado este mes'};
    }
  }
  const d=new Date(fechaStr+'T12:00:00'); const wd=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
  const p=h.plantilla[wd];
  if(!p || !p.on) return {cerrado:true, motivo:'Cerrado'};
  return {cerrado:false, inicio:p.inicio, fin:p.fin};
}

async function hashPin(pin){ try{ const enc=new TextEncoder(); const data=enc.encode(PIN_SALT+String(pin||'')); const buf=await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'hash-'+String(pin||''); } }
function isPinHash(v){ return typeof v==='string' && /^[a-f0-9]{64}$/.test(v); }
async function checkPinValue(input, stored){ if(!stored) return false; if(isPinHash(stored)){ const h=await hashPin(input); return h===stored; } return String(input)===String(stored); }

async function checkBusinessPin(slug){
  const b=BUSINESSES.find(x=>x.slug===slug); if(!b) return;
  const _inp=$('#bizPinInput'); const _val=_inp?_inp.value.trim():'';
  if(!_val) return alert('Poné tu PIN');
  const _whoSel=document.getElementById('bizWhoSelect');
  const _whoParts=(_whoSel?_whoSel.value:'owner||').split('|');
  const _whoType=_whoParts[0]||'owner';
  const _whoName=_whoParts[1]||'';
  const _whoBranch=_whoParts[2]||'';

  const _hash=await hashPin(_val);

  // 1) Probar PIN maestro por RPC (acepta también como respaldo en negocio)
  const _rpcMaster=await rpcVerifyMasterPin(_hash);
  if(_rpcMaster===true){
    BIZ_SESSION_PIN_HASH=_hash;
    MASTER_SESSION_PIN_HASH=_hash;
    if(_whoType==='resp' && _whoName && _whoBranch){
      BIZ_SESSION_ROLE=_whoName;
      BIZ_SESSION_BRANCH=_whoBranch;
      BIZ_AGENDA_SUC=_whoBranch;
    } else {
      BIZ_SESSION_ROLE='';
      BIZ_SESSION_BRANCH='';
    }
    const g=$('#bizGate'); if(g) g.style.display='none';
    renderBusinessPanelBody(slug);
    return;
  }

  // 2) Probar PIN del negocio por RPC
  const _rpcOk=await rpcVerifyBusinessPin(slug,_hash);
  if(_rpcOk===true){
    BIZ_SESSION_PIN_HASH=_hash;
    if(_whoType==='resp' && _whoName && _whoBranch){
      BIZ_SESSION_ROLE=_whoName;
      BIZ_SESSION_BRANCH=_whoBranch;
      BIZ_AGENDA_SUC=_whoBranch;
    } else {
      BIZ_SESSION_ROLE='';
      BIZ_SESSION_BRANCH='';
    }
    const g=$('#bizGate'); if(g) g.style.display='none';
    renderBusinessPanelBody(slug);
    return;
  }

  // 3) Si el negocio tiene PIN legacy en meta, verificar y migrar a business_secrets vía RPC
  const _stored=bizPinOf(b);
  if(_stored){
    const _ok=await checkPinValue(_val,_stored);
    if(_ok){
      BIZ_SESSION_PIN_HASH=_hash;
      try{ await rpcMigrateBusinessPin(slug,_hash); }catch(e){}
      if(_whoType==='resp' && _whoName && _whoBranch){
        BIZ_SESSION_ROLE=_whoName;
        BIZ_SESSION_BRANCH=_whoBranch;
        BIZ_AGENDA_SUC=_whoBranch;
      } else {
        BIZ_SESSION_ROLE='';
        BIZ_SESSION_BRANCH='';
      }
      const g=$('#bizGate'); if(g) g.style.display='none';
      renderBusinessPanelBody(slug);
      return;
    }
  }

  alert('PIN incorrecto, intentá de nuevo');
}

      const staffCard=formEl.querySelector('.card-equipo');
      const allChildren=[...formEl.children];
      allChildren.forEach(ch=>{
        if(ch===staffCard) return;
        if(tab==='profesionales'){
          if(ch.tagName==='BUTTON' && ch.textContent.includes('Guardar')){ ch.style.display='block'; return; }
          ch.style.display='none';
        } else if(tab==='negocio'){
          if(ch.tagName==='BUTTON' && ch.textContent.includes('Guardar')){ ch.style.display='block'; return; }

          ch.style.display='block';
        }
      });

async function saveComisiones(slug){

async function loadBillingAdmin(slug){ try{ const pin=MASTER_SESSION_PIN_HASH||''; const el=document.getElementById('billingBody-'+slug); if(!el) return; if(!pin){ el.innerHTML='<p style="font-size:12px;color:#888">Entrá con tu PIN maestro para ver la facturación.</p>'; return; } const data=await rpcGetBilling(slug, pin); const b=BUSINESSES.find(x=>x.slug===slug); const nSuc=branchesOf(b||{}).length||1; const precio=data?.price_per_branch!==undefined&&data?.price_per_branch!==null?data.price_per_branch:50000; const inicio=data?.start_date||''; const ultimo=data?.last_adjustment||''; let proximo=data?.next_adjustment||''; if(!proximo && inicio) proximo=calcNextAdjustment(inicio); const ipc=data?.last_ipc_percent||''; el.innerHTML=`<div style="display:grid;gap:8px"><div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1;min-width:120px"><label style="font-size:12px">Precio por sucursal $</label><input id="billPrice-${slug}" type="number" value="${precio}" placeholder="50000" style="margin:0"></div><div style="flex:1;min-width:120px"><label style="font-size:12px">Fecha de inicio</label><input id="billStart-${slug}" type="date" value="${inicio}" style="margin:0"></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1;min-width:120px"><label style="font-size:12px">Último ajuste</label><input id="billLast-${slug}" type="date" value="${ultimo}" style="margin:0"></div><div style="flex:1;min-width:120px"><label style="font-size:12px">Próximo ajuste</label><input id="billNext-${slug}" type="date" value="${proximo}" readonly style="margin:0;background:#f8fafc"></div></div><div style="font-size:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px">Con ${nSuc} sucursal${nSuc!==1?'es':''} son <b>$${(parseFloat(precio||0)*nSuc).toLocaleString('es-AR')} por mes</b>. Próximo: <b>${proximo?fmtDMY(proximo):'—'}</b>.</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="g" style="padding:8px 12px;font-size:13px" onclick="saveBillingAdmin('${slug}')">Guardar facturación</button><button class="b" style="padding:8px 12px;font-size:13px" onclick="updateIPCAdmin('${slug}')">📈 Actualizar por IPC</button></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="billManualIPC-${slug}" type="number" step="0.01" placeholder="IPC manual % ej: 8.5" style="max-width:150px;margin:0"><button class="w" style="padding:8px 12px;font-size:13px" onclick="applyManualIPCAdmin('${slug}')">Aplicar IPC manual</button></div>${ipc?`<p style="font-size:12px;color:#666;margin:0">Último IPC aplicado: ${ipc}%</p>`:''}</div>`; const startEl=document.getElementById('billStart-'+slug); if(startEl) startEl.addEventListener('change', ()=>{ const nx=calcNextAdjustment(startEl.value); const nxEl=document.getElementById('billNext-'+slug); if(nxEl) nxEl.value=nx; }); }catch(e){} }

async function updateIPCAdmin(slug){ try{ const priceEl=document.getElementById('billPrice-'+slug); if(!priceEl) return; const oldPrice=parseFloat(priceEl.value||'0')||0; if(!oldPrice) return alert('Primero poné el precio por sucursal'); const r=await fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion'); if(!r.ok) throw new Error('API'); const arr=await r.json(); const ultimos=(Array.isArray(arr)?arr:[]).slice(-3); if(ultimos.length<3) throw new Error('sin datos'); const suma=ultimos.reduce((a,x)=>a+(parseFloat(x.valor||0)||0),0); const nuevo=Math.round(oldPrice*(1+suma/100)); if(!confirm(`IPC últimos 3 meses: ${suma.toFixed(2)}%\nPrecio viejo: $${oldPrice.toLocaleString('es-AR')}\nPrecio nuevo: $${nuevo.toLocaleString('es-AR')}\n¿Aplicar?`)) return; priceEl.value=nuevo; const hoy=todayStr(); const pin=MASTER_SESSION_PIN_HASH||''; const start=document.getElementById('billStart-'+slug)?.value||''; let next=calcNextAdjustment(hoy); const nextEl=document.getElementById('billNext-'+slug); if(nextEl) nextEl.value=next; const lastEl=document.getElementById('billLast-'+slug); if(lastEl) lastEl.value=hoy; const ok=await rpcSaveBilling(slug, pin, {price_per_branch:nuevo, start_date:start, last_adjustment:hoy, next_adjustment:next, last_ipc_percent:suma, last_ipc_date:hoy}); if(!ok) return alert('Se calculó pero no se pudo guardar. Apretá Guardar facturación.'); alert('✅ Precio actualizado por IPC'); loadBillingAdmin(slug); }catch(e){ alert('No se pudo traer el IPC automático. Poné el % manual abajo.'); } }

function renderCaja(slug){
  try{
    const b=BUSINESSES.find(x=>x.slug===slug); if(!b) return;
    const el=document.getElementById('cajaBody'); if(!el) return;
    const cfg=tyCfgOf(b);
    const respMode=isBranchResponsibleSession();
    const sucFiltro = respMode ? BIZ_SESSION_BRANCH : (BIZ_AGENDA_SUC || 'Todas');
    const com=comisionesOf(b);
    const staffList=(b.staff||[]).map(s=>s.name).filter(Boolean);
    if(!BIZ_CAL_DATE) BIZ_CAL_DATE=todayStr();
    const hoy=todayStr();
    let desde=hoy, hasta=hoy;
    if(BIZ_CAJA_PERIODO==='semana'){
      const d=new Date(hoy+'T12:00:00'); const dia=d.getDay()===0?6:d.getDay()-1;
      const ini=new Date(d); ini.setDate(d.getDate()-dia);
      const fin=new Date(ini); fin.setDate(ini.getDate()+6);
      const f=(x)=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
      desde=f(ini); hasta=f(fin);
    } else if(BIZ_CAJA_PERIODO==='mes'){
      desde=hoy.slice(0,7)+'-01';
      const d=new Date(hoy.slice(0,7)+'-01T12:00:00'); d.setMonth(d.getMonth()+1); d.setDate(0);
      hasta=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
    const list=(BIZ_AGENDA||[]).filter(x=>{
      const st=String(x.status||'').toLowerCase();
      if(['cancelado','eliminado','borrado','deleted','eliminated'].includes(st)) return false;
      if(!x.date) return false;
      if(x.date<desde || x.date>hasta) return false;
      if(sucFiltro && sucFiltro!=='Todas' && effectiveBranchName(x,b)!==sucFiltro) return false;
      return true;
    });
    let total=0; const porProf={};
    list.forEach(x=>{
      const p=parseFloat(x.price||0)||0; total+=p;
      const n=x.staff_name||'Sin profesional';
      if(!porProf[n]) porProf[n]={cant:0, total:0, com:0};
      porProf[n].cant+=1; porProf[n].total+=p;
      const pct=(cfg.usesCommissions && com[n]!==undefined)?com[n]:0;
      porProf[n].com+=p*pct/100;
    });
    let totalCom=0; Object.values(porProf).forEach(v=>{ totalCom+=v.com; });
    const totalNegocio=total-totalCom;
    const manual=cajaManualOf(b);
    let totalEfectivo=0, totalTransf=0, totalPendiente=0;
    list.forEach(x=>{
      const p=parseFloat(x.price||0)||0;
      if(manual){
        if(x.cobrado){ if(x.pago_metodo==='transferencia') totalTransf+=p; else totalEfectivo+=p; }
        else totalPendiente+=p;
      }
    });
    if(!window.BIZ_CAJA_CIERRE_FECHA) window.BIZ_CAJA_CIERRE_FECHA=todayStr();

    el.innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <button class="${BIZ_CAJA_PERIODO==='hoy'?'g':'w'}" style="padding:8px 12px" onclick="BIZ_CAJA_PERIODO='hoy';renderCaja('${b.slug}')">Hoy</button>
      <button class="${BIZ_CAJA_PERIODO==='semana'?'g':'w'}" style="padding:8px 12px" onclick="BIZ_CAJA_PERIODO='semana';renderCaja('${b.slug}')">Esta semana</button>
      <button class="${BIZ_CAJA_PERIODO==='mes'?'g':'w'}" style="padding:8px 12px" onclick="BIZ_CAJA_PERIODO='mes';renderCaja('${b.slug}')">Este mes</button>
    </div>
    <p style="font-size:13px;color:#666;margin:0 0 10px">${respMode?'📍 Sucursal: <b>'+escHtml(BIZ_SESSION_BRANCH)+'</b> (solo lectura) • ':''}Del ${fmtDMY(desde)} al ${fmtDMY(hasta)} • ${list.length} turno${list.length!==1?'s':''} confirmado${list.length!==1?'s':''}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px"><div style="font-size:12px;color:#666">Total</div><b style="font-size:18px">$${total.toLocaleString('es-AR')}</b></div>
      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px"><div style="font-size:12px;color:#666">Para el negocio</div><b style="font-size:18px">$${totalNegocio.toLocaleString('es-AR')}</b></div>
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px"><div style="font-size:12px;color:#666">Para profesionales</div><b style="font-size:18px">$${totalCom.toLocaleString('es-AR')}</b></div>
    </div>
    ${cfg.usesCommissions ? `<details class="ty-collapse"><summary>💰 Comisiones por profesional</summary><div class="ty-body"><p style="font-size:12px;color:#666;margin:4px 0 10px">${respMode?'Comisiones de la sucursal (solo lectura). Solo el Dueño puede cambiarlas.':'Poné el % que le queda a cada profesional por cada turno. Si lo dejás en 0, todo queda para el negocio.'}</p>${staffList.length?staffList.map(n=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><span style="flex:1;min-width:140px;font-weight:700">${n}</span><input data-comision="${n}" type="number" min="0" max="100" value="${com[n]!==undefined?com[n]:0}" ${respMode?'disabled':''} style="max-width:110px" placeholder="Ej: 50"><span style="font-size:13px;color:#666">% por turno</span></div>`).join(''):`<p style="font-size:13px;color:#888">Todavía no tenés profesionales cargados.</p>`}${!respMode?`<button class="g" onclick="saveComisiones('${b.slug}')">Guardar comisiones</button>`:''}</div></details>` : ``}
    ${manual?`<details class="ty-collapse" open><summary>💰 Control manual - Cobrado + Cierre</summary><div class="ty-body"><b style="font-size:13px">Solo lo cobrado suma</b><p style="font-size:12px;color:#666;margin:4px 0 10px">Si un turno no está marcado como Cobrado, no suma en lo cobrado, queda como pendiente. Cancelado nunca suma.</p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px"><div style="font-size:12px;color:#666">💵 Cobrado en efectivo</div><b>$${totalEfectivo.toLocaleString('es-AR')}</b></div><div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px"><div style="font-size:12px;color:#666">🏦 Cobrado en transferencia</div><b>$${totalTransf.toLocaleString('es-AR')}</b></div><div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px"><div style="font-size:12px;color:#666">⏳ Pendiente de cobro</div><b>$${totalPendiente.toLocaleString('es-AR')}</b></div></div><details class="ty-collapse" open><summary>🧾 Cierre de caja por día</summary><div class="ty-body"><p style="font-size:12px;color:#666;margin:4px 0">Compará lo que dice TurnoYa con lo que realmente contaste. Si da $0, cierra perfecto. Si no, te dice cuánto falta o sobra.</p><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><label style="font-size:12px">Fecha del cierre</label><input id="cierreFecha" type="date" value="${window.BIZ_CAJA_CIERRE_FECHA}" onchange="window.BIZ_CAJA_CIERRE_FECHA=this.value;renderCaja('${b.slug}')" style="max-width:170px;margin:0"></div><div id="cierreBody"><p style="color:#888;font-size:12px">Calculando cierre del día...</p></div></div></details></div></details>`:``}

async function loadCierreDia(slug){ try{ const b=BUSINESSES.find(x=>x.slug===slug); if(!b) return; const el=document.getElementById('cierreBody'); if(!el) return; const fecha=window.BIZ_CAJA_CIERRE_FECHA||todayStr(); const sucFiltro = isBranchResponsibleSession() ? BIZ_SESSION_BRANCH : (BIZ_AGENDA_SUC || 'Todas'); const listDia=(BIZ_AGENDA||[]).filter(x=>x.date===fecha && !['cancelado','eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase()) && (!sucFiltro || sucFiltro==='Todas' || effectiveBranchName(x,b)===sucFiltro)); let espEf=0, espTr=0; listDia.forEach(x=>{ const p=parseFloat(x.price||0)||0; if(x.cobrado){ if(x.pago_metodo==='transferencia') espTr+=p; else espEf+=p; } }); const pin=BIZ_SESSION_PIN_HASH||MASTER_SESSION_PIN_HASH||''; const prev=await rpcGetCierre(slug, pin, fecha); const contEf=prev?.contado_efectivo!==undefined&&prev?.contado_efectivo!==null?prev.contado_efectivo:''; const verTr=prev?.verificado_transferencia!==undefined&&prev?.verificado_transferencia!==null?prev.verificado_transferencia:''; el.innerHTML=`<div style="font-size:13px;line-height:1.6"><div>💵 Efectivo esperado (TurnoYa): <b>$${espEf.toLocaleString('es-AR')}</b></div><div>🏦 Transferencia esperada (TurnoYa): <b>$${espTr.toLocaleString('es-AR')}</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><div style="flex:1;min-width:140px"><label style="font-size:12px">💵 Efectivo contado en caja</label><input id="cierreContadoEf" type="number" value="${contEf}" placeholder="Ej: 80000" style="margin:0"></div><div style="flex:1;min-width:140px"><label style="font-size:12px">🏦 Transferencia que ves en el banco</label><input id="cierreVerificadoTr" type="number" value="${verTr}" placeholder="Ej: 60000" style="margin:0"></div></div><div style="margin-top:8px"><label style="font-size:12px">📝 Nota (si no cierra, ¿por qué?)</label><textarea id="cierreNota" rows="2" placeholder="Ej: Faltó cobrar un turno, quedó para mañana." style="width:100%;margin:0">${prev?.nota||""}</textarea></div><button class="g" style="margin-top:8px" onclick="saveCierreDia('${slug}')">Cerrar caja del día</button><div id="historialCierres" style="margin-top:12px"><p style="color:#888;font-size:12px">Cargando historial...</p></div><div id="cierreResultado" style="margin-top:8px">${prev?`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px;font-size:12px">Último cierre guardado: Efectivo contado $${(prev.contado_efectivo||0).toLocaleString('es-AR')} / Transferencia verificada $${(prev.verificado_transferencia||0).toLocaleString('es-AR')} • Dif. efectivo $${((prev.contado_efectivo||0)-(prev.esperado_efectivo||0)).toLocaleString('es-AR')} • Dif. transf. $${((prev.verificado_transferencia||0)-(prev.esperado_transferencia||0)).toLocaleString('es-AR')}</div>`:''}</div></div>`; try{ loadHistorialCierres(slug); }catch(e){} }catch(e){} }
async function loadHistorialCierres(slug){ try{ const el=document.getElementById('historialCierres'); if(!el) return; const pin=BIZ_SESSION_PIN_HASH||MASTER_SESSION_PIN_HASH||''; const list=await rpcGetCierresList(slug, pin); const byFecha={}; (list||[]).forEach(c=>{ if(c.fecha) byFecha[c.fecha]=c; }); if(!window.BIZ_CAJA_HIST_MES){ const base=window.BIZ_CAJA_CIERRE_FECHA||todayStr(); window.BIZ_CAJA_HIST_MES=base.slice(0,7); } const mesStr=window.BIZ_CAJA_HIST_MES; const [yy,mm]=mesStr.split('-').map(Number); const first=new Date(yy, mm-1, 1); const lastDay=new Date(yy, mm, 0).getDate(); const mesNombre=first.toLocaleDateString('es-AR',{month:'long', year:'numeric'}); const selFecha=window.BIZ_CAJA_CIERRE_FECHA||todayStr(); const hoy=todayStr(); const stats={ok:0,diff:0,none:0}; let wd=first.getDay(); let offset=(wd===0?6:wd-1); let cells=''; for(let k=0;k<offset;k++){ cells+=`<div style="min-height:44px"></div>`; } for(let d=1; d<=lastDay; d++){ const fecha=yy+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0'); const c=byFecha[fecha]; const isFuture=fecha>hoy; const isToday=fecha===hoy; const isSel=fecha===selFecha; let cls='none'; let dot='⬜'; let label='Sin cerrar'; if(c){ const difEf=(c.contado_efectivo||0)-(c.esperado_efectivo||0); const difTr=(c.verificado_transferencia||0)-(c.esperado_transferencia||0); if(difEf===0&&difTr===0){ cls='ok'; dot='🟩'; label='Cerró'; if(!isFuture) stats.ok++; } else { cls='diff'; dot='🟨'; label='Con diferencia'; if(!isFuture) stats.diff++; } } else if(isFuture){ cls='future'; dot=''; label=''; } else { stats.none++; } cells+=`<div class="ty-cal-cell ${cls} ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectCierreDia('${slug}','${fecha}')" title="${fmtDMY(fecha)} - ${label}"><b>${d}</b><span class="ty-cal-dot">${dot}</span></div>`; } el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><button class="w" style="padding:6px 10px;font-size:12px" onclick="moveHistorialMes('${slug}',-1)">◀ Anterior</button><b style="text-transform:capitalize;font-size:14px">${mesNombre}</b><button class="w" style="padding:6px 10px;font-size:12px" onclick="moveHistorialMes('${slug}',1)">Siguiente ▶</button></div><div style="font-size:12px;color:#666;margin:6px 0;text-align:center">🟩 Cerró &nbsp; 🟨 Con diferencia &nbsp; ⬜ Sin cerrar &nbsp; • ${stats.ok} cerrados • ${stats.diff} con diferencia • ${stats.none} sin cerrar</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:#888;margin-bottom:4px"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div class="ty-cal-grid">${cells}</div>`; }catch(e){} }

async function saveCierreDia(slug){ try{ const b=BUSINESSES.find(x=>x.slug===slug); const fecha=window.BIZ_CAJA_CIERRE_FECHA||todayStr(); const contado=parseFloat(document.getElementById('cierreContadoEf')?.value||''); const verif=parseFloat(document.getElementById('cierreVerificadoTr')?.value||''); if(isNaN(contado) || isNaN(verif)) return alert('Poné cuánto contaste en efectivo y cuánto viste en transferencias'); const sucFiltro = isBranchResponsibleSession() ? BIZ_SESSION_BRANCH : (BIZ_AGENDA_SUC || 'Todas'); const listDia=(BIZ_AGENDA||[]).filter(x=>x.date===fecha && !['cancelado','eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase()) && (!sucFiltro || sucFiltro==='Todas' || effectiveBranchName(x,b)===sucFiltro)); let espEf=0, espTr=0; listDia.forEach(x=>{ const p=parseFloat(x.price||0)||0; if(x.cobrado){ if(x.pago_metodo==='transferencia') espTr+=p; else espEf+=p; } }); const difEf=contado-espEf; const difTr=verif-espTr; const msgDif=(difEf===0&&difTr===0)?'✅ Caja cierra perfecto':`⚠️ Diferencia: Efectivo ${difEf>=0?'sobran $'+difEf.toLocaleString('es-AR'):'faltan $'+Math.abs(difEf).toLocaleString('es-AR')} • Transferencia ${difTr>=0?'sobran $'+difTr.toLocaleString('es-AR'):'faltan $'+Math.abs(difTr).toLocaleString('es-AR')}`; if(!confirm(`Cierre ${fmtDMY(fecha)}\nEfectivo esperado $${espEf.toLocaleString('es-AR')} - Contado $${contado.toLocaleString('es-AR')}\nTransferencia esperada $${espTr.toLocaleString('es-AR')} - Verificada $${verif.toLocaleString('es-AR')}\n${msgDif}\n¿Guardar este cierre?`)) return; const nota=document.getElementById('cierreNota')?.value.trim()||''; if((difEf!==0||difTr!==0) && !nota){ if(!confirm('Este cierre tiene diferencia y no pusiste nota. ¿Querés guardarlo igual sin nota?')) return; } const pin=BIZ_SESSION_PIN_HASH||MASTER_SESSION_PIN_HASH||''; const ok=await rpcSaveCierre(slug, pin, {fecha, esperado_efectivo:espEf, esperado_transferencia:espTr, contado_efectivo:contado, verificado_transferencia:verif, nota}); if(!ok){ const res=document.getElementById('cierreResultado'); if(res) res.innerHTML=`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px;font-size:13px">${msgDif}<br><span style="color:#888">No se pudo guardar en Supabase todavía.</span></div>`; return; } alert(msgDif); loadCierreDia(slug); }catch(e){ alert('Error al cerrar caja'); } }

function renderTurnoCard(x, slug, b, sena){
  const st=x.status||'pendiente';
  const isWait=st==='esperando_seña'||st==='esperando_sena';
  const isConf=st==='confirmado';
  const isCanc=String(st).toLowerCase()==='cancelado';
  const badge=isWait?'<span style="background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:99px;font-size:11px;white-space:nowrap">⏳ Esperando seña</span>':isConf?'<span style="background:#dcfce7;color:#166534;padding:2px 7px;border-radius:99px;font-size:11px;white-space:nowrap">✅ Confirmado</span>':isCanc?'<span style="background:#fee2e2;color:#991b1b;padding:2px 7px;border-radius:99px;font-size:11px;white-space:nowrap">❌ Cancelado</span>':'<span style="background:#e0e7ff;color:#3730a3;padding:2px 7px;border-radius:99px;font-size:11px;white-space:nowrap">'+escHtml(st)+'</span>';
  const showConfirm = sena.on && isWait;
  const brName = effectiveBranchName(x,b);
  const bg=isCanc?'#fef2f2':isWait?'#fffbeb':'#f0fdf4';
  const bd=isCanc?'#fecaca':isWait?'#fde68a':'#bbf7d0';
  return `<div style="background:${bg};border:1px solid ${bd};border-radius:10px;padding:8px;margin-bottom:6px;font-size:12px">
    <div style="display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;align-items:center">
      <b>${escHtml(x.time||'')} • ${escHtml(x.client_name||'Cliente')}</b>
      ${badge}
    </div>
    <div style="margin-top:3px;font-weight:700;color:#111">${escHtml(x.service||'')} ${x.price?' - $'+escHtml(String(x.price)):''}</div>
    <div style="font-size:11px;color:#555;margin-top:2px">${brName?'📍 '+escHtml(brName)+' ':''}${x.staff_name?'• '+escHtml(x.staff_name)+' ':''}${x.duration?'• '+escHtml(String(x.duration))+' min':''}</div>
    <div style="font-size:11px;color:#444;margin-top:2px">📱 ${escHtml(x.client_whatsapp||'')}</div>
    ${x.extra_info?`<div style="font-size:11px;color:#334155;margin-top:2px">ℹ️ ${escHtml(x.extra_info)}</div>`:''}
    ${sena.on && isWait ? `<div style="font-size:11px;color:#92400e;margin-top:2px">Pedile comprobante por WhatsApp</div>`:''}
    <div style="display:${isCanc?'none':'flex'};gap:4px;flex-wrap:wrap;margin-top:6px">
      <button class="b" style="padding:5px 8px;font-size:11px" onclick="wspCliente('${(x.client_whatsapp||'').replace(/[^0-9]/g,'')}','${(x.client_name||'').replace(/'/g,'')}','${(b.name||'').replace(/'/g,"")}')">💬 Escribirle</button>
      <button class="y" style="padding:5px 8px;font-size:11px" onclick="sendReminder('${(x.client_whatsapp||'').replace(/[^0-9]/g,'')}','${(x.client_name||'').replace(/'/g,'')}','${(b.name||'').replace(/'/g,"")}','${x.date||''}','${x.time||''}','${(x.service||'').replace(/'/g,'')}','${(x.staff_name||'').replace(/'/g,'')}')">⏰ Recordatorio</button>
      ${showConfirm?'<button class="g" style="padding:5px 8px;font-size:11px" onclick="confirmBookingSena(\''+x.id+'\',\''+slug+'\')">✅ Confirmar seña</button>':''}
      ${!isCanc?'<button class="y" style="padding:5px 8px;font-size:11px" onclick="setBookingStatus(\''+x.id+'\',\'cancelado\',\''+slug+'\')">Cancelar</button>':''}
      ${(!isCanc && cajaManualOf(b))? (x.cobrado? '<button class="g" style="padding:5px 8px;font-size:11px" onclick="toggleCobrado(\''+x.id+'\',\''+slug+'\')">✅ Cobrado ('+(x.pago_metodo==='transferencia'?'🏦 Transf':'💵 Efec')+')</button>' : '<button class="w" style="padding:5px 8px;font-size:11px;border:1px solid #ddd" onclick="toggleCobrado(\''+x.id+'\',\''+slug+'\')">💰 Cobrado</button>') : ''}
    </div>
    ${isCanc?'<div style="margin-top:6px"><button class="r" style="padding:5px 8px;font-size:11px" onclick="delBooking(\''+x.id+'\',\''+slug+'\')">🗑️ Borrar</button></div>':''}
  </div>`;
}

function renderCalendario(slug){
  try{
    const b=BUSINESSES.find(x=>x.slug===slug); if(!b) return;
    const el=document.getElementById('agendaList'); if(!el) return;
    if(!BIZ_CAL_DATE) BIZ_CAL_DATE=todayStr();
    const fecha=BIZ_CAL_DATE;
    const sena=senaOf(b);
    const respMode=isBranchResponsibleSession();
    const sucFiltro = respMode ? BIZ_SESSION_BRANCH : (BIZ_AGENDA_SUC || 'Todas');
    const staffRaw = (sucFiltro && sucFiltro!=='Todas') ? staffForBranch(b, sucFiltro) : (b.staff||[]);
    const staffList = staffRaw.map(s=>s.name).filter(Boolean);

    let list=(BIZ_AGENDA||[]).filter(x=>{
      if(x.date!==fecha) return false;
      if(['eliminado','borrado','deleted','eliminated'].includes(String(x.status||'').toLowerCase())) return false;
      if(sucFiltro && sucFiltro!=='Todas' && effectiveBranchName(x,b)!==sucFiltro) return false;
      const st=String(x.status||'').toLowerCase();
      if(BIZ_AGENDA_FILTRO==='Cancelados') return st==='cancelado';
      if(BIZ_AGENDA_FILTRO==='Esperando seña') return st==='esperando_seña' || st==='esperando_sena';
      if(BIZ_AGENDA_FILTRO==='Hoy' || BIZ_AGENDA_FILTRO==='Próximos') return st!=='cancelado';
      return true;
    });

    const horas=[]; for(let h=7;h<23;h++){ horas.push(String(h).padStart(2,'0')+':00'); horas.push(String(h).padStart(2,'0')+':30'); }
    const cols=staffList.length?staffList:['Sin profesional'];

    let html=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <button class="w" onclick="calMove(-1)">◀ Ayer</button>
      <button class="w" onclick="BIZ_CAL_DATE=todayStr();renderCalendario('${slug}')">Hoy</button>
      <button class="w" onclick="calMove(1)">Mañana ▶</button>
      <input id="calDateInput" type="date" value="${fecha}" onchange="setCalDate(this.value)" style="max-width:170px;margin:0">
      <span style="font-size:13px;font-weight:700">${fmtLargo(fecha)}</span>
    </div>`;

    if(!list.length){
      html+=`<div style="text-align:center;padding:18px;color:#888;background:#fff;border-radius:12px;border:1px solid #eee">No hay turnos este día${sucFiltro!=='Todas'?' en '+escHtml(sucFiltro):''}. Los huecos están libres.</div>`;
    }

    html+=`<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:68px repeat(${cols.length},minmax(190px,1fr));gap:6px;min-width:560px">`;
    html+=`<div style="font-weight:800;font-size:12px;padding:8px">Hora</div>`+cols.map(c=>`<div style="font-weight:800;font-size:12px;padding:8px;background:#f0fdf4;border-radius:8px;text-align:center">${escHtml(c)}</div>`).join('');

    horas.forEach(hora=>{
      const turnosHora = list.filter(x=>x.time===hora);
      const tiene=turnosHora.length>0;
      if(!tiene && (hora<'08:00' || hora>'21:30')) return;
      html+=`<div style="font-size:12px;color:#666;padding:8px;border-top:1px solid #f1f5f9;font-weight:700">${hora}</div>`;
      cols.forEach(c=>{
        const cellTurnos = turnosHora.filter(x=> x.staff_name===c || (!staffList.length && !x.staff_name));
        if(cellTurnos.length){
          html+=`<div style="border-top:1px solid #f1f5f9;padding:4px">${cellTurnos.map(t=>renderTurnoCard(t, slug, b, sena)).join('')}</div>`;
        } else {
          html+=`<div style="border:1px dashed #e5e7eb;border-radius:10px;padding:8px;font-size:12px;color:#ccc;text-align:center;align-self:start;margin-top:4px">Libre</div>`;
        }
      });
    });

    html+=`</div></div><p style="font-size:12px;color:#888;margin-top:8px">Vista calendario: cada columna es un profesional, cada fila es una hora. Si hay más de un turno en la misma hora y profesional, se muestran todos.</p>`;
    el.innerHTML=html;
  }catch(e){ const el=document.getElementById('agendaList'); if(el) el.innerHTML='<p style="color:#b45309">No se pudo cargar el calendario.</p>'; }
}

function renderBusinessPanelBody(slug){
  const _bPause=BUSINESSES.find(x=>x.slug===slug);
  if(_bPause && isBizPaused(_bPause)){
    const _el=document.getElementById('bizBody');
    if(_el && !_el.dataset.pausedBanner){
      _el.dataset.pausedBanner='1';
      _el.insertAdjacentHTML('afterbegin','<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:12px;color:#991b1b;font-weight:700">⏸️ Tu página está pausada - Hablar con TurnoYa para reactivarla</div>');
    }
  }

async function checkPin(){

async function upsertDemoRecord(catId){
  const {slug, pinHash, payload} = await buildDemoPayload(catId);
  const exists = BUSINESSES.some(x=>x.slug===slug);
  const r = exists
    ? await api('businesses?slug=eq.'+encodeURIComponent(slug), {method:'PATCH', body:JSON.stringify(payload)})
    : await api('businesses', {method:'POST', body:JSON.stringify(payload)});
  if(!r.ok) throw new Error(await r.text());
  if(MASTER_SESSION_PIN_HASH){
    try{ await rpcSetBusinessPin(slug, pinHash, MASTER_SESSION_PIN_HASH); }catch(e){}
  }
  try{ await rpcMigrateBusinessPin(slug, pinHash); }catch(e){}
}

function handleStaffPhoto(input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const row=input.closest('#staffRows > div')||input.parentElement.parentElement||input.parentElement;
    const img=row.querySelector('img');
    if(img){ img.src=e.target.result; img.style.display='block'; }
    const urlInput=row.querySelector('[data-staffphoto]');
    if(urlInput) urlInput.value=e.target.result;
  };
  reader.readAsDataURL(f);
}

function applyTyCfgVisibility(isBusinessPanel){
  const mode = document.getElementById('tyPeopleMode')?.value || 'multi';
  const usesBranchesEl = document.getElementById('tyUsesBranches');
  const usesCommEl = document.getElementById('tyUsesCommissions');
  const branchWrap = document.getElementById('tyBranchesToggleWrap');
  const commWrap = document.getElementById('tyCommToggleWrap');
  const sucCard = document.getElementById('sucCardBox');
  const respCard = document.getElementById('respCardBox');

  if(mode === 'single'){
    if(usesBranchesEl) usesBranchesEl.value = '0';
    if(usesCommEl) usesCommEl.value = '0';
    if(branchWrap) branchWrap.style.display = 'none';
    if(commWrap) commWrap.style.display = 'none';
    if(sucCard) sucCard.style.display = 'none';
    if(respCard) respCard.style.display = 'none';
  } else {
    if(branchWrap) branchWrap.style.display = 'block';
    if(commWrap) commWrap.style.display = 'block';
    const showSuc = usesBranchesEl ? (usesBranchesEl.value === '1') : true;
    if(sucCard) sucCard.style.display = showSuc ? 'block' : 'none';
    if(respCard) respCard.style.display = 'block';
  }
}

function lunesDe(fechaStr){ try{ const d=new Date(fechaStr+'T12:00:00'); const wd=d.getDay(); const diff=wd===0?-6:1-wd; d.setDate(d.getDate()+diff); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return fechaStr; } }
function toggleSueltoHorarioRow(){ try{ const _sel=document.getElementById('sueltoTipo'); const _row=document.getElementById('sueltoHorarioRow'); if(!_sel || !_row) return; _row.style.display = (_sel.value==='cerrado') ? 'none' : 'flex'; }catch(e){} }
function setHorarioModo(modo, silent){ try{ window._horarioModo=modo||'fijo'; const _btnF=document.getElementById('modoFijoBtn'); const _btnS=document.getElementById('modoSemanaBtn'); if(_btnF) _btnF.classList.toggle('sel', window._horarioModo==='fijo'); if(_btnS) _btnS.classList.toggle('sel', window._horarioModo==='semana'); const _hint=document.getElementById('modoHint'); if(_hint) _hint.innerHTML = window._horarioModo==='fijo' ? 'Modo fijo: usás <b>Siempre + Mes + Días sueltos</b>.' : 'Modo por semana: usás <b>Semana puntual + Días sueltos</b>.'; document.querySelectorAll('[data-solapa]').forEach(btn=>{ const _m=btn.getAttribute('data-modo')||'ambos'; let _show=true; if(window._horarioModo==='fijo' && _m==='semana') _show=false; if(window._horarioModo==='semana' && _m==='fijo') _show=false; btn.style.display=_show?'':'none'; const _id=btn.getAttribute('data-solapa'); const _cuerpo=document.getElementById(_id); if(_cuerpo && !_show) _cuerpo.style.display='none'; }); try{ let _n=0; document.querySelectorAll('[data-solapa]').forEach(btn=>{ if(btn.style.display==='none') return; _n++; const _b=btn.querySelector('b'); if(_b) _b.innerHTML=_b.innerHTML.replace(/\d+\)/, _n+')'); }); }catch(e){} try{ toggleSueltoHorarioRow(); }catch(e){} }catch(e){} }
function toggleHorarioSolapa(id){ try{ const _all=document.querySelectorAll('.hor-solapa-cuerpo'); let _target=null; _all.forEach(el=>{ if(el.id===id) _target=el; }); if(!_target) return; const _estabaOculto=_target.style.display==='none'; _all.forEach(el=>{ el.style.display='none'; const _btn=document.querySelector('[data-solapa="'+el.id+'"]'); if(_btn) _btn.classList.remove('sel'); }); if(_estabaOculto){ _target.style.display='block'; const _btn=document.querySelector('[data-solapa="'+id+'"]'); if(_btn) _btn.classList.add('sel'); if(id==='sol-suelto'){ try{ toggleSueltoHorarioRow(); }catch(e){} } _target.scrollIntoView({behavior:'smooth', block:'nearest'}); } }catch(e){} }
function semanasDesdeDOM(){ const _out=[]; document.querySelectorAll('#listaSemanas > div[data-semana]').forEach(div=>{ const _lunes=div.dataset.semana; const _dias={}; div.querySelectorAll('[data-semana-dia]').forEach(row=>{ const _k=row.dataset.semanaDia; const _tg=row.querySelector('.toggle'); const _on=_tg?_tg.dataset.on==='1':true; _dias[_k]={on:_on, inicio:row.querySelector('[data-semana-inicio]')?.value||'10:00', fin:row.querySelector('[data-semana-fin]')?.value||'20:00'}; }); _out.push({lunes:_lunes, motivo:div.querySelector('[data-semana-motivo]')?.value||'', dias:_dias}); }); return _out; }
function semanaHTML(s, idx){ const _lun=s.lunes; const _d=new Date(_lun+'T12:00:00'); const _fin=new Date(_d); _fin.setDate(_d.getDate()+6); const _finStr=_fin.getDate()+'/'+(_fin.getMonth()+1); const _iniStr=_d.getDate()+'/'+(_d.getMonth()+1); return `<div data-semana="${_lun}" style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;background:#fff"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>Semana ${_iniStr} al ${_finStr} (Lun ${_lun})</b><button type="button" class="r" style="padding:6px 10px;font-size:12px" onclick="removeSemana(${idx})">Borrar semana</button></div><label style="margin:8px 0 4px">Motivo (opcional)</label><input data-semana-motivo value="${(s.motivo||'').replace(/"/g,'')}" placeholder="Ej: Semana especial"><div style="margin-top:8px">${DIAS.map(d=>{ const _p=(s.dias||{})[d.k]||{on:true,inicio:'10:00',fin:'20:00'}; return `<div class="dayrow" data-semana-dia="${d.k}"><b style="width:40px">${d.label}</b><div class="toggle ${_p.on?'on':''}" onclick="this.classList.toggle('on');this.dataset.on=this.classList.contains('on')?'1':'0'" data-on="${_p.on?'1':'0'}"></div><input type="time" data-semana-inicio value="${_p.inicio}" style="margin:0"><span> a </span><input type="time" data-semana-fin value="${_p.fin}" style="margin:0"></div>`; }).join('')}</div></div>`; }
function renderListaSemanas(){ const c=document.getElementById('listaSemanas'); if(!c) return; const _arr=window._tmpSemanas||[]; if(!_arr.length){ c.innerHTML='<p style="color:#6b7280;font-size:13px">Todavía no hay semanas puntuales.</p>'; return; } c.innerHTML=_arr.map((s,i)=>semanaHTML(s,i)).join(''); }

  if(_staffForBranch.length){ if(SEL_STAFF && !_staffForBranch.some(s=>s.name===SEL_STAFF)) SEL_STAFF=null; } else { SEL_STAFF=null; }
  if(SEL_SERVICE_IDX>=0 && b.services[SEL_SERVICE_IDX]) SEL_SERVICE=b.services[SEL_SERVICE_IDX];

  let occupied30=[]; if(CFG.url){ try{ const _proms=[]; for(let _di=0;_di<30;_di++){ const _d=new Date(); _d.setDate(_d.getDate()+_di); const _ds=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0'); _proms.push(rpcGetOccupiedSlots(b.slug,_ds)); } const _all30=await Promise.all(_proms); occupied30=_all30.flat(); }catch(e){} }
  function hasFreeSlotFor(_ds,_dur){ const _h=horarioParaFecha(b,_ds); if(_h.cerrado) return false; const [sh2,sm2]=_h.inicio.split(':').map(Number); const [eh2,em2]=_h.fin.split(':').map(Number); let _c=sh2*60+sm2; const _e=eh2*60+em2; const _esHoy2=_ds===todayStr(); const _ahora2=new Date(); const _ahoraMin2=_ahora2.getHours()*60+_ahora2.getMinutes(); const _br2=(()=>{ const _f=branchForStaff(b, SEL_STAFF); return _f ? (_branchesAll.find(x=>x.name===_f)||branchOf(b)) : branchOf(b); })(); while(_c+_dur<=_e){ if(!(_esHoy2 && _c<=_ahoraMin2)){ const _s=_c, _en=_c+_dur; const _choca=occupied30.some(o=>{ if(!isBookingActive(o)) return false; if(String(o.date||'')!==_ds) return false; if(effectiveBranchName(o,b) && effectiveBranchName(o,b)!==_br2.name) return false; if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; return overlaps(_s,_en,bookingStartMin(o),bookingEndMin(o)); }); if(!_choca) return true; } _c+=30; } return false; }
  function isOccupied(slot){ if(!SEL_SERVICE) return false; const dur=SEL_SERVICE.duration||40; const [sh,sm]=slot.split(':').map(Number); const sMin=sh*60+sm; const eMin=sMin+dur; const br=(()=>{ const _f=branchForStaff(CUR, SEL_STAFF); return _f ? (branchesOf(CUR).find(x=>x.name===_f)||branchOf(CUR)) : branchOf(CUR); })(); return occupied.some(o=>{ if(!isBookingActive(o)) return false; if(effectiveBranchName(o,CUR) && effectiveBranchName(o,CUR)!==br.name) return false; if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; if(_staffRequired && !SEL_STAFF) return true; return overlaps(sMin,eMin,bookingStartMin(o),bookingEndMin(o)); }); }

  const _needBranch = cfg.usesBranches && _branchesAll.length>1 && !CLI_BRANCH_OK;
  const _wiz = _needBranch ? 0 : !SEL_SERVICE ? 1 : !SEL_STAFF ? 2 : !SEL_TIME ? 3 : 4;
  const _resumen=[];
  if(cfg.usesBranches && _branchesAll.length>1 && CLI_BRANCH_OK) _resumen.push('📍 '+branchOf(b).name);
  if(SEL_SERVICE) _resumen.push('✨ '+SEL_SERVICE.name);
  if(SEL_STAFF) _resumen.push('👤 '+SEL_STAFF);
  if(SEL_TIME) _resumen.push('📅 '+fmtDMY(SEL_DATE)+' '+SEL_TIME);

  const staffLabel=c.staff||'profesional';
  const _fullAddr=(()=>{ const _a=(b.address||'').trim(); const _bb=(b.barrio||'').trim(); if(_a && _bb && _a!==_bb) return _a+', '+_bb; return _a||_bb||''; })();
  const _brAddr=branchOf(b);
  const _fullBranchAddr=(()=>{ const _a=(_brAddr.address||b.address||'').trim(); const _bb=(_brAddr.barrio||b.barrio||'').trim(); if(_a && _bb && _a!==_bb) return _a+', '+_bb; return _a||_bb||''; })();
  const _last = (typeof window._LAST_BOOKING!=='undefined' && window._LAST_BOOKING && window._LAST_BOOKING.slug===b.slug) ? window._LAST_BOOKING : null;
  const _extraLabel = (cfg.datoExtra||'').trim();

  $('#app').innerHTML=`
  <div style="max-width:560px;margin:0 auto;padding:0 0 20px">
  <div class="hero">${b.banner_url?`<img src="${b.banner_url}" class="hero-img">`:`<div style="height:200px;background:linear-gradient(135deg,${color},#111)"></div>`}<div class="hero-overlay"></div><div class="hero-content">${b.logo_url?`<img src="${b.logo_url}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4)">`:''}<div style="color:#fff"><span class="badge" style="background:${color};color:${textOnColor(color)}">${catLabel(b)}</span><h2 style="margin:6px 0 0;font-size:26px;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)">${b.name}</h2><p style="margin:6px 0 0;opacity:.9">${b.description||''}</p><p style="margin:4px 0 0;font-size:13px;opacity:.8">📍 ${_fullAddr||''} • ${b.zona} ${b.instagram?' • @'+b.instagram.replace('@',''):''}</p><p style="margin:4px 0 0;font-size:13px">${hor.cerrado?'❌ Hoy cerrado - '+hor.motivo:'🕐 Hoy '+hor.inicio+' a '+hor.fin}</p></div></div></div>
  <div style="padding:0 14px">
  ${_last?`<div style="background:#f0fdf4;border:2px solid #22c55e;border-radius:18px;padding:16px;margin:12px 0"><h3 style="margin:0 0 6px;color:#166534">${_last.sena?'⏳ Turno guardado, esperando seña. Notificá por WhatsApp para confirmar.':'✅ Turno guardado. Notificá por WhatsApp para confirmar.'}</h3><p style="margin:0;color:#166534;font-size:14px">Guardá este resumen: <b>${_last.service} - $${_last.price}</b> el <b>${fmtDMY(_last.date)} a las ${_last.time}</b>${_last.staff?` con ${_last.staff}`:''} en <b>${b.name}</b>.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="g" style="flex:1" onclick="addToCalendar()">📅 Agregar a calendario</button><button class="w" style="flex:1" onclick="downloadSummary()">💾 Guardar resumen</button></div><button class="w" style="margin-top:10px" onclick="resetClientBooking()">Reservar otro turno →</button></div>`:''}

  ${(cfg.usesBranches && _branchesAll.length>1)?`<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px;margin:12px 0;font-size:13px"><b>📍 Direcciones de sucursales:</b><br>${_branchesAll.map(br=>`<div style="margin-top:4px">• <b>${br.name}</b>: ${br.address||''}${br.barrio?' ('+br.barrio+')':''}</div>`).join('')}</div>`:``}

  <div class="progress"><div class="${_wiz>=1?'on':''}"></div><div class="${_wiz>=2?'on':''}"></div><div class="${_wiz>=3?'on':''}"></div><div class="${_wiz>=4?'on':''}"></div></div>
  ${_resumen.length?`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px"><b>Tu elección:</b> ${_resumen.join(' • ')}</div>`:''}

  ${(cfg.usesBranches && _branchesAll.length>1)?`<div class="card" style="background:#eff6ff;border-color:#bfdbfe"><h3>0. Elegí la sucursal</h3><p style="font-size:12px;color:#4b5563;margin:0 0 8px">Primero elegí en qué sucursal querés atenderte.</p><div style="display:flex;gap:8px;flex-wrap:wrap">${_branchesAll.map((br,i)=>`<button type="button" class="${(CLI_BRANCH_OK && SEL_BRANCH_IDX===i)?'g':'w'}" onclick="SEL_BRANCH_IDX=${i};CLI_BRANCH_OK=true;SEL_SERVICE=null;SEL_SERVICE_IDX=-1;SEL_STAFF=null;SEL_TIME=null;renderClient('${b.slug}')">📍 ${br.name}${br.address?' - '+br.address:''}</button>`).join('')}</div></div>`:``}

  <div class="card"><h3>1. Elegí el servicio</h3>${b.services.map((s,i)=>`<div class="service-card ${SEL_SERVICE&&SEL_SERVICE.name===s.name?'sel':''}" onclick="SEL_SERVICE_IDX=${i};SEL_SERVICE=CUR.services[${i}];SEL_TIME=null;renderClient('${b.slug}')"><div class="service-icon" style="background:${color}22;color:${color}">${c.emoji}</div><div style="flex:1"><b>${s.name}</b><br><span style="font-size:12px;color:#6b7280">${s.description||''}</span><br><span style="font-size:12px;color:#6b7280">${s.duration||40} min</span></div><div style="text-align:right"><b style="font-size:17px">$${s.price}</b></div></div>`).join('')}</div>

  <div class="card"><h3>2. Elegí ${staffLabel}</h3><p style="font-size:12px;color:#4b5563;margin:0 0 8px">Es obligatorio elegir un ${staffLabel} para reservar.</p>${_staffForBranch.length?`<div style="display:flex;gap:12px;flex-wrap:wrap">${_staffForBranch.map(s=>`<div style="text-align:center;cursor:pointer;padding:8px;border-radius:14px;border:2px solid ${SEL_STAFF===s.name?color:'#eee'};background:${SEL_STAFF===s.name?color+'15':'#fff'}" onclick="SEL_STAFF='${s.name.replace(/'/g,"")}';SEL_TIME=null;renderClient('${b.slug}')">${s.photo_url?`<img src="${s.photo_url}" class="staff-avatar">`:`<div class="staff-avatar" style="background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto">${(s.name||'?')[0]}</div>`}<div style="font-size:13px;font-weight:700;margin-top:6px">${s.name}</div><div style="font-size:11px;color:#6b7280">${s.specialty||''}</div></div>`).join('')}</div>`:`<p style="color:#6b7280;font-size:13px">Sin ${c.staffPlural} cargados en este momento.</p>`}</div>

  <div class="card"><h3>3. Elegí día y hora</h3>${!SEL_SERVICE?`<p style="color:#6b7280;font-size:13px">Primero elegí un servicio arriba.</p>`:`
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">${(()=>{ const _days=[]; let _d=new Date(); const _durS=(SEL_SERVICE&&SEL_SERVICE.duration)||40; while(_days.length<14){ const _ds=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0'); const _h=horarioParaFecha(b,_ds); if(!_h.cerrado && hasFreeSlotFor(_ds,_durS)){ const _lbl=_d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}); const _sel=(SEL_DATE===_ds); _days.push('<button type="button" class="'+_sel+'" style="white-space:nowrap;padding:8px 12px;border-radius:12px;border:1px solid '+(_sel?color:'#e5e7eb')+';background:'+(_sel?color:'#fff')+';color:'+(_sel?textOnColor(color):'#111827')+';font-weight:700" onclick="SEL_DATE=\''+_ds+'\';SEL_TIME=null;renderClient(\''+b.slug+'\')">'+_lbl+'</button>'); } _d.setDate(_d.getDate()+1); } if(!_days.length) return '<span style="font-size:13px;color:#6b7280">No hay días disponibles en las próximas 2 semanas.</span>'; return _days.join(''); })()}</div>
    <input type="date" id="cDate" min="${todayStr()}" value="${SEL_DATE}" onchange="SEL_DATE=this.value;SEL_TIME=null;renderClient('${b.slug}')" style="margin-top:8px">
    ${hor.cerrado?`<p style="color:#ef4444;font-weight:700;margin-top:10px">❌ Cerrado (${hor.motivo}) - Elegí otro día</p>`:`<div style="margin-top:10px">${slots.length?slots.map(t=>{ const occ=isOccupied(t); return `<span class="slot ${occ?'off':SEL_TIME===t?'sel':''}" ${occ?'':'onclick="SEL_TIME=\''+t+'\';renderClient(\''+b.slug+'\')"'}>${t}${occ?' (Ocupado)':''}</span>`; }).join(''):'<span style="color:#6b7280;font-size:13px">No hay horarios disponibles este día.</span>'}</div>`}
  `}

  ${(SEL_SERVICE && SEL_STAFF && SEL_TIME && !hor.cerrado)?`
  <div class="card card-confirm">
    <h3>4. Tus datos y resumen</h3>
    <p style="font-size:13px;color:#4b5563;margin:4px 0 10px"><b>Resumen:</b> ${SEL_SERVICE.name} ($${SEL_SERVICE.price}) • ${SEL_STAFF} • ${fmtLargo(SEL_DATE)} a las ${SEL_TIME}${cfg.usesBranches && _branchesAll.length>1 ? ' • '+branchOf(b).name : ''}${_fullBranchAddr ? ' • '+_fullBranchAddr : ''}.</p>
    <input id="cName" placeholder="Tu nombre">
    <input id="cWa" autocomplete="tel" placeholder="Tu WhatsApp (10 dígitos, ej: 11 1234 5678)" oninput="waHint(this.value,'waHintClient')">
    ${_extraLabel ? `<label>${escHtml(_extraLabel)}</label><input id="cExtra" placeholder="${escHtml(_extraLabel)}">` : ``}
    <div id="waHintClient" style="font-size:13px;margin:4px 0"></div>
    ${senaOf(b).on ? `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;margin:8px 0;font-size:13px"><b>💰 Seña: $${senaOf(b).monto||'a consultar'}</b>${senaOf(b).alias?' • Alias: <b>'+senaOf(b).alias+'</b>':''}<br><span style="color:#92400e">Queda 15 min en Esperando seña. Mandá el comprobante por WhatsApp para confirmar.</span></div>` : ``}
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px;margin:8px 0;font-size:13px;color:#14532d">📲 Al confirmar, se guarda tu turno y se abre WhatsApp para que notifiques al negocio y te lo confirme.</div>
    <button class="g" style="width:100%;margin-top:8px" onclick="confirmBooking('${b.slug}')">Confirmar y notificar por WhatsApp →</button>
  </div>`:''}

  <div class="card"><h3>📅 Mis turnos</h3><p style="font-size:13px;color:#6b7280;margin:0 0 8px">Ingresá tu WhatsApp para ver o cancelar tus turnos.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="myWa" placeholder="Tu WhatsApp (10 dígitos)" style="flex:1;min-width:180px;margin:0"><button class="b" onclick="loadMyBookings('${b.slug}')">Buscar mis turnos</button></div><div id="myBookingsList" style="margin-top:10px"></div></div>

  <div style="text-align:center;margin-top:16px"><button class="w" onclick="contactarTurnoYaNegocio('${b.slug}')">💬 WhatsApp de ayuda</button></div>
  </div></div>`;
}

async function confirmBooking(slug){
  const b=BUSINESSES.find(x=>x.slug===slug); if(!b) return;
  if(isBizPaused(b)) return alert('Este negocio está pausado.');
  const cfg=tyCfgOf(b);
  const _branchesAll=branchesOf(b);
  if(cfg.usesBranches && _branchesAll.length>1 && !CLI_BRANCH_OK) return alert('Elegí primero la sucursal.');
  if(!SEL_SERVICE) return alert('Elegí un servicio.');
  if(!SEL_STAFF) return alert('Es obligatorio elegir un profesional.');
  if(!SEL_TIME) return alert('Elegí un horario.');
  const nameEl=document.getElementById('cName');
  const waEl=document.getElementById('cWa');
  const extraEl=document.getElementById('cExtra');
  const clientName=(nameEl?nameEl.value:'').trim();
  if(!clientName) return alert('Poné tu nombre.');
  const waR=normalizeWA(waEl?waEl.value.trim():'');
  if(!waR.ok) return alert('Poné tu WhatsApp con 10 dígitos, ej: 11 1234 5678.');
  const extraVal = extraEl ? extraEl.value.trim() : '';
  const extraLabel = (cfg.datoExtra||'').trim();

  const _brFija=branchForStaff(b, SEL_STAFF);
  const _brObj = _brFija ? (_branchesAll.find(x=>x.name===_brFija)||branchOf(b)) : branchOf(b);
  const _multiBr = cfg.usesBranches && _branchesAll.length>1;
  const _branchName = _multiBr ? _brObj.name : (_branchesAll[0]?.name||'Sucursal principal');
  const sena=senaOf(b);
  const statusVal = sena.on ? 'esperando_seña' : 'confirmado';

  const payload = {
    p_business_slug: b.slug,
    p_service: SEL_SERVICE.name,
    p_price: SEL_SERVICE.price || 0,
    p_duration: SEL_SERVICE.duration || 40,
    p_date: SEL_DATE,
    p_time: SEL_TIME,
    p_staff_name: SEL_STAFF,
    p_branch_name: _branchName,
    p_client_name: clientName,
    p_client_whatsapp: waR.normalized,
    p_status: statusVal,
    p_extra_info: extraVal ? (extraLabel ? extraLabel+': '+extraVal : extraVal) : null
  };

  let res = await rpcCreateBooking(payload);
  if(!res || res.ok===false){
    // Reintentar sin p_extra_info si la RPC antigua no tiene ese parámetro
    const fallbackPayload = {...payload};
    delete fallbackPayload.p_extra_info;
    res = await rpcCreateBooking(fallbackPayload);
    if(!res || res.ok===false) return alert('No se pudo guardar el turno: '+(res?.error||'horario ocupado'));
  }

  window._LAST_BOOKING = {
    slug: b.slug,
    service: SEL_SERVICE.name,
    price: SEL_SERVICE.price || 0,
    date: SEL_DATE,
    time: SEL_TIME,
    staff: SEL_STAFF,
    sena: sena.on
  };

  const targetWa = waForBranch(b, _brObj) || b.owner_whatsapp || '';
  const msg = friendlyBookingMsg(b, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, clientName, _branchName, _multiBr, extraVal, extraLabel);
  renderClient(slug);
  if(targetWa){
    window.open('https://wa.me/'+waLinkNumber(targetWa)+'?text='+encodeURIComponent(msg), '_blank');
  }
}

function resetClientBooking(){ window._LAST_BOOKING=null; SEL_TIME=null; if(CUR) renderClient(CUR.slug); }
function addToCalendar(){ const l=window._LAST_BOOKING; if(!l||!CUR) return; const dtStart=l.date.replace(/-/g,'')+'T'+l.time.replace(':','')+'00'; const ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','DTSTART:'+dtStart,'SUMMARY:'+l.service+' - '+CUR.name,'DESCRIPTION:Turno en '+CUR.name+(l.staff?' con '+l.staff:''),'END:VEVENT','END:VCALENDAR'].join('\r\n'); const blob=new Blob([ics],{type:'text/calendar'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='turno-'+CUR.slug+'.ics'; a.click(); }
function downloadSummary(){ const l=window._LAST_BOOKING; if(!l||!CUR) return; const txt='TurnoYa\nNegocio: '+CUR.name+'\nServicio: '+l.service+' ($'+l.price+')\nFecha: '+fmtDMY(l.date)+'\nHora: '+l.time+(l.staff?'\nProfesional: '+l.staff:''); const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='resumen-turno.txt'; a.click(); }

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

render();
</script></body></html>
