:root{
  --bg:#0a0f0c;
  --surface:#121913;
  --surface2:#18231b;
  --line:#2b3a2d;
  --text:#f2f6f0;
  --muted:#aab8ab;
  --green:#22c55e;
  --green-dark:#15803d;
  --red:#f87171;
  --yellow:#facc15;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif
}

button,input,textarea,select{
  font:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 28px;
  max-width:1280px;
  margin:0 auto
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0 24px;
  border-bottom:1px solid var(--line)
}

.brand{
  display:flex;
  align-items:center;
  gap:11px
}

.brand strong{
  display:block;
  font-size:21px;
  line-height:1
}

.brand span{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase
}

.mark{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--green);
  color:#06130a;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:24px
}

.local-badge{
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 11px;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:7px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 0 5px rgba(250,204,21,.12)
}

.hero{
  padding:38px 0 30px;
  max-width:980px
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--green);
  font-weight:700;
  font-size:12px;
  letter-spacing:.16em
}

.hero h1{
  font-size:clamp(38px,6vw,68px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:16px 0
}

.lede{
  font-size:18px;
  line-height:1.55;
  color:#ccd8cd;
  max-width:860px
}

.lede b{
  color:white
}

.status{
  margin-top:24px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  gap:12px;
  align-items:center;
  background:var(--surface);
  max-width:720px
}

.status small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.14em
}

.status.ok{
  border-color:#286c42
}

.status.error{
  border-color:#6f3131
}

.status-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--yellow);
  flex:none
}

.status.ok .status-dot{
  background:var(--green)
}

.status.error .status-dot{
  background:var(--red)
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);
  gap:18px;
  align-items:start
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px
}

.section-head>div{
  display:flex;
  align-items:center;
  gap:10px
}

.section-head span{
  color:var(--green);
  font-family:"JetBrains Mono",monospace;
  font-size:12px
}

.section-head h2{
  font-size:19px;
  margin:0
}

.session{
  font-size:11px;
  color:var(--muted);
  text-align:right
}

.config label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:18px 0 8px
}

.config label em{
  color:var(--muted);
  font-weight:400
}

.field{
  display:flex;
  align-items:center;
  gap:9px;
  background:#0a0f0c;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 12px
}

.field input{
  border:0;
  background:transparent;
  color:white;
  outline:0;
  width:100%;
  padding:14px 0
}

.field svg{
  color:var(--muted)
}

input,textarea,select{
  width:100%;
  background:#0a0f0c;
  border:1px solid var(--line);
  border-radius:11px;
  color:white;
  padding:13px 12px;
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(34,197,94,.15)
}

textarea{
  resize:vertical;
  line-height:1.5
}

.warning{
  display:flex;
  gap:9px;
  background:rgba(250,204,21,.09);
  border:1px solid rgba(250,204,21,.25);
  color:#f7e5a0;
  border-radius:10px;
  padding:11px 12px;
  font-size:13px;
  line-height:1.45;
  margin:10px 0
}

.warning svg{
  flex:none
}

.inline-error{
  color:#fca5a5;
  font-size:13px;
  margin:8px 0
}

.inline-ok{
  color:#86efac;
  font-size:13px;
  display:flex;
  gap:6px;
  align-items:center;
  margin:8px 0
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.two label{
  margin-top:16px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:22px
}

.btn{
  min-height:52px;
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer
}

.btn:active{
  transform:translateY(1px)
}

.btn.primary{
  background:white;
  color:#07130b
}

.btn.green{
  background:var(--green);
  color:#06130a
}

.btn.outline{
  background:transparent;
  border:1px solid var(--line);
  color:white
}

.btn.danger{
  background:#3d1517;
  color:#fecaca;
  border:1px solid #66262a
}

.micro{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
  margin:13px 0
}

.result-box{
  border-top:1px solid var(--line);
  margin-top:8px
}

.result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:14px
}

.result-head span{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted)
}

.text-btn{
  background:none;
  border:0;
  color:var(--green);
  font-weight:700;
  cursor:pointer
}

.result-box pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#07100a;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  line-height:1.6;
  max-height:240px;
  overflow:auto
}

.side{
  display:grid;
  gap:18px
}

.console{
  height:330px;
  overflow:auto;
  background:#07100a;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px
}

.log{
  display:grid;
  grid-template-columns:62px 1fr;
  gap:8px;
  padding:7px 0;
  border-bottom:1px solid #17221a;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  line-height:1.45
}

.log span{
  color:#778677
}

.log p{
  margin:0;
  white-space:pre-wrap;
  word-break:break-word
}

.log.ok p{
  color:#a7f3c5
}

.log.error p{
  color:#fca5a5
}

.log.warn p{
  color:#fde68a
}

.translation{
  margin-top:14px;
  background:#0a0f0c;
  border:1px solid var(--line);
  border-left:3px solid var(--green);
  border-radius:10px;
  padding:14px
}

.translation p{
  margin:8px 0 0;
  line-height:1.55;
  color:#d7e1d7
}

.businesses-panel{
  margin-top:18px
}

.count{
  font-size:12px;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 9px
}

.empty{
  display:flex;
  gap:14px;
  align-items:center;
  color:var(--muted)
}

.empty svg{
  color:var(--green)
}

.empty strong{
  color:white
}

.empty p{
  margin:4px 0 0
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:560px
}

th{
  text-align:left;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
  padding:10px;
  border-bottom:1px solid var(--line)
}

td{
  padding:13px 10px;
  border-bottom:1px solid var(--line)
}

code{
  background:#0a0f0c;
  padding:4px 7px;
  border-radius:6px;
  font-size:12px
}

.bottom-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:18px;
  margin-top:18px
}

.sql-panel textarea{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  line-height:1.65;
  min-height:250px;
  white-space:pre
}

.sql-panel p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.copy-btn{
  background:var(--green);
  border:0;
  border-radius:9px;
  color:#06130a;
  padding:9px 12px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer
}

.progress{
  height:6px;
  background:#0a0f0c;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:14px
}

.progress i{
  display:block;
  height:100%;
  background:var(--green);
  transition:width .25s
}

.checks{
  display:grid;
  gap:7px
}

.check{
  display:flex;
  gap:11px;
  align-items:flex-start;
  padding:11px;
  border-radius:11px;
  border:1px solid var(--line);
  cursor:pointer
}

.check input{
  position:absolute;
  opacity:0;
  width:1px;
  height:1px
}

.check .box{
  width:22px;
  height:22px;
  flex:none;
  border:1px solid var(--line);
  border-radius:6px;
  display:grid;
  place-items:center;
  color:#06130a;
  font-weight:900
}

.check input:checked + .box{
  background:var(--green)
}

.check strong{
  display:block;
  font-size:14px
}

.check small{
  color:var(--muted)
}

.next-step{
  display:flex;
  gap:10px;
  background:rgba(34,197,94,.08);
  border:1px solid rgba(34,197,94,.2);
  border-radius:11px;
  padding:13px;
  margin-top:15px
}

.next-step svg{
  color:var(--green);
  flex:none
}

.next-step p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px
}

footer{
  padding:24px 0 8px;
  color:#718075;
  font-size:12px;
  text-align:center
}

@media (max-width: 760px){
  .shell{
    padding-left:14px;
    padding-right:14px
  }

  .topbar{
    align-items:flex-start
  }

  .local-badge{
    max-width:145px;
    text-align:center
  }

  .layout,.bottom-grid{
    grid-template-columns:1fr
  }

  .hero{
    padding-top:28px
  }

  .actions{
    grid-template-columns:1fr
  }

  .two{
    grid-template-columns:1fr
  }

  .console{
    height:300px
  }

  .section-head{
    align-items:flex-start
  }

  .session{
    max-width:130px
  }

  table{
    min-width:480px
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0f0c;
    --surface:#121913;
    --text:#f2f6f0
  }
}
