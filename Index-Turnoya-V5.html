<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurnoYa PRO - Reservá tu turno</title>
<style>
*{box-sizing:border-box} body{font-family:Inter,system-ui,sans-serif;background:#09090b;color:#fff;margin:0}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #27272a;background:#18181b;color:#fff;margin:6px 0;font-size:15px}
button{padding:12px 16px;border:0;border-radius:999px;font-weight:800;cursor:pointer}
.g{background:#22c55e;color:#000}.b{background:#3b82f6;color:#fff}.w{background:#fff;color:#000}.r{background:#ef4444;color:#fff}.y{background:#facc15;color:#000}
.card{background:#18181b;border:1px solid #27272a;padding:16px;border-radius:18px;margin:12px 0}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}.badge-ok{background:#14532d}.badge-no{background:#7f1d1d}
pre{background:#000;border:1px solid #333;padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:140px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:640px){.grid{grid-template-columns:1fr}}
.slot{display:inline-block;padding:10px 14px;border-radius:999px;border:1px solid #333;margin:4px;cursor:pointer;background:#18181b;font-weight:700}
.slot.sel{background:#22c55e;color:#000;border-color:#22c55e}.slot.off{background:#27272a;color:#52525b;text-decoration:line-through;cursor:not-allowed}
.light{background:#fafaf9;color:#111} .light .card{background:#fff;border-color:#e7e5e4;color:#111;box-shadow:0 4px 20px rgba(0,0,0,.06)} .light input,.light textarea,.light select{background:#fff;color:#111;border-color:#e7e5e4} .light .slot{background:#fff;color:#111;border-color:#e7e5e4}
.upload{border:2px dashed #52525b;border-radius:18px;padding:16px;text-align:center;cursor:pointer;background:#111}
.upload img{width:96px;height:96px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 10px;border:3px solid #22c55e}
.upload-banner img{width:100%;height:140px;object-fit:cover;border-radius:14px}
.tabbar{display:flex;gap:8px;overflow:auto;padding:8px 0}.tabbar button{white-space:nowrap;background:#27272a;color:#fff}.tabbar button.active{background:#22c55e;color:#000}
.topbar{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.9);backdrop-filter:blur(10px);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #27272a}
.hero{border-radius:22px;overflow:hidden;position:relative}.hero-img{width:100%;height:220px;object-fit:cover}.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1))}.hero-content{position:absolute;bottom:0;left:0;right:0;padding:18px;display:flex;gap:14px;align-items:flex-end}
.service-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:#fff;border:1px solid #eee;cursor:pointer;margin:8px 0}.service-card.sel{border:2px solid #22c55e;box-shadow:0 8px 24px rgba(34,197,94,.2)}
.service-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.staff-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.progress{display:flex;gap:6px;margin:12px 0}.progress div{flex:1;height:6px;border-radius:999px;background:#e7e5e4}.progress div.on{background:#22c55e}
.msgbox{background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;color:#14532d;font-size:14px;white-space:pre-wrap}
.biz-card{background:#fff;border:1px solid #eee;border-radius:20px;overflow:hidden;cursor:pointer;color:#111}
.biz-card img.cover{width:100%;height:140px;object-fit:cover}
.cta-owner{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;border-radius:20px;padding:20px;text-align:center}
</style></head><body><div id="app"></div>
<script>
// ========== CONFIG - REEMPLAZA UNA VEZ ANTES DE SUBIR ==========
const DEFAULT_SUPABASE_URL = "https://jzidnpygsygbujbwqain.supabase.co";
const DEFAULT_SUPABASE_KEY = "sb_publishable_8EBmBDoZej2x6ulbtZNM1A_vG1pcPKe";
const MASTER_PIN = "2406";
// 👇 TU WHATSAPP REAL PARA QUE TE CONTACTEN LAS BARBERIAS
// Pone tu numero con 549 adelante, sin + ni espacios. Ej: "5491123456789"
const MI_WSP = "5491134890644";
// Mensaje que te llega cuando una barberia te quiere contactar
const MSG_CONTACTO_BARBERIA = "👋 ¡Hola Brian! Soy dueño de una barbería 💈 y quiero tener mi página de turnos en TurnoYa. ¿Me contás cómo funciona? 🙏";
// ==============================================================
const $=s=>document.querySelector(s);
let CFG={url:localStorage.getItem('supabase_url')||DEFAULT_SUPABASE_URL, key:localStorage.getItem('supabase_anon')||DEFAULT_SUPABASE_KEY};
if(CFG.url.includes('TU_PROYECTO')) CFG.url=''; if(CFG.key.includes('TU_CLAVE')) CFG.key='';
let BUSINESSES=[]; let CUR=null; let SEL_SERVICE=null; let SEL_STAFF=null; let SEL_DATE=new Date().toISOString().slice(0,10); let SEL_TIME=null; let TAB='marca';
let TMP_LOGO=''; let TMP_BANNER=''; let TMP_STAFF_PHOTO='';
function log(m){ const e=$('#log'); if(e) e.textContent=new Date().toLocaleTimeString()+' - '+m+'\n'+e.textContent; }
function slugify(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function saveCfg(){ CFG.url=$('#cfgUrl').value.trim(); CFG.key=$('#cfgKey').value.trim(); localStorage.setItem('supabase_url',CFG.url); localStorage.setItem('supabase_anon',CFG.key); log('Config guardada'); render(); }
function api(path, opts={}){ const base=CFG.url.replace(/\/$/,''); return fetch(base+'/rest/v1/'+path,{...opts, headers:{apikey:CFG.key, Authorization:'Bearer '+CFG.key, 'Content-Type':'application/json', Prefer:'return=representation', ...(opts.headers||{})}}); }
function handleFile(input, kind){ const f=input.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f); img.onload=()=>{ const max= kind==='banner'?900:400; const scale=Math.min(1, max/Math.max(img.width, img.height)); const w=Math.round(img.width*scale); const h=Math.round(img.height*scale); const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); const data=c.toDataURL('image/jpeg',0.72); if(kind==='logo'){ TMP_LOGO=data; const el=$('#previewLogo'); if(el) el.src=data; } if(kind==='banner'){ TMP_BANNER=data; const el=$('#previewBanner'); if(el) el.src=data; } if(kind==='staff'){ TMP_STAFF_PHOTO=data; const el=$('#previewStaff'); if(el) el.src=data; } log('Foto lista: '+(Math.round(data.length/1024))+' KB'); URL.revokeObjectURL(url); }; img.src=url; }
function buildServicesPayload(business, extra={}){ let meta={}; let list=business.services||[]; if(business._meta) meta={...business._meta}; if(business.color) meta.color=business.color; if(business.logo_url) meta.logo_url=business.logo_url; if(business.banner_url) meta.banner_url=business.banner_url; if(business.description!==undefined) meta.description=business.description; if(business.instagram!==undefined) meta.instagram=business.instagram; if(business.address!==undefined) meta.address=business.address; if(business.phone!==undefined) meta.phone=business.phone; if(business.horario_inicio) meta.horario_inicio=business.horario_inicio; if(business.horario_fin) meta.horario_fin=business.horario_fin; if(business.staff) meta.staff=business.staff; if(business.fotos) meta.fotos=business.fotos; if(business.admin_pin!==undefined) meta.admin_pin=business.admin_pin; Object.assign(meta, extra.meta||{}); if(extra.list) list=extra.list; if(extra.meta && extra.meta.staff) meta.staff=extra.meta.staff; return {meta, list}; }
async function saveBusinessOnlyServices(payload){ const r=await api('businesses',{method:'POST', body:JSON.stringify(payload)}); const txt=await r.text(); if(r.ok) return {ok:true}; let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} if((j.message||'').includes('duplicate key')){ const r2=await api('businesses?slug=eq.'+encodeURIComponent(payload.slug),{method:'PATCH', body:JSON.stringify(payload)}); const t2=await r2.text(); if(r2.ok) return {ok:true}; else return {ok:false, error:t2}; } return {ok:false, error:txt}; }
async function updateBusinessOnlyServices(slug, patchBusiness){ const cur=BUSINESSES.find(b=>b.slug===slug) || CUR; let merged={...(cur||{}), ...patchBusiness}; if(patchBusiness.services) merged.services=patchBusiness.services; if(patchBusiness.staff) merged.staff=patchBusiness.staff; const services=buildServicesPayload(merged, {meta: patchBusiness._meta||{}, list: patchBusiness.services}); let body={services}; if(patchBusiness.name) body.name=patchBusiness.name; if(patchBusiness.owner_whatsapp) body.owner_whatsapp=patchBusiness.owner_whatsapp; const r=await api('businesses?slug=eq.'+encodeURIComponent(slug),{method:'PATCH', body:JSON.stringify(body)}); const txt=await r.text(); if(r.ok) return {ok:true}; return {ok:false, error:txt}; }
function normalizeBusiness(raw){ let meta={}; let list=[]; if(raw.services && typeof raw.services==='object' && raw.services.meta){ meta=raw.services.meta; list=raw.services.list||[]; } else if(Array.isArray(raw.services)) list=raw.services; const get=(k, fallback='')=> (meta[k]!==undefined && meta[k]!==null && meta[k]!=='') ? meta[k] : (raw[k]!==undefined && raw[k]!==null && raw[k]!=='' ? raw[k] : fallback); return {...raw, color:get('color','#22c55e'), logo_url:get('logo_url',''), banner_url:get('banner_url',''), fotos:get('fotos',[]), staff:get('staff',[]), description:get('description',''), instagram:get('instagram',''), address:get('address',''), phone:get('phone',''), admin_pin:get('admin_pin','1234'), horario_inicio:get('horario_inicio','09:00'), horario_fin:get('horario_fin','20:00'), services:list, _meta:meta}; }
async function loadBusinesses(){ if(!CFG.url||!CFG.key) return []; try{ const r=await api('businesses?select=*&order=id.desc&limit=100'); const txt=await r.text(); if(!r.ok){ log('Error cargando: '+txt); return []; } const arr=JSON.parse(txt); BUSINESSES=arr.map(normalizeBusiness); return BUSINESSES; }catch(e){ log('Error red: '+e.message); return []; } }
function getSlugFromUrl(){ const u=new URLSearchParams(location.search); if(u.get('b')) return {type:'client', slug:u.get('b')}; if(u.get('admin')) return {type:'admin', slug:u.get('admin')}; if(u.get('panel')!==null) return {type:'owner', slug:null}; const p=location.pathname.replace(/^\/+/,'').split('/'); if(p[0]==='b'&&p[1]) return {type:'client', slug:p[1]}; if(p[0]==='admin'&&p[1]) return {type:'admin', slug:p[1]}; return {type:'landing', slug:null}; }
async function render(){ const route=getSlugFromUrl(); if(route.type==='client') return renderClient(route.slug); if(route.type==='admin') return renderAdminGate(route.slug); if(route.type==='owner') return renderOwnerGate(); renderLanding(); }
function contactarTurnoYa(){ window.open('https://wa.me/'+MI_WSP+'?text='+encodeURIComponent(MSG_CONTACTO_BARBERIA),'_blank'); }

async function renderLanding(){
  document.body.className='light';
  $('#app').innerHTML=`<div style="max-width:720px;margin:0 auto;padding:0 0 30px">
  <div style="background:#111;color:#fff;padding:24px 18px 28px;text-align:center;border-radius:0 0 28px 28px"><div style="font-size:36px">✂️</div><h1 style="margin:8px 0 4px;font-size:32px;line-height:1">TurnoYa</h1><p style="margin:0;opacity:.8">Reservá tu turno en segundos, sin llamar, sin esperar.</p><div style="margin-top:16px"><input id="searchBiz" placeholder="🔍 Buscar barbería, peluquería..." style="background:#27272a;border-color:#333;color:#fff;max-width:420px" oninput="filterLanding()"></div></div>
  <div style="padding:14px"><h3 style="margin:6px 0">💈 Negocios cerca tuyo</h3><p style="color:#777;font-size:13px;margin:0 0 12px">Tocá uno para ver servicios y reservar.</p><div id="landingList"><p style="color:#777">Cargando negocios...</p></div>
  <div class="cta-owner" style="margin-top:22px"><div style="font-size:28px">💈</div><h2 style="margin:6px 0">¿Tenés una barbería?</h2><p style="margin:0;opacity:.9">Tené tu propia página de turnos como esta, con tu logo, tus servicios y tus barberos. Tus clientes reservan solos y a vos te llega todo por WhatsApp.</p><p style="margin:10px 0 0;font-weight:800">✅ Sin app • ✅ Sin complicaciones • ✅ En 1 día</p><button class="w" style="margin-top:14px;padding:14px 22px;font-size:16px" onclick="contactarTurnoYa()">💬 Quiero mi página - Hablar con TurnoYa</button><br><button style="background:none;color:#000;text-decoration:underline;padding:8px" onclick="location.href='?panel'">Ya soy dueño, entrar a mi panel →</button></div>
  <div class="card" style="text-align:center"><b>¿Dudas?</b><br><span style="color:#777">Escribime directo por WhatsApp y te respondo yo.</span><br><button class="g" style="margin-top:10px" onclick="contactarTurnoYa()">💬 Contactar a TurnoYa</button></div>
  <p style="text-align:center;color:#aaa;font-size:12px;margin-top:16px">TurnoYa PRO • Lomas de Zamora • 📱 ${MI_WSP}</p></div></div>`;
  await loadBusinesses();
  renderLandingList(BUSINESSES);
}
function renderLandingList(list){
  if(!list.length){ $('#landingList').innerHTML='<div class="card">Todavía no hay negocios públicos. Volvé en un rato.</div>'; return; }
  $('#landingList').innerHTML=list.map(b=>`
  <div class="biz-card" onclick="location.href='?b=${b.slug}'">
    ${b.banner_url?`<img class="cover" src="${b.banner_url}">`:`<div style="height:120px;background:linear-gradient(135deg,${b.color},#111)"></div>`}
    <div style="padding:14px;display:flex;gap:12px;align-items:center">${b.logo_url?`<img src="${b.logo_url}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid ${b.color}">`:''}<div style="flex:1"><b style="font-size:17px">${b.name}</b><br><span style="color:#777;font-size:13px">${b.description||''}</span><br><span style="color:#777;font-size:12px">${b.address||''} • ${b.horario_inicio} - ${b.horario_fin}</span></div><button class="g" style="padding:10px 16px">Reservar →</button></div>
  </div>`).join('');
}
function filterLanding(){ const q=($('#searchBiz').value||'').toLowerCase(); renderLandingList(BUSINESSES.filter(b=>(b.name+' '+b.description+' '+b.address).toLowerCase().includes(q))); }

function renderOwnerGate(){
  if(sessionStorage.getItem('owner_ok')==='1') return renderOwner();
  document.body.className='';
  $('#app').innerHTML=`<div style="max-width:420px;margin:60px auto;padding:16px;text-align:center"><div style="font-size:44px">🔒</div><h2>Panel dueño</h2><p style="color:#a1a1aa">Esta zona es solo para vos. Ingresá tu PIN.</p><input id="ownerPin" type="password" inputmode="numeric" placeholder="PIN (por defecto 1234)" style="text-align:center;font-size:20px;letter-spacing:6px"><button class="g" style="width:100%" onclick="checkOwnerPin()">Entrar</button><button class="w" style="width:100%;margin-top:8px" onclick="location.href=location.pathname">← Volver a TurnoYa</button><p style="color:#777;font-size:12px">Si es la primera vez, el PIN es 1234.</p></div>`;
}
function checkOwnerPin(){ const v=$('#ownerPin').value.trim(); if(v===MASTER_PIN){ sessionStorage.setItem('owner_ok','1'); renderOwner(); } else alert('PIN incorrecto'); }
function renderOwner(){
  const has=!!(CFG.url&&CFG.key);
  document.body.className='';
  $('#app').innerHTML=`
  <div class="topbar"><b>✂️ TurnoYa PRO - Dueño</b><span class="badge ${has?'badge-ok':'badge-no'}">${has?'NUBE ACTIVA':'SIN NUBE - falta config'}</span></div>
  <div style="max-width:720px;margin:0 auto;padding:14px">
  <div class="card" style="background:#fef3c7;color:#111;border-color:#fde68a"><b>⚠️ No compartas este link.</b><br>Este panel es solo tuyo: <code>?panel</code> + PIN. El público entra a la raíz y solo ve negocios para reservar. Tu WhatsApp de contacto para barberías es: <b>${MI_WSP}</b></div>
  <div class="card"><b>1. Conectar Supabase (una vez)</b><input id="cfgUrl" placeholder="https://xxxx.supabase.co" value="${CFG.url}"><textarea id="cfgKey" rows="2" placeholder="sb_publishable_...">${CFG.key}</textarea><button class="g" onclick="saveCfg()">Guardar conexión</button><pre id="log"></pre></div>
  <div class="card"><b>2. Crear negocio</b>
  <input id="nName" placeholder="Nombre ej: Barbería Brian"><input id="nSlug" placeholder="slug ej: barberia-brian">
  <label>📱 WhatsApp del negocio (donde le llegan los turnos al dueño de esa barbería)</label><input id="nWa" placeholder="Ej: 5491123456789">
  <label>📞 Teléfono del negocio</label><input id="nPhone" placeholder="Ej: 11 2345-6789">
  <label>🔒 PIN de admin de este negocio</label><input id="nPin" placeholder="Ej: 1234" value="1234">
  <label>Color de marca</label><input id="nColor" type="color" value="#22c55e">
  <label>Logo - tocar para elegir foto</label><div class="upload" onclick="document.getElementById('nLogoFile').click()"><img id="previewLogo" src="https://via.placeholder.com/96"><span>📷 Tocar para elegir logo</span><input id="nLogoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'logo')"></div>
  <button class="g" onclick="createBusiness()" style="width:100%;margin-top:10px">Crear negocio en nube →</button></div><div id="list"></div><button class="w" onclick="location.href=location.pathname">← Volver a la landing pública</button></div>`;
  $('#nName').oninput=()=>{ $('#nSlug').value=slugify($('#nName').value); };
  TMP_LOGO=''; TMP_BANNER='';
  loadBusinesses().then(()=>{ $('#list').innerHTML='<h3>Mis negocios ('+BUSINESSES.length+')</h3>'+BUSINESSES.map(b=>`<div class="card"><div style="display:flex;gap:12px;align-items:center">${b.logo_url?`<img src="${b.logo_url}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><b>${b.name}</b><br><span style="color:#a1a1aa">${b.slug} - ${b.services.length} servicios - ${b.staff.length} barberos - PIN: ${b.admin_pin}</span></div><div style="margin-left:auto;width:14px;height:14px;border-radius:50%;background:${b.color}"></div></div><br><button class="b" onclick="copyLink('b','${b.slug}')">Copiar link cliente</button><button class="y" onclick="copyLink('admin','${b.slug}')">Copiar link negocio (con PIN)</button><button class="w" onclick="openLink('b','${b.slug}')">Ver cliente</button><button class="w" onclick="openLink('admin','${b.slug}')">Editar</button></div>`).join(''); });
}
async function createBusiness(){
  const name=$('#nName').value.trim(); const slug=($('#nSlug').value.trim()||slugify(name)); const wa=$('#nWa').value.trim(); const phone=$('#nPhone').value.trim(); const pin=$('#nPin').value.trim()||'1234'; const color=$('#nColor').value;
  if(!name||!slug) return alert('Pone nombre');
  if(!wa) return alert('⚠️ Pone el WhatsApp del negocio, si no no le llegan los turnos');
  if(!CFG.url) return alert('Guarda config primero');
  const services={meta:{color, logo_url:TMP_LOGO||'', banner_url:'', description:'', instagram:'', address:'', phone, admin_pin:pin, horario_inicio:'09:00', horario_fin:'20:00', staff:[]}, list:[{name:'Corte', price:15000, duration:40, description:'Corte clásico'}]};
  const res=await saveBusinessOnlyServices({slug, name, owner_whatsapp:wa, services});
  if(res.ok){ alert('✅ Creado! El PIN de este negocio es '+pin); renderOwner(); } else alert(res.error);
}
function copyLink(t,s){ const url=location.origin+location.pathname+'?'+t+'='+s; navigator.clipboard.writeText(url); alert('Copiado: '+url); }
function openLink(t,s){ window.open(location.pathname+'?'+t+'='+s,'_blank'); }
function friendlyBookingMsg(b, service, date, time, staff, name){ return `✂️ ¡Hola ${b.name}! 💈\n\n👋 Soy ${name} y quiero reservar:\n\n💇 Servicio: ${service.name} - $${service.price} (${service.duration||40} min)${staff?`\n💈 Barbero: ${staff}`:''}\n📅 Fecha: ${date}\n⏰ Hora: ${time}\n\n¿Me lo confirmás? 🙏✨\nGracias!`; }
function friendlyReminderMsg(b, booking){ return `👋 ¡Hola ${booking.client_name}! ✨\n\nTe recordamos tu turno en ${b.name} 💈\n\n💇 ${booking.service}${booking.staff_name?` con ${booking.staff_name}`:''}\n📅 ${booking.date}\n⏰ ${booking.time}\n📍 ${b.address||''}\n\n¿Nos confirmás que venís? 🙏\nRespondé SI o NO\n\n¡Te esperamos! 😎✂️`; }
function testWsp(){ const wa=CUR.owner_whatsapp; if(!wa) return alert('Primero guardá el WhatsApp del negocio en Marca'); const msg=`👋 ¡Hola! Soy el dueño de ${CUR.name} 💈\n\nEsto es una prueba de WhatsApp ✅\nSi te llegó, ya anda el sistema de turnos.\n\n✂️ TurnoYa PRO`; window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank'); }
async function renderAdminGate(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ $('#app').innerHTML='<h2>No existe '+slug+'</h2><button onclick="location.href=location.pathname">Volver</button>'; return; }
  if(sessionStorage.getItem('admin_ok_'+slug)==='1') return renderAdmin(slug);
  document.body.className='';
  $('#app').innerHTML=`<div style="max-width:420px;margin:60px auto;padding:16px;text-align:center"><div style="font-size:44px">🔒</div><h2>Admin - ${b.name}</h2><p style="color:#a1a1aa">Ingresá el PIN de este negocio para editarlo.</p><input id="adminPin" type="password" inputmode="numeric" placeholder="PIN" style="text-align:center;font-size:20px;letter-spacing:6px"><button class="g" style="width:100%" onclick="checkAdminPin('${slug}')">Entrar a admin</button><button class="w" style="width:100%;margin-top:8px" onclick="location.href='?b=${slug}'">← Ver como cliente</button><p style="color:#777;font-size:12px">Si no te dieron PIN, pedíselo al dueño. Por defecto es 1234.</p></div>`;
}
function checkAdminPin(slug){ const b=BUSINESSES.find(x=>x.slug===slug); const v=$('#adminPin').value.trim(); if(v===(b.admin_pin||'1234')){ sessionStorage.setItem('admin_ok_'+slug,'1'); renderAdmin(slug); } else alert('PIN incorrecto'); }
async function renderAdmin(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ $('#app').innerHTML='<h2>No existe '+slug+'</h2><button onclick="location.href=location.pathname">Volver</button>'; return; }
  CUR=b; TMP_LOGO=b.logo_url; TMP_BANNER=b.banner_url; TMP_STAFF_PHOTO='';
  document.body.className='';
  $('#app').innerHTML=`
  <div class="topbar"><b>⚙️ Admin - ${b.name}</b><button class="w" style="padding:8px 12px" onclick="openLink('b','${b.slug}')">Ver como cliente ↗</button></div>
  <div style="max-width:720px;margin:0 auto;padding:14px">
  <div class="card" style="background:${b.color};border:none;color:#000"><div style="display:flex;gap:12px;align-items:center">${b.logo_url?`<img src="${b.logo_url}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff">`:''}<div><h2 style="margin:0">${b.name}</h2><p style="margin:4px 0;opacity:.8">📱 WhatsApp: ${b.owner_whatsapp||'SIN CARGAR ⚠️'} • 📞 Tel: ${b.phone||'sin tel'}</p><p style="margin:0;opacity:.8">Link cliente: ${location.origin}${location.pathname}?b=${b.slug}</p></div></div><button class="w" onclick="copyLink('b','${b.slug}')">📋 Copiar link cliente</button><button class="w" onclick="copyLink('admin','${b.slug}')">📋 Copiar link negocio</button> <button class="w" onclick="testWsp()">💬 Probar WhatsApp</button></div>
  <div class="tabbar"><button class="${TAB==='marca'?'active':''}" onclick="setTab('marca')">🎨 Marca</button><button class="${TAB==='servicios'?'active':''}" onclick="setTab('servicios')">✂️ Servicios</button><button class="${TAB==='equipo'?'active':''}" onclick="setTab('equipo')">💈 Equipo</button><button class="${TAB==='agenda'?'active':''}" onclick="setTab('agenda')">📅 Agenda</button></div>
  <div id="tabContent"></div><pre id="log"></pre></div>`;
  renderTab();
}
function setTab(t){ TAB=t; renderAdmin(CUR.slug); }
function renderTab(){
  const b=CUR;
  if(TAB==='marca'){
    $('#tabContent').innerHTML=`
    <div class="card"><h3>🎨 Marca y fotos</h3>
    <label>Color de marca</label><input id="eColor" type="color" value="${b.color}"><div style="display:flex;gap:8px;align-items:center"><div style="width:36px;height:36px;border-radius:50%;background:${b.color}"></div><span>${b.color}</span></div>
    <label>Logo - tocar para cambiar</label><div class="upload" onclick="document.getElementById('eLogoFile').click()"><img id="previewLogo" src="${b.logo_url||'https://via.placeholder.com/96'}"><span>📷 Tocar para elegir logo nuevo</span><input id="eLogoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'logo')"></div>
    <label>Banner - foto grande de arriba</label><div class="upload upload-banner" onclick="document.getElementById('eBannerFile').click()"><img id="previewBanner" src="${b.banner_url||'https://via.placeholder.com/900x200'}"><span>📷 Tocar para elegir banner nuevo</span><input id="eBannerFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'banner')"></div>
    <label>Descripción</label><textarea id="eDesc" placeholder="Ej: Cortes clásicos, navaja, ambiente copado">${b.description}</textarea><label>Instagram</label><input id="eIg" placeholder="@tuinstagram" value="${b.instagram}"><label>Dirección</label><input id="eAddr" value="${b.address}">
    <label>📱 WhatsApp del negocio - con 549</label><input id="eWa" placeholder="5491123456789" value="${b.owner_whatsapp}">
    <label>📞 Teléfono que ve el cliente</label><input id="ePhone" placeholder="11 2345-6789" value="${b.phone}">
    <label>🔒 PIN de admin de este negocio</label><input id="ePin" placeholder="1234" value="${b.admin_pin}">
    <label>Horario</label><div class="grid"><input id="eHi" type="time" value="${b.horario_inicio}"><input id="eHf" type="time" value="${b.horario_fin}"></div>
    <button class="g" style="width:100%" onclick="saveMarca()">💾 Guardar marca</button>
    <button class="b" style="width:100%;margin-top:8px" onclick="testWsp()">💬 Probar WhatsApp</button></div>`;
  }
  if(TAB==='servicios'){
    $('#tabContent').innerHTML=`<div class="card"><h3>✂️ Servicios (${b.services.length})</h3><div id="svcList"></div><input id="sName" placeholder="Ej: Corte + Barba"><input id="sPrice" type="number" placeholder="Precio ej: 15000"><select id="sDur"><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="40" selected>40 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="90">90 min</option></select><input id="sDesc" placeholder="Descripción"><button class="g" style="width:100%" onclick="addService()">+ Agregar servicio</button></div>`;
    renderSvcList();
  }
  if(TAB==='equipo'){
    $('#tabContent').innerHTML=`<div class="card"><h3>💈 Equipo (${b.staff.length} barberos)</h3><p style="color:#a1a1aa">Si no agregás a nadie, el cliente reserva sin elegir barbero.</p><div id="staffList"></div><input id="stName" placeholder="Nombre ej: Brian"><input id="stSpec" placeholder="Especialidad ej: Degradados"><div class="upload" onclick="document.getElementById('stPhotoFile').click()"><img id="previewStaff" src="https://via.placeholder.com/96"><span>📷 Foto del barbero</span><input id="stPhotoFile" type="file" accept="image/*" style="display:none" onchange="handleFile(this,'staff')"></div><button class="g" style="width:100%" onclick="addStaff()">+ Agregar barbero</button></div>`;
    renderStaffList();
  }
  if(TAB==='agenda'){
    $('#tabContent').innerHTML=`<div class="card"><h3>📅 Agenda - Turnos asignados</h3><p style="color:#a1a1aa">Acá quedan guardados los turnos que reservan los clientes.</p><input id="agDate" type="date" value="${SEL_DATE}"><button class="b" onclick="loadAgenda()">Ver agenda</button><div id="agList"></div></div>`;
    loadAgenda();
  }
}
function renderSvcList(){ $('#svcList').innerHTML=CUR.services.map((s,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>${s.name}</b><br>$${s.price} - ${s.duration||40} min - ${s.description||''}</div><button class="r" onclick="delService(${i})">Borrar</button></div>`).join('')||'Sin servicios'; }
function renderStaffList(){ $('#staffList').innerHTML=CUR.staff.map((s,i)=>`<div class="card" style="display:flex;gap:12px;align-items:center">${s.photo_url?`<img src="${s.photo_url}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div style="flex:1"><b>${s.name}</b><br>${s.specialty||''}</div><button class="r" onclick="delStaff(${i})">Borrar</button></div>`).join('')||'Sin equipo'; }
async function saveMarca(){ const patch={color:$('#eColor').value, logo_url:TMP_LOGO, banner_url:TMP_BANNER, description:$('#eDesc').value, instagram:$('#eIg').value, address:$('#eAddr').value, owner_whatsapp:$('#eWa').value, phone:$('#ePhone').value, admin_pin:$('#ePin').value, horario_inicio:$('#eHi').value, horario_fin:$('#eHf').value}; const r=await updateBusinessOnlyServices(CUR.slug, patch); if(r.ok){ alert('✅ Marca guardada'); await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); TAB='marca'; renderAdmin(CUR.slug); } else alert('Error: '+r.error); }
async function addService(){ const s={name:$('#sName').value, price:parseInt($('#sPrice').value||0), duration:parseInt($('#sDur').value), description:$('#sDesc').value}; if(!s.name) return; const newList=[...CUR.services, s]; const r=await updateBusinessOnlyServices(CUR.slug,{services:newList}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function delService(i){ const newList=CUR.services.filter((_,idx)=>idx!==i); const r=await updateBusinessOnlyServices(CUR.slug,{services:newList}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function addStaff(){ const s={name:$('#stName').value, photo_url:TMP_STAFF_PHOTO, specialty:$('#stSpec').value}; if(!s.name) return alert('Pone nombre'); const newStaff=[...CUR.staff, s]; const r=await updateBusinessOnlyServices(CUR.slug,{staff:newStaff}); if(r.ok){ alert('✅ Barbero guardado: '+s.name); await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); TAB='equipo'; renderAdmin(CUR.slug); } else alert('Error: '+r.error); }
async function delStaff(i){ const newStaff=CUR.staff.filter((_,idx)=>idx!==i); const r=await updateBusinessOnlyServices(CUR.slug,{staff:newStaff}); if(r.ok){ await loadBusinesses(); CUR=BUSINESSES.find(b=>b.slug===CUR.slug); renderAdmin(CUR.slug); } }
async function loadAgenda(){ const d=$('#agDate').value||SEL_DATE; try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(CUR.slug)+'&date=eq.'+d+'&order=time.asc'); const txt=await r.text(); if(!r.ok){ $('#agList').innerHTML='<div class="card" style="background:#fef2f2;color:#991b1b">⚠️ No existe la tabla bookings.</div>'; return; } const arr=JSON.parse(txt); $('#agList').innerHTML=arr.length?arr.map(x=>`<div class="card"><b>${x.time} - ${x.service}</b> ${x.staff_name?`con ${x.staff_name}`:''}<br>👤 ${x.client_name} - 📱 ${x.client_whatsapp}<br><button class="g" onclick="sendReminder(${x.id})">💬 Enviar recordatorio</button> <button class="r" onclick="delBooking(${x.id})">Borrar</button></div>`).join(''):'<p>Sin turnos ese día.</p>'; window._agenda=arr; }catch(e){ $('#agList').textContent='Error: '+e.message; } }
function sendReminder(id){ const b=window._agenda?.find(x=>x.id===id); if(!b) return; const msg=friendlyReminderMsg(CUR,b); window.open('https://wa.me/'+b.client_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); }
async function delBooking(id){ await api('bookings?id=eq.'+id,{method:'DELETE'}); loadAgenda(); }
async function renderClient(slug){
  await loadBusinesses();
  const b=BUSINESSES.find(x=>x.slug===slug);
  if(!b){ document.body.className='light'; $('#app').innerHTML='<h2>Negocio no encontrado</h2><button onclick="location.href=location.pathname">Volver a TurnoYa</button>'; return; }
  CUR=b; document.body.className='light';
  const color=b.color||'#22c55e';
  let slots=[];
  if(SEL_SERVICE){ const dur=SEL_SERVICE.duration||40; const [sh,sm]=b.horario_inicio.split(':').map(Number); const [eh,em]=b.horario_fin.split(':').map(Number); let curMin=sh*60+sm; const endMin=eh*60+em; while(curMin+dur<=endMin){ const hh=String(Math.floor(curMin/60)).padStart(2,'0'); const mm=String(curMin%60).padStart(2,'0'); slots.push(hh+':'+mm); curMin+=dur; } }
  let occupied=[]; if(CFG.url && SEL_DATE){ try{ const r=await api('bookings?select=*&business_slug=eq.'+encodeURIComponent(b.slug)+'&date=eq.'+SEL_DATE); const txt=await r.text(); if(r.ok) occupied=JSON.parse(txt); }catch(e){} }
  function isOccupied(slot){ if(!SEL_SERVICE) return false; const dur=SEL_SERVICE.duration||40; const [sh,sm]=slot.split(':').map(Number); const sMin=sh*60+sm; const eMin=sMin+dur; return occupied.some(o=>{ if(SEL_STAFF && o.staff_name && o.staff_name!==SEL_STAFF) return false; const [oh,om]=o.time.split(':').map(Number); const oMin=oh*60+om; const oEnd=oMin+40; return sMin < oEnd && eMin > oMin; }); }
  const step = !SEL_STAFF && b.staff.length?1 : !SEL_SERVICE?2 : !SEL_TIME?3 : 4;
  $('#app').innerHTML=`
  <div style="max-width:560px;margin:0 auto;padding:0 0 20px">
  <div class="hero">${b.banner_url?`<img src="${b.banner_url}" class="hero-img">`:`<div style="height:200px;background:linear-gradient(135deg,${color},#111)"></div>`}<div class="hero-overlay"></div><div class="hero-content">${b.logo_url?`<img src="${b.logo_url}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4)">`:''}<div style="color:#fff"><h2 style="margin:0;font-size:26px;line-height:1">${b.name}</h2><p style="margin:6px 0 0;opacity:.9">${b.description||''}</p><p style="margin:4px 0 0;font-size:13px;opacity:.8">${b.address||''} ${b.instagram?' • @'+b.instagram.replace('@',''):''} • ${b.horario_inicio} - ${b.horario_fin}</p><p style="margin:4px 0 0;font-size:13px">📱 ${b.phone||b.owner_whatsapp||''}</p></div></div></div>
  <div style="padding:0 14px">
  <div class="progress"><div class="${step>=1?'on':''}"></div><div class="${step>=2?'on':''}"></div><div class="${step>=3?'on':''}"></div><div class="${step>=4?'on':''}"></div></div>
  <div class="card"><h3 style="margin:0 0 10px">💈 1. Elegí tu barbero</h3>${b.staff.length?`<div style="display:flex;gap:10px;overflow:auto">`+b.staff.map(s=>`<div style="text-align:center;cursor:pointer;min-width:80px;border:${SEL_STAFF===s.name?'3px solid '+color:'2px solid #eee'};border-radius:16px;padding:10px" onclick="pickStaff('${s.name}')">${s.photo_url?`<img src="${s.photo_url}" class="staff-avatar">`:`<div style="width:64px;height:64px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">✂️</div>`}<div style="font-weight:700;margin-top:6px">${s.name}</div><div style="font-size:12px;color:#777">${s.specialty||''}</div></div>`).join('')+`</div> <button style="background:none;color:#777;padding:6px" onclick="pickStaff('')">Quitar selección</button>`:'<p style="color:#777">Sin equipo - reservás directo</p><button class="b" style="background:${color}" onclick="pickStaff(\'__ANY\')">Continuar sin elegir barbero →</button>'}</div>
  <div class="card"><h3 style="margin:0 0 10px">✂️ 2. Elegí servicio</h3>${b.services.map((s,i)=>`<div class="service-card ${SEL_SERVICE===s?'sel':''}" onclick="pickService(${i})"><div class="service-icon" style="background:${color}22;color:${color}">✂️</div><div style="flex:1"><b style="font-size:16px">${s.name}</b><br><span style="color:#777;font-size:13px">${s.description||''} • ${s.duration||40} min</span></div><b style="font-size:18px">$${s.price}</b></div>`).join('')}</div>
  <div class="card"><h3 style="margin:0 0 10px">📅 3. Fecha y hora</h3><input type="date" id="cDate" value="${SEL_DATE}" style="background:#f5f5f4"><div style="margin-top:10px">${SEL_SERVICE?slots.map(t=>`<span class="slot ${SEL_TIME===t?'sel':''} ${isOccupied(t)?'off':''}" style="${SEL_TIME===t?`background:${color};border-color:${color};color:#fff`:''}" onclick="pickTime('${t}',${isOccupied(t)})">${t}</span>`).join(''):'<span style="color:#777">Elegí servicio primero</span>'}</div></div>
  <div class="card" style="background:#111;color:#fff;border:none"><h3 style="margin:0 0 10px;color:#fff">✅ 4. Confirmar turno</h3><input id="cName" placeholder="Tu nombre" style="background:#27272a;border-color:#333"><input id="cWa" placeholder="Tu WhatsApp ej: 54911..." style="background:#27272a;border-color:#333"><button class="g" style="background:${color};width:100%;padding:16px;font-size:16px;color:#fff" onclick="book()">Reservar ${SEL_SERVICE?SEL_SERVICE.name+' - $'+SEL_SERVICE.price:''} ${SEL_TIME?' • '+SEL_DATE+' '+SEL_TIME:''}</button><p style="font-size:12px;color:#a1a1aa;text-align:center;margin:8px 0 0">Te llega confirmación por WhatsApp 💬</p></div>
  <p style="text-align:center;color:#aaa;font-size:12px"><a href="${location.pathname}" style="color:#aaa">← Ver todos los negocios</a> • ¿Tenés barbería? <a href="javascript:contactarTurnoYa()" style="color:#22c55e">Hablá con TurnoYa</a></p>
  </div></div>`;
  $('#cDate').onchange=()=>{ SEL_DATE=$('#cDate').value; SEL_TIME=null; renderClient(slug); };
}
function pickStaff(n){ if(n==='__ANY'){ SEL_STAFF=''; renderClient(CUR.slug); return; } SEL_STAFF=n; renderClient(CUR.slug); }
function pickService(i){ SEL_SERVICE=CUR.services[i]; SEL_TIME=null; renderClient(CUR.slug); }
function pickTime(t,off){ if(off) return; SEL_TIME=t; renderClient(CUR.slug); }
async function book(){
  if(!SEL_SERVICE||!SEL_TIME) return alert('Elegí servicio y hora');
  const name=$('#cName').value.trim(); const wa=$('#cWa').value.trim(); if(!name||!wa) return alert('Pone nombre y WhatsApp');
  if(!CUR.owner_whatsapp) return alert('⚠️ Este negocio todavía no cargó su WhatsApp, avisale al dueño');
  const payload={business_slug:CUR.slug, business_name:CUR.name, service:SEL_SERVICE.name, price:SEL_SERVICE.price, date:SEL_DATE, time:SEL_TIME, staff_name:SEL_STAFF||'', client_name:name, client_whatsapp:wa, owner_whatsapp:CUR.owner_whatsapp, status:'pendiente'};
  let p={...payload};
  for(let i=0;i<5;i++){ const r=await api('bookings',{method:'POST', body:JSON.stringify(p)}); const txt=await r.text(); if(r.ok){ alert('✅ Turno guardado y asignado!'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name); window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); renderClient(CUR.slug); return; } let j; try{j=JSON.parse(txt)}catch(e){j={message:txt}} const m=(j.message||'').match(/Could not find the '([^']+)' column/); if(m){ delete p[m[1]]; continue; } if((j.message||'').includes('bookings') && (j.message||'').includes('does not exist')){ alert('⚠️ Falta la tabla bookings en Supabase, pero igual te abro WhatsApp para que no pierdas el turno'); const msg=friendlyBookingMsg(CUR, SEL_SERVICE, SEL_DATE, SEL_TIME, SEL_STAFF, name); window.open('https://wa.me/'+CUR.owner_whatsapp+'?text='+encodeURIComponent(msg),'_blank'); return; } alert('Error: '+txt); return; }
}
render();
</script></body></html>
